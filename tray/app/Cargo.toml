[package]
name = "bili-tray-app"
description = "BiliTray — system-tray indicator for a running billion-context proxy (windowless; menu + tooltip only)."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = "2"

[dependencies]
bili-tray-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
