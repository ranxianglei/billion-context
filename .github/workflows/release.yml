name: Release

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check if release branch merge
        id: check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          MERGE_BRANCH=$(echo "$COMMIT_MSG" | sed -n 's/^Merge pull request #[0-9]* from [^/]*\/\(.*\)$/\1/p' || echo "")
          if echo "$MERGE_BRANCH" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}_release-v'; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}_release-v'; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Full CI dispatch (missing lanes, publish sha)
        # Policy (2026-10-10, after the v0.1.192 carve-out): every release
        # channel must run the COMPLETE CI set at the exact publish sha before
        # npm publish. This merge already ran all lanes as a PR — dispatch only
        # whatever has no run here (idempotent); the Full CI gate step before
        # Create tag blocks publish until all lanes are green. EXTRA_MATCH_SHAS
        # reuses the PR-head green runs (HEAD^2), so a normal PR release pays
        # zero extra CI — same semantics as branch-protection required checks.
        if: steps.check.outputs.is_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GITHUB_SHA="$(git rev-parse HEAD)"
          EXTRA_MATCH_SHAS="$(git rev-parse HEAD^2 2>/dev/null || true)"
          export GITHUB_SHA EXTRA_MATCH_SHAS
          node scripts/release-ci-gate.mjs --dispatch

      - name: Setup
        if: steps.check.outputs.is_release == 'true'
        run: npm ci

      - name: Build and test
        if: steps.check.outputs.is_release == 'true'
        # keep the claude-native live e2e subtests in this pre-publish gate (#1248)
        env:
          ACP_TEST_CLAUDE_NATIVE: "1"
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Read version
        if: steps.check.outputs.is_release == 'true'
        id: version
        run: |
          V="$(node -p "require('./package.json').version")"
          case "$V" in
            0.0.*)
              echo "::error::package.json version $V is below 0.1.0 — official releases must always sort above the 0.0.x PR-build line (#1385)"
              exit 1
              ;;
          esac
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Check if prerelease
        if: steps.check.outputs.is_release == 'true'
        id: pre
        run: |
          if echo "${{ steps.version.outputs.version }}" | grep -q '-'; then
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify release-notes entry (#1870)
        # Policy (2026-10-04 revision of #1870): entries are OPT-IN severity
        # declarations — only severe releases need one; ordinary releases ship
        # silently with NO entry. Missing entry => notice + pass; present
        # entry => validated and logged.
        if: steps.check.outputs.is_release == 'true' && steps.pre.outputs.prerelease == 'false'
        run: |
          VER="${{ steps.version.outputs.version }}"
          node -e "
            const notes = require('./release-notes/package.json').billionContextReleaseNotes;
            const entry = notes && notes.releases && notes.releases.find((e) => e.version === process.argv[1]);
            if (!entry) {
              console.log('::notice::release ' + process.argv[1] + ' has no release-notes entry — shipping silently (entries are opt-in; only severe releases need one). See release-notes/README.md (#1870).');
              process.exit(0);
            }
            console.log('release-notes entry ok:', entry.version, '[' + entry.tier + ']', entry.summary.slice(0, 80));
          " "$VER"

      - name: Full CI gate (all lanes green at this sha)
        # Hard precondition for publish: every required lane green at the
        # publish sha (or reused green PR-head run). Any red lane or timeout
        # ⇒ release fails, nothing is published.
        if: steps.check.outputs.is_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GATE_TIMEOUT_MIN: "60"
        run: |
          GITHUB_SHA="$(git rev-parse HEAD)"
          EXTRA_MATCH_SHAS="$(git rev-parse HEAD^2 2>/dev/null || true)"
          export GITHUB_SHA EXTRA_MATCH_SHAS
          node scripts/release-ci-gate.mjs --wait

      - name: Create tag
        if: steps.check.outputs.is_release == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}" || true
          git push origin "v${{ steps.version.outputs.version }}" || true

      - name: Publish
        if: steps.check.outputs.is_release == 'true'
        run: npm publish --tag ${{ steps.pre.outputs.tag }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.check.outputs.is_release == 'true'
        run: |
          VER="${{ steps.version.outputs.version }}"
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"v${VER}\",\"name\":\"v${VER}\",\"prerelease\":${{ steps.pre.outputs.prerelease }},\"generate_release_notes\":true}"
