name: CI Run Janitor

# 2026-10-30 incident: 29 queued/in-progress runs starved for 8 hours behind
# zombies — runs from deleted branches, stale schedule runs, and hung
# in-progress jobs. Nothing ever reaped them, so every live check (including
# PR required checks) sat behind the pile. This lane sweeps hourly and cancels:
#   - queued runs older than QUEUE_MAX (default 120 min) — a queued GitHub
#     hosted job starts within seconds of capacity; 2h queued means the run
#     is starved, not slow
#   - in_progress runs older than PROGRESS_MAX (default 240 min) — the slowest
#     legit lane (windows test shard) measured ~21 min; 4h running is a hang
#   - any queued/in_progress pull_request run whose head branch no longer
#     exists (deleted-branch zombies), regardless of age
#   - BACKLOG BREAKER (2026-10-31 incident): when the queue itself is
#     overloaded (more than starvedQueueLimit runs queued), EVERY queued run
#     older than starvedQueuedMaxMinutes (default 60) is cancelled — the 2026-10-31
#     post-mortem showed queue DEPTH is what stalls dispatch for the whole repo
#     (236 queued runs sat at ~0 in_progress until the backlog was drained
#     manually); draining early beats waiting out a multi-hour snowball.
# master's own push runs are NEVER cancelled (they are the head's only
# required checks — cancelling would delete that signal for good); a starving
# master run is reported as a workflow warning instead.

on:
  schedule:
    # hourly at :57 — just ahead of the :03/:33 CI crons so a sweep clears
    # the queue before the next scheduled burst lands
    - cron: '57 * * * *'
  workflow_dispatch:
    inputs:
      queuedMaxMinutes:
        description: "Cancel queued runs older than this many minutes"
        default: "120"
        required: false
      progressMaxMinutes:
        description: "Cancel in_progress runs older than this many minutes"
        default: "240"
        required: false
      dryRun:
        description: "Log what would be cancelled without cancelling"
        type: boolean
        default: false
      starvedQueueLimit:
        description: "Starvation alert when more than this many runs sit queued at once (healthy-day ceiling is a low double digit)"
        default: "30"
        required: false
      starvedQueuedMaxMinutes:
        description: "BACKLOG BREAKER: while the queue is overloaded (> starvedQueueLimit), also cancel queued runs older than this many minutes (0 disables)"
        default: "60"
        required: false

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-run-janitor
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel starved CI runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_ID: ${{ github.run_id }}
          QUEUE_MAX: ${{ inputs.queuedMaxMinutes || '120' }}
          PROGRESS_MAX: ${{ inputs.progressMaxMinutes || '240' }}
          DRY_RUN: ${{ inputs.dryRun && '1' || '' }}
          STARVED_QUEUE: ${{ inputs.starvedQueueLimit || '30' }}
          STARVED_QUEUE_MAX: ${{ inputs.starvedQueuedMaxMinutes || '60' }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          cancelled=0
          warned=0

          collect() {
            gh api --paginate --jq '.workflow_runs[] | [.id, .status, .created_at, .event, (.head_branch // "")] | @tsv' \
              "repos/$REPO/actions/runs?status=$1&per_page=100"
          }
          { collect queued; collect in_progress; } | sort -u > /tmp/janitor-runs.tsv

          # Runner-starvation circuit breaker (2026-10-31 incident): this sweep
          # reaps zombies but CANNOT create capacity. When the queue balloons far
          # past healthy-day depth, the problem is GitHub's hosted allocation
          # throttling itself, not individual hangs — the 2026-10-31 runs waited
          # up to ~3.5 h queued before their 2-8 min jobs ever started, and this
          # very lane's ticks sat in that same queue (self-starvation). Surface it
          # loudly so a human can intervene (check Actions billing/runner capacity,
          # manually prune redundant runs: `gh run list --jq ...` + `gh run cancel`)
          # instead of watching every required check stall silently for hours.
          queued_count=$(awk -F'\t' '$2 == "queued"' /tmp/janitor-runs.tsv | wc -l)
          inprogress_count=$(awk -F'\t' '$2 == "in_progress"' /tmp/janitor-runs.tsv | wc -l)
          starve_mode=0
          if [ "$queued_count" -gt "$STARVED_QUEUE" ]; then
            starve_mode=1
            by_event=$(awk -F'\t' '$2 == "queued" { c[$4]++ } END { for (e in c) printf "%s=%d ", e, c[e] }' /tmp/janitor-runs.tsv)
            oldest_queued=$(awk -F'\t' '$2 == "queued" { print $3 " run="$1 }' /tmp/janitor-runs.tsv | sort | head -1 || true)
            starve_note=$([ "$STARVED_QUEUE_MAX" -gt 0 ] && printf 'queued runs older than %sm are cancelled below to break the snowball' "$STARVED_QUEUE_MAX" || printf 'breaker disabled (starvedQueuedMaxMinutes=0), no auto-cancel in this sweep')
            echo "::warning::RUNNER STARVATION: ${queued_count} runs queued at once (healthy ceiling ${STARVED_QUEUE}; in_progress=${inprogress_count}) [${by_event}] oldest='${oldest_queued:-n/a}' — 2026-10-31 incident class: backlog DEPTH itself stalls dispatch for this repo; ${starve_note}."
          else
            echo "queue depth ok (queued=${queued_count} in_progress=${inprogress_count} ceiling=${STARVED_QUEUE})"
          fi
          # BUGFIX 2026-10-31: the original release of this lane forgot the input
          # redirection here — `while read` on stdin never iterates inside an
          # Actions job, so EVERY rule below (zombie reap, age limits, master
          # warnings) was dead code from day one (2026-10-30). Feed the collected
          # list explicitly.
          while IFS=$'\t' read -r id status created event branch; do
            if [ "$id" = "$SELF_ID" ]; then continue; fi
            age_min=$(( (now - $(date -d "$created" +%s)) / 60 ))

            if [ "$event" = "push" ] && [ "$branch" = "master" ]; then
              echo "::warning::master push run $id ($status, ${age_min}m old) is starved — not cancelling (head's required checks)"
              warned=$((warned + 1))
              continue
            fi

            reason=""
            if [ "$event" = "pull_request" ] && [ -n "$branch" ]; then
              if ! gh api "repos/$REPO/branches/$branch" >/dev/null 2>&1; then
                reason="head branch '$branch' deleted"
              fi
            fi
            if [ -z "$reason" ] && [ "$status" = "queued" ] && [ "$starve_mode" = "1" ] && [ "$STARVED_QUEUE_MAX" -gt 0 ]; then
              # Backlog breaker: under overload the usual QUEUE_MAX patience
              # makes the snowball bigger — drain the old waiting room early.
              if [ "$age_min" -ge "$STARVED_QUEUE_MAX" ]; then
                reason="queued ${age_min}m >= ${STARVED_QUEUE_MAX}m while queue overloaded (${queued_count} > ${STARVED_QUEUE})"
              fi
            fi
            if [ -z "$reason" ]; then
              limit=$([ "$status" = "queued" ] && echo "$QUEUE_MAX" || echo "$PROGRESS_MAX")
              if [ "$age_min" -ge "$limit" ]; then
                reason="$status ${age_min}m >= ${limit}m"
              fi
            fi
            if [ -z "$reason" ]; then
              continue
            fi

            echo "cancel run $id ($event, branch '$branch'): $reason"
            if [ -n "$DRY_RUN" ]; then
              continue
            fi
            if ! gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null 2>&1; then
              echo "::warning::cancel of $id failed (run may have just transitioned)"
            fi
            cancelled=$((cancelled + 1))
          done < /tmp/janitor-runs.tsv
          echo "janitor sweep done (cancelled=$cancelled master_warned=$warned starve_mode=$starve_mode dry_run=${DRY_RUN:-no})"
