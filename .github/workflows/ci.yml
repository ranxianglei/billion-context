name: CI

on:
  push:
    # Release branches also run CI on push: ref updates made with a real
    # account token (agent/human-driven release branches) deliver the push
    # event, and those check runs satisfy required-status-checks on the head
    # sha even when the PR's own runs sit in `action_required` (bot-authored
    # PRs are gated there) (#772). Note: pushes made with GITHUB_TOKEN from
    # within Actions deliver NO push events — for those, the one-click
    # workflow compensates via workflow_dispatch below.
    branches: [master, "*_release-v*"]
  pull_request:
    branches: [master]
  # One-click release fallback: GitHub suppresses push-event delivery for
  # ref updates made with GITHUB_TOKEN, so the push trigger above never fires
  # on one-click fallback branches (#1744). release-manual.yml compensates by
  # explicitly dispatching this workflow on the fallback branch; the check
  # runs land on the same head sha and make the auto-PR mergeable once green
  # (#772, #1744).
  workflow_dispatch: {}

# Same-ref runs cancel superseded in-flight runs: a follow-up push to a
# branch (bump -> merge master into a release branch, rapid PR pushes,
# back-to-back master merges) no longer queues a full ~30-job matrix
# behind its own predecessor. Groups are per workflow+ref, so different
# branches and different workflows never cancel each other. Approved by
# owner 2026-10-10 after the release-v0.1.191 CI queue piled up behind
# same-ref reruns.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #2637 plan #8 (owner-approved): fail-fast tiering — the ~0-1m guards gate
  # the four platform legs so a broken commit stops in tier 1 instead of
  # paying 4x(install+typecheck+suites+build). Guards with `if: pull_request`
  # skip on push/dispatch (skipped needs count as satisfied). Behavior change:
  # on guard failure the required legs show pending (not red); merge blocked.
  # #3143: the suite outgrew one runner — ~656 top-level files (~190k LOC) now
  # serialize through c=4 on a single 4-core leg for ~17-20 min (windows slowest;
  # measured 1225s on the last full green run). Sharding spreads the SAME files
  # across more legs: each runs a balanced slice (scripts/run-ci-tests.mjs partitions
  # deterministically + totally, so union of shards == allFiles, nothing skipped,
  # same tests/assertions/env, c=4 within each shard). Wall drops ~3x (~20 -> ~7min)
  # with zero coverage loss. To go faster, add entries to the list AND bump the "/3"
  # below together (they must stay equal).
  test:
    needs: [version-guard, kernel-guard, pi-subagents-guard, lane-guard, docs-sync, docs-coverage, unused-exports, lock-sync, test-import-graph]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
        shard: [1, 2, 3]   # keep in sync with CI_TEST_SHARD "<i>/3" below
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --ignore-scripts --no-fund --no-audit
      # #2816: explicit file concurrency=4 for the whole suite. Baseline logs
      # show the old default (availableParallelism()-1) already ran several
      # suites at once, and a measured two-phase prototype proved a serial
      # "live" phase only idles the other cores for 3-4 min without buying
      # stability — live/process suites have run mixed with the rest on these
      # dedicated runners for months (#1248 gates loaded local sandboxes, not
      # CI). The script keeps a LIVE_FILES self-check: any NEW
      # process-spawning suite fails the job until registered there (#1248
      # review). Same tests/assertions/env — scheduling only.
      # ACP_TEST_CLAUDE_NATIVE keeps the claude-native live e2e subtests
      # running here: the runner is dedicated, so their process/port
      # observations are reliable.
      - run: node scripts/run-ci-tests.mjs
        env:
          ACP_TEST_CLAUDE_NATIVE: "1"
          CI_TEST_SHARD: "${{ matrix.shard }}/3"   # denominator MUST equal matrix.shard length

  # #2816: typecheck + the in-repo component suites + the bundle build used
  # to run sequentially in front of the test job (~90s of critical path per
  # leg). They are independent of the proxy test suites, so they run as
  # parallel legs on the same matrix — same commands, off the critical path.
  static-gates:
    needs: [version-guard, kernel-guard, pi-subagents-guard, lane-guard, docs-sync, docs-coverage, unused-exports, lock-sync, test-import-graph]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --ignore-scripts --no-fund --no-audit
      - run: npm run typecheck
      # Kernel boundary (#2092): the kernel's own unit suite against its TS
      # source — both test layers must be green on every PR (AGENTS.md rule 5).
      - run: npm --prefix kernel test
      # Pi-subagents boundary (#2384): same two-layer rule for the in-repo
      # pi-lane component — its own unit suite against its TS source.
      - run: npm --prefix pi-subagents test
      - run: npm run build

  version-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version field only changes on release branches
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF}"
          # Release + bugfix carve-out branches (#2851/#2853) may bump version — one isolated 'release v{VERSION}' commit each.
          if [[ "$BRANCH" == *_release-v* || "$BRANCH" == bugfix-release/* ]]; then
            echo "✓ release branch ($BRANCH) — version changes allowed"
            exit 0
          fi
          # Non-release branches must NOT touch the "version" field.
          if git diff origin/master...HEAD -- package.json | grep -Eq '^[+-][[:space:]]*"version"[[:space:]]*:'; then
            echo "::error::\"version\" in package.json was changed on a non-release branch ($BRANCH)."
            echo "Version bumps must go on a dedicated *_release-v* branch with an isolated 'release v{VERSION}' commit. See AGENTS.md §4 'Version Bumps'."
            exit 1
          fi
          echo "✓ version field untouched on non-release branch ($BRANCH)"

  kernel-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify kernel boundary rules (#2092)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF}"
          # Kernel release branches bump kernel/package.json alone by design.
          if [[ "$BRANCH" == *_release-kernel-v* ]]; then
            echo "✓ kernel release branch ($BRANCH) — kernel version changes allowed"
            exit 0
          fi
          # Rule 1: any PR touching kernel/** must declare 'kernel-change:' in its body.
          if git diff --name-only origin/master...HEAD -- kernel/ | grep -q .; then
            if ! printf '%s' "$PR_BODY" | grep -q 'kernel-change:'; then
              echo "::error::This PR modifies kernel/ but does not declare 'kernel-change: <reason>' in its body."
              echo "Kernel changes are human-gated: owner approval plus explicit declaration required. See AGENTS.md 'Kernel Boundary'."
              exit 1
            fi
            echo "✓ kernel-change marker present"
          fi
          # Rule 2: version discipline — kernel source/build-config changes require a
          # kernel/package.json version bump, and a bump requires source changes.
          SRC_CHANGED=0
          if git diff --name-only origin/master...HEAD -- kernel/src kernel/tsup.config.ts kernel/tsconfig.json | grep -q .; then
            SRC_CHANGED=1
          fi
          BUMPED=0
          if git diff origin/master...HEAD -- kernel/package.json | grep -Eq '^[+-][[:space:]]*"version"[[:space:]]*:'; then
            BUMPED=1
          fi
          if [[ "$SRC_CHANGED" == 1 && "$BUMPED" != 1 ]]; then
            echo "::error::kernel/ source changed without bumping the version in kernel/package.json."
            echo "Bump the kernel version so accumulated changes can ship as an independent acp-kernel release later."
            exit 1
          fi
          if [[ "$BUMPED" == 1 && "$SRC_CHANGED" != 1 ]]; then
            echo "::error::kernel/package.json version bumped without any kernel/ source change."
            exit 1
          fi
          echo "✓ kernel version discipline OK"

  # #2384: version discipline for the vendored pi-lane component — a commit IS
  # the pin, so accumulated changes can later ship as an independent
  # billion-context-pi-subagents release. Deliberately lighter than kernel-guard:
  # no PR-body declaration / human gate (fast-moving extension surface, not
  # load-bearing core compression).
  pi-subagents-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pi-subagents version discipline (#2384)
        run: |
          set -euo pipefail
          SRC_CHANGED=0
          if git diff --name-only origin/master...HEAD -- pi-subagents/src pi-subagents/tsup.config.ts pi-subagents/tsconfig.json | grep -q .; then
            SRC_CHANGED=1
          fi
          BUMPED=0
          if git diff origin/master...HEAD -- pi-subagents/package.json | grep -Eq '^[+-][[:space:]]*"version"[[:space:]]*:'; then
            BUMPED=1
          fi
          if [[ "$SRC_CHANGED" == 1 && "$BUMPED" != 1 ]]; then
            echo "::error::pi-subagents/ source changed without bumping the version in pi-subagents/package.json."
            echo "Bump the component version so accumulated changes can ship as an independent billion-context-pi-subagents release later."
            exit 1
          fi
          if [[ "$BUMPED" == 1 && "$SRC_CHANGED" != 1 ]]; then
            echo "::error::pi-subagents/package.json version bumped without any pi-subagents/ source change."
            exit 1
          fi
          echo "✓ pi-subagents version discipline OK"

  # #2107 drift guard A: the config docs are generated from
  # website/config-reference/*.yaml (single source). Regenerate and fail when
  # the committed artifacts differ — a schema edit without re-running the
  # generator goes red here. Zero-dep script: no npm install needed.
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/gen-config-docs.mjs generate
      - name: Fail on artifact drift
        run: git diff --exit-code -- CONFIGURATION.md CONFIGURATION.zh-CN.md website/main.js website/docs/index.html

  # #2107 drift guard B: every BILI_*/ACP_* env var read in src/ and every
  # FileConfig top-level key must have a seed entry — an undocumented param
  # added to src goes red here with the missing names listed.
  docs-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/gen-config-docs.mjs check-coverage

  # #2643 config-surface guard: closes the two surfaces check-coverage above
  # does not reach — nested config-file leaf fields (only top-level keys were
  # enforced) and CLI --flags (never checked). An undocumented addition goes red
  # here with the missing names listed. Zero-dep: plain node, no install step.
  # Not gated to pull_request so master pushes are held to the same surface.
  config-surface-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/config-surface-guard.mjs

  # #2170 lane guard: the side-lane decision (#388 passthrough — src/server/
  # side-request.ts + the lane region of src/server/handle.ts, extracted from
  # src/server.ts by #1440) is regression-critical
  # (the #2156/#2157/#2164 chain). Changing it without touching its dedicated
  # suites has silently shipped regressions before; this job makes the pairing
  # mechanical: lane logic moves ⇔ a side-lane suite moves with it.
  lane-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Side-lane test discipline (#2170)
        run: |
          set -euo pipefail
          LANE_SUITE_RE='tests/(fork-side-request-lane|side-lane-truth-table|side-lane-invariants|side-request-isolation)\.test\.ts'
          # Lane logic = src/server/side-request.ts, or lane-symbol lines in
          # src/server.ts / src/server/handle.ts (#1440 extraction moved the
          # lane region into handle.ts — #2554 review closed that blind spot).
          LANE_DIFF=""
          LANE_SYMBOLS='demotedSide|sideIntent|sideRequestLike|demoteGate|resolveSideLane|SIDE_REQUEST_MAX_TOKENS|isSideRequest|isDshTitleRequest|DSH_TITLE_SYSTEM_PREFIX|stripLeakedBiliTools|side request|side passthrough|sidePassthrough|side-lane'
          if git diff origin/master...HEAD -- src/server/side-request.ts | grep -qE '^[+-]'; then
            LANE_DIFF="src/server/side-request.ts"
          fi
          if git diff origin/master...HEAD -- src/server.ts | grep -Eq "^[+-].*($LANE_SYMBOLS)"; then
            LANE_DIFF="${LANE_DIFF:+$LANE_DIFF, }src/server.ts (lane symbols)"
          fi
          if git diff origin/master...HEAD -- src/server/handle.ts | grep -Eq "^[+-].*($LANE_SYMBOLS)"; then
            LANE_DIFF="${LANE_DIFF:+$LANE_DIFF, }src/server/handle.ts (lane symbols)"
          fi
          if [[ -z "$LANE_DIFF" ]]; then
            echo "✓ no side-lane logic changes"
            exit 0
          fi
          echo "side-lane logic changed: $LANE_DIFF"
          if git diff --name-only origin/master...HEAD | grep -Eq "$LANE_SUITE_RE"; then
            echo "✓ side-lane suites updated alongside lane logic"
            exit 0
          fi
          echo "::error::Side-lane logic changed without updating any dedicated side-lane suite ($LANE_SUITE_RE)."
          echo "The lane gates are truth-table-pinned (tests/side-lane-truth-table.test.ts) and behavior-pinned (tests/side-lane-invariants.test.ts, fork-side-request-lane, side-request-isolation) — a gate edit must land with the suite edit. See #2170."
          exit 1

  # #1440 P6: mechanical defense against export bloat — fails when a non-entry
  # source file exports a symbol nobody references outside its own file
  # (DEAD = definition line only; INTERNAL_ONLY = own file only). Zero-dep:
  # plain node, no install step.
  unused-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-unused-exports.mjs

  # #2989: test-import-graph gate — fails when a test file imports a src module
  # absent from the production import graph (the tsup entries). A green suite
  # over a retired module guarantees nothing about the wired path (#2988
  # finding ① shipped while every persona-anchor pin stayed green). Intentional
  # exceptions are explicit: the script's WHITELIST (test-only registries) or a
  # "// retired-module pin: <module>" label in the importing test file.
  # Zero-dep: plain node, no install step.
  test-import-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-test-import-graph.mjs

  # #2704 drift guard: package-lock.json must track the version fields of the
  # package.json files it records (root bili + the in-repo file: links
  # kernel/, pi-subagents/). Bumping package.json does NOT regenerate the lock —
  # only `npm install` does — so a bump that skips regen leaves it stale
  # (#2704: root 0.1.190 vs 0.1.191, kernel 0.0.112 vs 0.0.114); regenerate and
  # fail on any residual diff (idempotent when already synced). Deliberately NOT
  # gated to pull_request (unlike version-guard/kernel-guard) so master pushes
  # and release-branch bumps are held to it too — mechanical enforcement of
  # AGENTS.md §4 rule 2 ("release commit changes ONLY version + lock if drifts").
  lock-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Fail on lockfile version drift
        run: git diff --exit-code -- package-lock.json
