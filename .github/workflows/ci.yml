name: CI

on:
  push:
    # Release branches also run CI on push: bot-authored auto-PRs can sit in
    # `action_required` (manual approval gate), but check runs from the push
    # event satisfy required-status-checks on the same sha → the auto-PR is
    # mergeable without approving the PR-triggered runs (#772).
    branches: [master, "*_release-v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --ignore-scripts --no-fund --no-audit
      - run: npm run typecheck
      # ACP_TEST_CLAUDE_NATIVE keeps the claude-native live e2e subtests
      # running here: the runner is dedicated, so their process/port
      # observations are reliable (#1248 gates them off for loaded local
      # sandboxes only).
      - run: npm test
        env:
          ACP_TEST_CLAUDE_NATIVE: "1"
      - run: npm run build

  version-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version field only changes on release branches
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF}"
          # Release branches are allowed to bump version.
          if [[ "$BRANCH" == *_release-v* ]]; then
            echo "✓ release branch ($BRANCH) — version changes allowed"
            exit 0
          fi
          # Non-release branches must NOT touch the "version" field.
          if git diff origin/master...HEAD -- package.json | grep -Eq '^[+-][[:space:]]*"version"[[:space:]]*:'; then
            echo "::error::\"version\" in package.json was changed on a non-release branch ($BRANCH)."
            echo "Version bumps must go on a dedicated *_release-v* branch with an isolated 'release v{VERSION}' commit. See AGENTS.md §4 'Version Bumps'."
            exit 1
          fi
          echo "✓ version field untouched on non-release branch ($BRANCH)"
