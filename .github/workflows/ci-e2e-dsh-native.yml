name: e2e-native-dsh

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-native-dsh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-native-dsh:
    name: real dsh headless profile lane vs deterministic fake upstream (zero tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Transient runner↔registry blips (ECONNRESET) must not red a PR (#2611):
    # raise npm's built-in fetch retry (default 2) so a ~10s jitter rides out
    # instead of aborting setup. Job-level → covers every registry op here
    # (global CLI install AND `npm ci`). Bounded: worst case ~+2 min before a
    # genuine sustained outage still fails fast.
    env:
      npm_config_fetch_retries: '5'
      npm_config_fetch_retry_mintimeout: '5000'
      npm_config_fetch_retry_maxtimeout: '60000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pinned like pi-stable in ci-e2e-native.yml (#1246): dsh's profile/
      # bundle API surface must not drift under this suite. Bump deliberately
      # after re-running the suite locally on the new version.
      - name: Install dsh CLI
        # 0.2.0-rc.2: the persona lane needs `--session-id` (session adoption
        # across runs — the #2241 model-switch shape). The base lane below was
        # verified against this version too.
        run: npm i -g @deepseek-ai/dsh@0.2.0-rc.2

      - name: Print dsh version
        run: dsh --version

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run real-dsh native-lane compression E2E
        env:
          E2E_DSH_BIN: dsh
        run: |
          ACP_TEST_E2E_DSH_NATIVE=1 node --import tsx --test tests/e2e/e2e-native-dsh.test.ts
          ACP_TEST_E2E_DSH_NATIVE=1 node --import tsx --test tests/e2e/e2e-native-dsh-persona.test.ts

      - name: Collect E2E artifacts
        if: failure()
        run: |
          mkdir -p tmp/e2e-artifacts
          for d in tmp/e2e-native-dsh-*; do [ -d "$d" ] && cp -r "$d" tmp/e2e-artifacts/ || true; done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-native-dsh-artifacts
          path: tmp/e2e-artifacts
          if-no-files-found: ignore
