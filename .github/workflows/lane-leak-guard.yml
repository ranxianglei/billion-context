name: Lane leak guard (bugfix-v* must never absorb unshipped master)

on:
  push:
    branches: ["bugfix-v*"]

permissions:
  contents: read

jobs:
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No merge may bring master's unshipped work into a lane
        # A lane = a released TAG + carried fix commits ONLY. If someone ever
        # MERGES master into a lane, every feature that landed since the base
        # tag ships out through the next one-click publish — the exact leak
        # the dual-lane model exists to prevent. Carries are cherry-picks
        # (-x, different SHAs), so a clean lane contains no merge whose second
        # parent is a master ancestor. Scan window = <base tag>..HEAD: covers
        # exactly the commits the lane adds over its released base, and stays
        # silent automatically once master catches up past the ship PR.
        # (The earlier `--not --tags` baseline silently dropped these commits
        # in some git forms — verified by simulation; window scan verified
        # both directions: alarms on a master merge, passes a legit carry.)
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME#refs/heads/}"
          git fetch -q origin master --tags
          BASE_TAG="$(git describe --match 'v[0-9]*' --tags --abbrev=0 HEAD || true)"
          [ -n "$BASE_TAG" ] || { echo "::error::cannot find the lane's base tag — refusing to skip the scan"; exit 1; }
          # A lane deliberately cut from aligned MASTER (v3 epoch-1 transition, #4660)
          # carries master's post-tag merges BY DESIGN — scanning from the base tag
          # would flag them as leaks (and its "rebuild from the tag" advice would
          # re-inherit the stale pre-v3 workflow file). When the lane forked from
          # master strictly AFTER its base tag, rescan from the fork point: the
          # window then covers exactly the commits the lane adds over master.
          FORK="$(git merge-base HEAD origin/master 2>/dev/null || true)"
          BASE_SHA="$(git rev-parse "${BASE_TAG}^{commit}")"
          if [ -n "$FORK" ] && [ "$FORK" != "$BASE_SHA" ] && git merge-base --is-ancestor "$BASE_SHA" "$FORK"; then
            echo "::notice::$BRANCH forked from master at ${FORK:0:12} (strictly past base tag $BASE_TAG) — scanning ${FORK:0:12}..HEAD instead"
            BASE_TAG="$FORK"
          fi
          LEAKS="$(git log --format=%H --merges "${BASE_TAG}..HEAD" \
            | while read -r M; do
                P2="$(git rev-parse "${M}^2" 2>/dev/null || echo "")"
                if [ -n "$P2" ] && git merge-base --is-ancestor "$P2" origin/master; then
                  echo "$M $(git log -1 --format=%s "$M")"
                fi
              done)"
          if [ -n "$LEAKS" ]; then
            echo "::error::lane leak detected on $BRANCH — a merge pulled master's UNRELEASED work into the patch lane:"
            printf '%s\n' "$LEAKS"
            echo "Fix: rebuild the lane from its base tag and re-apply the intended fixes as PICKS (label the source PR 'backport', or cherry-pick by hand). Never merge master into a lane."
            exit 1
          fi
          echo "no lane leaks on $BRANCH since ${BASE_TAG} (all merge commits have non-master second parents)"
