name: Master Build Artifact

on:
    push:
        branches: [master]

permissions:
    contents: read
    pull-requests: write

jobs:
    build-artifact:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Check if release merge
              id: check
              run: |
                # Release merges publish their real version through release.yml
                # (latest/dev dist-tags + git tag + GitHub Release) — skip them so
                # the master lane never double-publishes a commit (#2049).
                COMMIT_MSG=$(git log -1 --pretty=%B)
                MERGE_BRANCH=$(echo "$COMMIT_MSG" | sed -n 's/^Merge pull request #[0-9]* from [^/]*\/\(.*\)$/\1/p' || echo "")
                if echo "$MERGE_BRANCH" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}_release-v'; then
                    echo "is_release=true" >> $GITHUB_OUTPUT
                elif echo "$COMMIT_MSG" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}_release-v'; then
                    echo "is_release=true" >> $GITHUB_OUTPUT
                else
                    echo "is_release=false" >> $GITHUB_OUTPUT
                fi

            - uses: actions/setup-node@v4
              if: steps.check.outputs.is_release == 'false'
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              if: steps.check.outputs.is_release == 'false'
              run: npm install --ignore-scripts --no-fund --no-audit

            - name: Build
              if: steps.check.outputs.is_release == 'false'
              run: npm run build

            - name: Publish to npm with rolling master tag
              if: steps.check.outputs.is_release == 'false'
              id: publish
              run: |
                  RUN_NUMBER="${{ github.run_number }}"
                  RUN_ATTEMPT="${{ github.run_attempt }}"
                  # Monotonic temp version (#1385): the 0.0.<run_number> base never
                  # collides with real releases (which stay >= 0.1.0, enforced by
                  # the release drift guards), sorts below every release, and the
                  # -master prerelease suffix keeps it unresolvable by any semver
                  # range — builds are addressed by their full version string or
                  # the rolling master tag. run_number is unique+monotonic per
                  # workflow (gaps OK) and this workflow is the sole 0.0.x-master
                  # publisher; -a<attempt> makes a rerun of one run publish a
                  # fresh version instead of E409.
                  MASTER_VERSION="0.0.${RUN_NUMBER}-master.${GITHUB_SHA:0:7}"
                  if [ "$RUN_ATTEMPT" != "1" ]; then
                      MASTER_VERSION="${MASTER_VERSION}-a${RUN_ATTEMPT}"
                  fi
                  echo "Publishing version $MASTER_VERSION with rolling tag master"
                  npm version "$MASTER_VERSION" --no-git-tag-version
                  npm publish --tag master --access public --ignore-scripts
                  echo "version=${MASTER_VERSION}" >> "$GITHUB_OUTPUT"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Comment the published version on the merged PR
              if: steps.check.outputs.is_release == 'false' && steps.publish.outputs.version != ''
              uses: actions/github-script@v7
              env:
                  PUBLISHED_VERSION: ${{ steps.publish.outputs.version }}
              with:
                  script: |
                      const publishedVersion = process.env.PUBLISHED_VERSION || '';
                      if (!publishedVersion) return;

                      // Attribute the build to the merged PR via the merge commit
                      // message; direct pushes to master get no comment.
                      const commit = await github.rest.repos.getCommit({
                          ...context.repo,
                          ref: context.payload.after,
                      });
                      const subject = (commit.data.commit.message || '').split('\n')[0];
                      const match = subject.match(/^Merge pull request #(\d+) from /);
                      if (!match) return;
                      const prNumber = Number(match[1]);

                      const body = [
                          '## 📦 Merged Build Published',
                          '',
                          `This merge to master was published as **\`${publishedVersion}\`** (rolling \`master\` tag).`,
                          '',
                          '```bash',
                          'npm install -g billion-context@' + publishedVersion + '  # this exact build',
                          'npm install -g billion-context@master  # always the newest merged build',
                          '```',
                          '',
                          '`npm view billion-context@master` prints the current version at any time.',
                      ].join('\n');

                      const comments = await github.rest.issues.listComments({
                          ...context.repo,
                          issue_number: prNumber,
                      });
                      const existing = comments.data.find(c =>
                          c.user.type === 'Bot' && c.body.includes('📦 Merged Build Published')
                      );
                      if (existing) {
                          await github.rest.issues.updateComment({
                              ...context.repo,
                              comment_id: existing.id,
                              body,
                          });
                      } else {
                          await github.rest.issues.createComment({
                              ...context.repo,
                              issue_number: prNumber,
                              body,
                          });
                      }
