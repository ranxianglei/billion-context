name: Publish Advisories

# #1481: publishes the companion advisory package whenever advisories/ changes.
# The git copy keeps a placeholder version; the real version is derived from
# the registry (max of local and published) + 1 patch, so every push yields a
# fresh, monotonically increasing version without committing version churn.
on:
  push:
    branches: [master]
    paths:
      - "advisories/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate advisory payload
        run: |
          node -e "
            const semver = require('semver');
            const p = require('./advisories/package.json').billionContextAdvisories;
            if (!p || p.schema !== 1 || !Array.isArray(p.advisories)) {
              console.error('invalid billionContextAdvisories payload (need schema:1 + advisories array)');
              process.exit(1);
            }
            let targets = [];
            for (const a of p.advisories) {
              if (!a.id || !a.affected || !a.target || !a.reason) {
                console.error('advisory entry missing required fields:', JSON.stringify(a));
                process.exit(1);
              }
              try {
                new semver.Range(a.affected);
              } catch {
                console.error('advisory', a.id, ': invalid affected range', JSON.stringify(a.affected));
                process.exit(1);
              }
              if (!semver.valid(a.target)) {
                console.error('advisory', a.id, ': invalid target version', JSON.stringify(a.target));
                process.exit(1);
              }
              targets.push(a.target);
            }
            // Existence gate (review F2a): an advisory whose target is not
            // resolvable on npm would wedge every affected install — the
            // forced install re-fails each cycle, the escape-hatch command in
            // the web banner is uninstallable, and the deferral would stall
            // normal auto-updates. Fail the publish BEFORE shipping it.
            const { execFileSync } = require('child_process');
            for (const t of targets) {
              try {
                execFileSync('npm', ['view', 'billion-context@' + t, 'version'], { stdio: 'pipe' });
              } catch {
                console.error('advisory target', t, 'does not exist on the npm registry — publish the fix release first');
                process.exit(1);
              }
            }
          "

      - name: Publish next patch
        working-directory: advisories
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          LATEST=$(npm view billion-context-advisories version 2>/dev/null || echo "0.0.0")
          LOCAL=$(node -p "require('./package.json').version")
          NEXT=$(node -e "const s=require('semver');const base=s.gt(process.argv[1],process.argv[2])?process.argv[1]:process.argv[2];const v=base.split('.');v[2]=String(Number(v[2])+1);console.log(v.join('.'))" "$LOCAL" "$LATEST")
          npm version "$NEXT" --no-git-tag-version --allow-same-version
          npm publish --access public
