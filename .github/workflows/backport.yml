name: Backport

# Dual-lane release model (owner-approved 2026-10-24): the patch train.
#
# Small fixes merge to master as ordinary PRs (nothing about the normal lane
# changes). When the human wants a fix to ALSO ride the fast patch lane, they
# add the `backport` label — the carry PR appears IMMEDIATELY (label time,
# not merge time: owner rule 2026-10-24 session #2, "打backport 里面出一个
# 一样的pr 不是合并的时候才出"). The carry PR has the SAME content and title
# as the original but a different base: the open train. The owner clicks it
# whenever ready; conflicts and CI show up on the carry PR itself.
#
#   - labeled → derive/cut the train, cherry-pick the PR's own commits onto a
#     carry branch backport/<n>, open the carry PR, dispatch CI on it.
#   - synchronize (labeled PR pushed more commits) → rebuild the carry branch
#     from the train tip with the new content (force-push, same carry PR).
#   - closed merged → final refresh of the carry PR (or late creation if the
#     label arrived post-merge).
#   - closed unmerged → the carry PR is closed automatically.
#   - workflow_dispatch (pr=<number>) → repair path for any of the above.
#
# THE OPEN TRAIN IS DERIVED, NEVER STORED: the newest bugfix-release/* branch
# whose BASE version (suffix stripped) is strictly above the latest v* tag.
# Cutting one = pushing such a branch; publishing makes the tag catch up, so
# the train auto-derives as closed. There is deliberately NO Actions variable
# pointing at it: GITHUB_TOKEN cannot read/write the actions-variables API
# (403 "Resource not accessible by integration" — no permissions-block
# category grants it), which is how the variable-based first version failed
# on its maiden run (#4465, run 40053876329). Derivation needs only git refs
# and cannot go stale.
#
# Why a fresh train per cycle instead of one fixed branch: each train is born
# from a tag, so its content is STRUCTURALLY "tag + fixes" — an accidental
# master merge or leftover commits can never poison future patch releases,
# and an abandoned cycle leaves no state behind.
#
# Why cherry-pick and not a merge of the fix branch: the fix branch is based
# on master, so a git merge into the tag-based train would carry EVERY master
# commit since the tag (the unreleased features) over the merge-base — the
# exact leak this lane exists to prevent.
#
# Merge-shape policy (post-merge repairs only): only MERGE-COMMIT merges are
# supported (this repo's convention — see git log). Squash and rebase merges
# rewrite the PR's commits into new SHAs on master; for a multi-commit rebase,
# picking only the final commit would SILENTLY backport part of the fix (CI
# green, release ships an incomplete patch). The bot refuses to guess:
# single-parent merge commits are rejected with the manual command commented
# on the PR. The label-time path is immune: before the merge, the PR's own
# branch commits are enumerable directly (base..head, no merge SHA needed).
# Merge-commit ranges that contain housekeeping merges (e.g. "Merge branch
# 'master' into <pr>") are handled by expanding the range with --no-merges:
# those merge commits carry no unique content, so dropping them loses nothing.
#
# CI signal (#772): pushes made with GITHUB_TOKEN deliver NO push events, so
# this workflow explicitly dispatches ci.yml on the carry branch ref after
# pushing. Shipping is separately gated: release-bugfix.yml dispatches the
# FULL matrix at the train PR head before publish.
#
# Conflict policy: a cherry-pick that does not apply cleanly is the objective
# signal that the fix is NOT independent of master's unreleased work — the
# workflow comments the manual command on the PR and fails. On a refresh of
# an existing carry PR the previous content is kept (a broken force-push must
# never destroy a good carry). The fix simply stays on the master (slow)
# lane; pushing new commits to the PR retries the carry automatically.

on:
  pull_request:
    types: [labeled, synchronize, closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to backport (must carry the backport label)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

# Serialize train/carry updates: two backports landing together would race on
# the refs. Queued (not cancelled) — every labeled PR eventually carries.
concurrency:
  group: backport
  cancel-in-progress: false

jobs:
  backport:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
    steps:
      # Read the PR live from the API (works for every event type and the
      # manual dispatch repair path; the event payload only exists for the
      # pull_request events).
      - name: Gate — backport label present; merged-ness picks the mode
        id: gate
        run: |
          set -euo pipefail
          PR="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          STATE="$(jq -r '.state' <<<"$PR")"
          MERGED="$(jq -r '.merged' <<<"$PR")"
          LABELS="$(jq -r '.labels[].name' <<<"$PR" | sort | tr '\n' ' ')"
          MERGE_SHA="$(jq -r '.merge_commit_sha' <<<"$PR")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR")"
          BASE_SHA="$(jq -r '.base.sha' <<<"$PR")"
          echo "labels: $LABELS state: $STATE merged: $MERGED merge_commit: $MERGE_SHA head: $HEAD_SHA base: $BASE_SHA"
          if ! grep -qw backport <<<"$LABELS"; then
            echo "::notice::no backport label — master lane only, nothing to do"
            echo "labeled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "labeled=true" >> "$GITHUB_OUTPUT"
          echo "pr_head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$MERGED" = "true" ] && [ -n "$MERGE_SHA" ] && [ "$MERGE_SHA" != "null" ]; then
            echo "mode=merged" >> "$GITHUB_OUTPUT"
            echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$STATE" = "closed" ]; then
            echo "mode=unmerged-close" >> "$GITHUB_OUTPUT"
          else
            echo "mode=open" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the existing carry PR (head backport/<n>)
        id: carry
        if: steps.gate.outputs.labeled == 'true'
        run: |
          set -euo pipefail
          CARRY="$(gh pr list --head "backport/${PR_NUMBER}" --state open --json number,url --limit 1)"
          COUNT="$(jq 'length' <<<"$CARRY")"
          if [ "$COUNT" -gt 0 ]; then
            echo "number=$(jq -r '.[0].number' <<<"$CARRY")" >> "$GITHUB_OUTPUT"
            echo "url=$(jq -r '.[0].url' <<<"$CARRY")" >> "$GITHUB_OUTPUT"
            echo "existing carry PR: $(jq -r '.[0].url' <<<"$CARRY")"
          fi

      # Original closed without merging — its content never landed anywhere,
      # so the carry PR must not linger as a phantom fix.
      - name: Close the carry PR when the original closed unmerged
        if: steps.gate.outputs.labeled == 'true' && steps.gate.outputs.mode == 'unmerged-close'
        run: |
          set -euo pipefail
          if [ -n "${{ steps.carry.outputs.number }}" ]; then
            gh pr close "${{ steps.carry.outputs.number }}" --comment "Original PR #${PR_NUMBER} was closed without merging — closing this carry automatically."
            echo "::notice::carry PR #${{ steps.carry.outputs.number }} closed (original unmerged)"
          else
            echo "::notice::original closed unmerged, no carry PR to close"
          fi

      - name: Checkout (full history + tags)
        if: steps.gate.outputs.labeled == 'true' && steps.gate.outputs.mode != 'unmerged-close'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the open train (derived; computes the next one if none)
        id: resolve
        if: steps.gate.outputs.labeled == 'true' && steps.gate.outputs.mode != 'unmerged-close'
        run: |
          set -euo pipefail
          # The derivation needs the bugfix-release namespace + tags; fetch
          # explicitly so it never depends on what checkout happened to pull.
          git fetch -q origin '+refs/heads/bugfix-release/*:refs/remotes/origin/bugfix-release/*' --tags
          LAST="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          if [ -z "$LAST" ]; then echo "::error::no v* tags found — cannot derive the train state"; exit 1; fi
          NEWEST="$(git for-each-ref --sort=-v:refname --format='%(refname:short)' 'refs/remotes/origin/bugfix-release/*' | sed 's|^origin/||' | head -1 || true)"
          TRAIN=""
          if [ -n "$NEWEST" ]; then
            NB="${NEWEST#bugfix-release/v}"; TB="${LAST#v}"
            # Compare BASE versions (strip any -suffix): after a ship the tag
            # equals the train's base, so the train must derive as CLOSED —
            # comparing raw strings would rank "0.1.206-train" above the tag
            # "0.1.206" and wrongly reopen it.
            NBB="${NB%%-*}"; TBB="${TB%%-*}"
            TOP="$(printf '%s\n%s\n' "$NBB" "$TBB" | sort -V | tail -1)"
            if [ "$NBB" != "$TBB" ] && [ "$TOP" = "$NBB" ]; then
              TRAIN="$NEWEST"
            fi
          fi
          if [ -n "$TRAIN" ]; then
            echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
            echo "mode=pick" >> "$GITHUB_OUTPUT"
            echo "open train: $TRAIN (latest tag: $LAST)"
          else
            # No train open: compute the next one — it is cut from the latest
            # tag and the cut step below materializes it.
            BASE="${LAST#v}"
            IFS='.' read -r MA MI PA <<<"$BASE"
            NEXT="$MA.$MI.$((PA + 1))"
            TRAIN="bugfix-release/v${NEXT}-train"
            echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
            echo "mode=cut" >> "$GITHUB_OUTPUT"
            echo "no open train (latest tag: $LAST, newest branch: ${NEWEST:-none}) — will cut $TRAIN from $LAST"
          fi

      - name: Cut a fresh train from the latest released tag
        if: steps.gate.outputs.labeled == 'true' && steps.gate.outputs.mode != 'unmerged-close' && steps.resolve.outputs.mode == 'cut'
        run: |
          set -euo pipefail
          TRAIN="${{ steps.resolve.outputs.train }}"
          LAST="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet -b "$TRAIN" "$LAST"
          git push origin "$TRAIN"
          echo "cut $TRAIN from $LAST"
          gh pr comment "$PR_NUMBER" --body "No patch train was open — cut \`$TRAIN\` from \`$LAST\` automatically and creating this fix's carry PR on it. Ship it any time: Actions → Release (one-click) → tick \`train\` (\`reference/release.md\`, \"Dual-lane releases\")." || true

      # Post-merge repairs only (late label, or the workflow_dispatch repair
      # path). The label-time path enumerates the PR's own commits directly
      # and never needs the merge SHA.
      - name: Reject squash/rebase merge shapes (merged repairs only)
        id: shape
        if: steps.gate.outputs.labeled == 'true' && steps.gate.outputs.mode == 'merged' && !failure()
        run: |
          set -euo pipefail
          MERGE_SHA="${{ steps.gate.outputs.merge_sha }}"
          PR_HEAD="${{ steps.gate.outputs.pr_head }}"
          git fetch -q origin "$MERGE_SHA" "refs/pull/${PR_NUMBER}/head" || true
          PARENTS="$(git rev-list --parents -n1 "$MERGE_SHA" 2>/dev/null | wc -w || echo 0)"
          if [ "$PARENTS" -lt 3 ]; then
            gh pr comment "$PR_NUMBER" --body "This PR was merged via squash or rebase, not a merge commit (the repo convention). The bot only auto-backports merge-commit merges: for these rewritten shapes it cannot safely tell a complete squash apart from a multi-commit rebase — picking just the final commit would silently ship a PARTIAL fix on the train. Manual backport: \`git checkout ${{ steps.resolve.outputs.train }} && git cherry-pick -x \$(git rev-list --reverse --no-merges ${MERGE_SHA}^1..${PR_HEAD})\`. The fix stays fully on the master lane either way." || true
            echo "::error::non-merge-commit merge shape — refusing to guess the commit set; see PR comment"
            exit 1
          fi

      - name: Cherry-pick the PR's commits onto the carry branch
        id: pick
        if: steps.gate.outputs.labeled == 'true' && steps.gate.outputs.mode != 'unmerged-close' && !failure()
        env:
          TRAIN: ${{ steps.resolve.outputs.train }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MODE="${{ steps.gate.outputs.mode }}"
          PR_HEAD="${{ steps.gate.outputs.pr_head }}"
          BASE_SHA="${{ steps.gate.outputs.base_sha }}"
          if ! git rev-parse --verify --quiet "origin/$TRAIN" >/dev/null; then
            git fetch origin "$TRAIN"
          fi
          git fetch -q origin "refs/pull/${PR_NUMBER}/head" || true
          if [ "$MODE" = "merged" ]; then
            MERGE_SHA="${{ steps.gate.outputs.merge_sha }}"
            # M^1..M^2 is exactly the PR's own commits; --no-merges drops
            # housekeeping merges inside the PR branch, --reverse gives
            # oldest-first pick order.
            RANGE="${MERGE_SHA}^1..${MERGE_SHA}^2"
          else
            # Label-time: the PR's own branch commits, straight from the PR
            # ref — no merge SHA exists yet and none is needed.
            RANGE="${BASE_SHA}..${PR_HEAD}"
          fi
          COMMITS="$(git rev-list --reverse --no-merges "$RANGE")"
          if [ -z "$COMMITS" ]; then
            gh pr comment "$PR_NUMBER" --body "Backport skipped: the PR contained no non-merge commits — nothing to carry onto \`$TRAIN\`." || true
            exit 0
          fi
          # Rebuild from the CURRENT train tip every time: idempotent, and it
          # self-heals when the train advanced since the last carry.
          git checkout --quiet -B "backport/${PR_NUMBER}" "origin/$TRAIN"
          git cherry-pick -x $COMMITS
          PICKED_LOG="$(git log --oneline "origin/$TRAIN..HEAD")"
          {
            echo "picked<<RECEIPT_PICKS_EOF"
            printf '%s\n' "$PICKED_LOG"
            echo "RECEIPT_PICKS_EOF"
            echo "head_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Push the carry branch and open/refresh the carry PR
        id: prcreate
        if: steps.gate.outputs.labeled == 'true' && steps.gate.outputs.mode != 'unmerged-close' && !failure() && steps.pick.outputs.head_sha
        env:
          TRAIN: ${{ steps.resolve.outputs.train }}
          HEAD_SHA: ${{ steps.pick.outputs.head_sha }}
          PICKED: ${{ steps.pick.outputs.picked }}
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/backport/${PR_NUMBER}"
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          TITLE="$(jq -r '.title' <<<"$PR_JSON")"
          ORIG_BODY="$(jq -r '.body // "(no description)"' <<<"$PR_JSON")"
          PICKED_MD="$(printf '%s\n' "$PICKED" | sed -n '1,10p' | sed 's/^/`/; s/ /` — /')"
          if [ -n "${{ steps.carry.outputs.number }}" ]; then
            gh pr comment "$PR_NUMBER" --body "Carry branch refreshed to ${HEAD_SHA:0:10} (same content as this PR's current head). Carry PR: ${{ steps.carry.outputs.url }} — merge it into \`$TRAIN\` whenever ready; CI runs on the carry branch."
            echo "url=${{ steps.carry.outputs.url }}" >> "$GITHUB_OUTPUT"
          else
            BODY="$(printf 'Automated carry: same content as #%s, different base (`%s` → `%s`). New commits on the original refresh this branch automatically.\n\n%s' "$PR_NUMBER" "$PR_NUMBER" "$TRAIN" "$ORIG_BODY")"
            URL="$(gh pr create --base "$TRAIN" --head "backport/${PR_NUMBER}" --title "backport: ${TITLE} (#${PR_NUMBER})" --body "$BODY" 2>/dev/null || true)"
            if [ -z "$URL" ]; then
              echo "::error::failed to create the carry PR (see log)"
              exit 1
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "carry PR created: $URL"
          fi

      - name: Dispatch CI on the carry branch (#772 — token pushes carry no push events)
        if: steps.gate.outputs.labeled == 'true' && steps.prcreate.outputs.url && !failure()
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "backport/${PR_NUMBER}"
          echo "::notice::CI dispatched on backport/${PR_NUMBER} (CORE matrix)"

      - name: Audit trail comment
        if: steps.gate.outputs.labeled == 'true' && steps.prcreate.outputs.url && !failure()
        env:
          TRAIN: ${{ steps.resolve.outputs.train }}
          PICKED: ${{ steps.pick.outputs.picked }}
          HEAD_SHA: ${{ steps.pick.outputs.head_sha }}
          CARRY_URL: ${{ steps.prcreate.outputs.url }}
        run: |
          set -euo pipefail
          TRAIN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${TRAIN}"
          CI_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/ci.yml?query=branch%3Abackport%2F${PR_NUMBER}"
          SHIP_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release-manual.yml"
          PICKED_MD="$(printf '%s\n' "$PICKED" | sed -n '1,10p' | sed 's/^/`/; s/ /` — /')"
          gh pr comment "$PR_NUMBER" --body "## 🚂 Carry PR on the Patch Train

          [Carry PR](${CARRY_URL}) — same content as this PR, base \`$TRAIN\`, head \`${HEAD_SHA:0:10}\`. Merge it into the train whenever ready; CI is running on the carry branch.
          
          **Picked commits:**
          $PICKED_MD
          
          **What ships when this train departs:** the next patch release (\`v$(printf '%s' "${TRAIN#bugfix-release/v}" | sed 's/-train$//')\`) containing ONLY tag-based fixes like this one — master's unreleased work stays out. To ship: merge the carry PR, then [Release (one-click)]($SHIP_URL) → tick \`train\`." || true

      - name: Conflict breadcrumb — manual backport needed
        if: steps.gate.outputs.labeled == 'true' && failure() && steps.shape.outcome != 'failure'
        env:
          TRAIN: ${{ steps.resolve.outputs.train }}
        run: |
          set -euo pipefail
          MODE="${{ steps.gate.outputs.mode }}"
          PR_HEAD="${{ steps.gate.outputs.pr_head }}"
          BASE_SHA="${{ steps.gate.outputs.base_sha }}"
          if [ "$MODE" = "merged" ]; then
            RANGE="${{ steps.gate.outputs.merge_sha }}^1..${PR_HEAD}"
          else
            RANGE="${BASE_SHA}..${PR_HEAD}"
          fi
          KEEPER=""
          if [ -n "${{ steps.carry.outputs.url }}" ]; then
            KEEPER=" An earlier carry exists and keeps its previous content: ${{ steps.carry.outputs.url }}."
          fi
          gh pr comment "$PR_NUMBER" --body "Backport to \`$TRAIN\` did not complete — the cherry-pick conflicts (the fix is NOT independent of master's unreleased work), or the run is a duplicate rerun, or the CI/PR step failed after a successful pick (check the job log). The fix stays on the master (slow) lane either way.${KEEPER} To force it onto the train, resolve manually: \`git checkout -B backport/${PR_NUMBER} $TRAIN && git cherry-pick -x \$(git rev-list --reverse --no-merges ${RANGE})\`." || true
