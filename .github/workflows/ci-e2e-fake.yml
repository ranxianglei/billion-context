name: e2e-fake-codex

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-fake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-fake:
    name: real codex vs deterministic fake upstream (zero tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Transient runner↔registry blips (ECONNRESET) must not red a PR (#2611):
    # raise npm's built-in fetch retry (default 2) so a ~10s jitter rides out
    # instead of aborting setup. Job-level → covers every registry op here
    # (global CLI install AND `npm ci`). Bounded: worst case ~+2 min before a
    # genuine sustained outage still fails fast.
    env:
      npm_config_fetch_retries: '5'
      npm_config_fetch_retry_mintimeout: '5000'
      npm_config_fetch_retry_maxtimeout: '60000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pinned (#815): an unpinned @latest let a codex release change the
      # baseline system-prompt size and break the deterministic overflow phase.
      # Bump deliberately after re-running this suite locally on the new version.
      - name: Install codex CLI
        run: npm i -g @openai/codex@0.147.0

      - name: Print codex version
        run: codex --version

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run deterministic real-codex compression E2E
        run: ACP_TEST_E2E_FAKE=1 node --import tsx --test tests/e2e/e2e-codex-fake.test.ts

      - name: Collect E2E artifacts
        if: failure()
        run: |
          mkdir -p tmp/e2e-artifacts
          for d in tmp/e2e-codex-fake-*; do [ -d "$d" ] && cp -r "$d" tmp/e2e-artifacts/ || true; done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-fake-artifacts
          path: tmp/e2e-artifacts
          if-no-files-found: ignore
