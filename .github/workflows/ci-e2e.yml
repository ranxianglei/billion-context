name: E2E (real codex)

on:
  # #2637 plan #3: nightly full regression on master — the daily backstop for
  # the path-filtered PR trigger below (schedule ignores paths, so this run
  # covers everything regardless of diff).
  schedule:
    - cron: '4/30 * * * *'
    # three-layer CI: 30-min smart cron — gate skips when master HEAD is unchanged since the last green scheduled run
  workflow_dispatch:
    inputs:
      forge:
        description: "run forge phase (needs BILI_CODEX_COMPACT support in master)"
        type: boolean
        default: false
  # #1296 note ④ hardening: routing/pipeline changes (#1284/#1290 class) got
  # real-client coverage only when someone remembered to dispatch manually.
  # Auto-run on request-pipeline hot files (AGENTS.md §E2E: server.ts,
  # src/loop/, adapters, preflight/compact) instead. Everything else stays
  # covered by the regular test/build workflows.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [master, agent-relay]  # #3468: agent PRs target the relay branch
    paths:
      - "src/server.ts"
      - "src/server/**"
      - "src/loop/**"
      - "src/compress-loop*.ts"
      - "src/stream*.ts"
      - "src/persist.ts"
      - "src/agent/**"
      - "tests/e2e/**"
      # The in-repo kernel (kernel/) is bundled INLINE into the pipeline —
      # a kernel change IS a pipeline change (#1289-class guard; #2092).
      - "kernel/**"
      - "package-lock.json"
      - ".github/workflows/ci-e2e.yml"

# One run per ref: a fresh push cancels the superseded in-flight run — the
# suite spends real upstream tokens, never run it twice in parallel. The
# 'nightly' group keeps scheduled runs out of that cancel scope (#2637 #3).
concurrency:
  # #3772: a non-ci:full `labeled` run is skip-scoped by its gate job below —
  # keep it in its own group so it can never cancel the in-flight real run.
  group: e2e-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ci:full') && '-skip' || '' }}
  # #3331: cancel-in-progress applies WITHIN the group too — a 30-min cron whose
  # run outlives the interval would kill its predecessor mid-suite (tokens spent,
  # no green recorded, gate can never skip). Cancel only same-ref superseded
  # runs; scheduled runs queue behind each other instead.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # three-layer CI: this lane only runs on demand (ci:full label / dispatch)
  # or on the 30-min cron when master moved since the last green scheduled run.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          LABEL_EVENT: ${{ github.event.label.name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            # only the ci:full label itself may trigger; other label events skip
            if [ -n "$LABEL_EVENT" ] && [ "$LABEL_EVENT" != "ci:full" ]; then run=false
            elif ! grep -qw ci:full <<<"$PR_LABELS"; then run=false; fi
          elif [ "$EVENT" = "schedule" ]; then
            LAST=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-e2e.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || echo "")
            echo "last green scheduled head: ${LAST:-none}; current: $HEAD_SHA"
            if [ "$LAST" = "$HEAD_SHA" ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  e2e:
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Transient runner↔registry blips (ECONNRESET) must not red a PR (#2611):
    # raise npm's built-in fetch retry (default 2) so a ~10s jitter rides out
    # instead of aborting setup. Job-level → covers every registry op here
    # (global CLI install AND `npm ci`). Bounded: worst case ~+2 min before a
    # genuine sustained outage still fails fast.
    env:
      npm_config_fetch_retries: '5'
      npm_config_fetch_retry_mintimeout: '5000'
      npm_config_fetch_retry_maxtimeout: '60000'
    steps:
      # Secrets are only injected for same-repo PRs and manual dispatch
      # (fork PRs see none). Skip gracefully instead of failing red —
      # the maintainer dispatches manually for fork contributions.
      - name: Gate on E2E upstream secrets
        env:
          E2E_UPSTREAM_URL: ${{ secrets.E2E_UPSTREAM_URL }}
          E2E_UPSTREAM_KEY: ${{ secrets.E2E_UPSTREAM_KEY }}
        run: |
          if [ -z "$E2E_UPSTREAM_URL" ] || [ -z "$E2E_UPSTREAM_KEY" ]; then
            echo "::notice::E2E_UPSTREAM_URL / E2E_UPSTREAM_KEY unavailable for this event — skipping the real-client e2e run."
            echo "E2E_SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.E2E_SKIP != '1'
      - uses: actions/setup-node@v4
        if: env.E2E_SKIP != '1'
        with:
          node-version: 22
      # Pinned (#815): an unpinned @latest let a codex release change the
      # baseline system-prompt size and break the deterministic overflow phase.
      # Bump deliberately after re-running this suite locally on the new version.
      - name: Install codex CLI
        if: env.E2E_SKIP != '1'
        run: npm install -g @openai/codex@0.147.0

      - name: Print codex version
        if: env.E2E_SKIP != '1'
        run: codex --version
      - run: npm ci
        if: env.E2E_SKIP != '1'
      - run: npm run build
        if: env.E2E_SKIP != '1'
      - name: Preflight
        if: env.E2E_SKIP != '1'
        run: E2E_CHECK=1 node --import tsx --test tests/e2e/e2e-codex.test.ts
        env:
          E2E_UPSTREAM_URL: ${{ secrets.E2E_UPSTREAM_URL }}
          E2E_UPSTREAM_KEY: ${{ secrets.E2E_UPSTREAM_KEY }}
      - name: E2E suite
        if: env.E2E_SKIP != '1'
        run: ACP_TEST_E2E=1 node --import tsx --test tests/e2e/e2e-codex.test.ts
        env:
          E2E_UPSTREAM_URL: ${{ secrets.E2E_UPSTREAM_URL }}
          E2E_UPSTREAM_KEY: ${{ secrets.E2E_UPSTREAM_KEY }}
          E2E_FORGE: ${{ inputs.forge && '1' || '' }}
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts && cp -r tmp/e2e-codex-* artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: artifacts/
          retention-days: 7
