name: E2E (real codex)

on:
  workflow_dispatch:
    inputs:
      forge:
        description: "run forge phase (needs BILI_CODEX_COMPACT support in master)"
        type: boolean
        default: false
  # #1296 note ④ hardening: routing/pipeline changes (#1284/#1290 class) got
  # real-client coverage only when someone remembered to dispatch manually.
  # Auto-run on request-pipeline hot files (AGENTS.md §E2E: server.ts,
  # src/loop/, adapters, preflight/compact) instead. Everything else stays
  # covered by the regular test/build workflows.
  pull_request:
    branches: [master]
    paths:
      - "src/server.ts"
      - "src/server/**"
      - "src/loop/**"
      - "src/compress-loop*.ts"
      - "src/stream*.ts"
      - "src/persist.ts"
      - "src/agent/**"
      - "tests/e2e/**"
      # The in-repo kernel (kernel/) is bundled INLINE into the pipeline —
      # a kernel change IS a pipeline change (#1289-class guard; #2092).
      - "kernel/**"
      - "package-lock.json"
      - ".github/workflows/ci-e2e.yml"

# One run per ref: a fresh push cancels the superseded in-flight run — the
# suite spends real upstream tokens, never run it twice in parallel.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Transient runner↔registry blips (ECONNRESET) must not red a PR (#2611):
    # raise npm's built-in fetch retry (default 2) so a ~10s jitter rides out
    # instead of aborting setup. Job-level → covers every registry op here
    # (global CLI install AND `npm ci`). Bounded: worst case ~+2 min before a
    # genuine sustained outage still fails fast.
    env:
      npm_config_fetch_retries: '5'
      npm_config_fetch_retry_mintimeout: '5000'
      npm_config_fetch_retry_maxtimeout: '60000'
    steps:
      # Secrets are only injected for same-repo PRs and manual dispatch
      # (fork PRs see none). Skip gracefully instead of failing red —
      # the maintainer dispatches manually for fork contributions.
      - name: Gate on E2E upstream secrets
        env:
          E2E_UPSTREAM_URL: ${{ secrets.E2E_UPSTREAM_URL }}
          E2E_UPSTREAM_KEY: ${{ secrets.E2E_UPSTREAM_KEY }}
        run: |
          if [ -z "$E2E_UPSTREAM_URL" ] || [ -z "$E2E_UPSTREAM_KEY" ]; then
            echo "::notice::E2E_UPSTREAM_URL / E2E_UPSTREAM_KEY unavailable for this event — skipping the real-client e2e run."
            echo "E2E_SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.E2E_SKIP != '1'
      - uses: actions/setup-node@v4
        if: env.E2E_SKIP != '1'
        with:
          node-version: 22
      # Pinned (#815): an unpinned @latest let a codex release change the
      # baseline system-prompt size and break the deterministic overflow phase.
      # Bump deliberately after re-running this suite locally on the new version.
      - name: Install codex CLI
        if: env.E2E_SKIP != '1'
        run: npm install -g @openai/codex@0.147.0

      - name: Print codex version
        if: env.E2E_SKIP != '1'
        run: codex --version
      - run: npm ci
        if: env.E2E_SKIP != '1'
      - run: npm run build
        if: env.E2E_SKIP != '1'
      - name: Preflight
        if: env.E2E_SKIP != '1'
        run: E2E_CHECK=1 node --import tsx --test tests/e2e/e2e-codex.test.ts
        env:
          E2E_UPSTREAM_URL: ${{ secrets.E2E_UPSTREAM_URL }}
          E2E_UPSTREAM_KEY: ${{ secrets.E2E_UPSTREAM_KEY }}
      - name: E2E suite
        if: env.E2E_SKIP != '1'
        run: ACP_TEST_E2E=1 node --import tsx --test tests/e2e/e2e-codex.test.ts
        env:
          E2E_UPSTREAM_URL: ${{ secrets.E2E_UPSTREAM_URL }}
          E2E_UPSTREAM_KEY: ${{ secrets.E2E_UPSTREAM_KEY }}
          E2E_FORGE: ${{ inputs.forge && '1' || '' }}
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts && cp -r tmp/e2e-codex-* artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: artifacts/
          retention-days: 7
