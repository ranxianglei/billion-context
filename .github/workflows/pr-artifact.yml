name: PR Build Artifact

on:
    pull_request:
        branches: [master]

permissions:
    contents: read
    pull-requests: write

jobs:
    build-artifact:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - run: npm install --ignore-scripts --no-fund --no-audit

            - run: npm run build

            - name: Publish to npm with rolling pr tag
              # Repository secrets (NPM_TOKEN) are not available to workflows
              # triggered by fork PRs — publishing would fail with ENEEDAUTH (#670).
              if: github.event.pull_request.head.repo.full_name == github.repository
              id: publish
              run: |
                  PR_NUMBER="${{ github.event.pull_request.number }}"
                  RUN_NUMBER="${{ github.run_number }}"
                  RUN_ATTEMPT="${{ github.run_attempt }}"
                  # Monotonic temp version (#1385): the 0.0.<run_number> base never
                  # collides with real releases (which stay >= 0.1.0, enforced by the
                  # release drift guards), sorts below every release, and the -pr
                  # prerelease suffix keeps it unresolvable by any semver range —
                  # builds are addressed by their full version string. run_number is
                  # repo-wide unique and monotonic (gaps OK); -a<attempt> makes a
                  # rerun of one run publish a fresh version instead of E409.
                  PR_VERSION="0.0.${RUN_NUMBER}-pr.${PR_NUMBER}.${GITHUB_SHA:0:7}"
                  if [ "$RUN_ATTEMPT" != "1" ]; then
                      PR_VERSION="${PR_VERSION}-a${RUN_ATTEMPT}"
                  fi

                  echo "Publishing version $PR_VERSION with rolling tag pr"
                  npm version "$PR_VERSION" --no-git-tag-version
                  npm publish --tag pr --access public --ignore-scripts
                  echo "version=${PR_VERSION}" >> "$GITHUB_OUTPUT"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create installable tarball
              run: |
                  npm pack
                  PR_NUM="${{ github.event.pull_request.number }}"
                  TARBALL=$(ls billion-context-*.tgz | head -1)
                  if [ -n "$PR_NUM" ] && [ -n "$TARBALL" ]; then
                    cp "$TARBALL" "billion-context-pr${PR_NUM}.tgz"
                  fi

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: billion-context-pr-${{ github.event.pull_request.number }}
                  path: |
                      billion-context-pr*.tgz
                      dist/
                  retention-days: 30

            - name: Summarize install instructions and comment on same-repository PR
              uses: actions/github-script@v7
              env:
                  PUBLISHED_VERSION: ${{ steps.publish.outputs.version }}
              with:
                  script: |
                      const prNumber = context.payload.pull_request.number;
                      const sha = context.payload.pull_request.head.sha.slice(0, 7);
                      const branch = context.payload.pull_request.head.ref;
                      const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const isFork = context.payload.pull_request.head.repo.full_name !== context.payload.repository.full_name;
                      const publishedVersion = process.env.PUBLISHED_VERSION || '';
                      const showNpmOption = !isFork && publishedVersion !== '';

                      const body = [
                          '## 📦 Built Package Artifact',
                          '',
                          `**Branch:** \`${branch}\` (${sha})`,
                          '',
                          ...(isFork ? [
                              '> Fork PR: the npm publish is skipped (repository secrets are not shared with fork workflows).',
                              '',
                          ] : []),
                          ...(showNpmOption ? [
                          '### Option A — Install this exact build (recommended)',
                          '',
                          '```bash',
                          'npm install -g billion-context@' + publishedVersion,
                          '```',
                          '',
                          'This exact version is immutable and reproducible. The rolling `pr` tag tracks the newest test build across all PRs.',
                          '',
                          ] : []),
                          ...(isFork ? ['### Install from artifact'] : ['### Option B — Download artifact']),
                          '',
                          `1. Download the artifact from the [Actions run](${runUrl})`,
                          '2. Extract the tarball and install:',
                          '',
                          '```bash',
                          'tar xzf billion-context-pr' + prNumber + '.tgz',
                          'npm install -g package',
                          '```',
                          '',
                          '---',
                          '*Install instructions are refreshed on each push.*',
                      ].join('\n');

                      await core.summary.addRaw(body).write();
                      if (isFork) return;

                      // Find and update existing comment, or create new one
                      const comments = await github.rest.issues.listComments({
                          ...context.repo,
                          issue_number: prNumber,
                      });

                      const existing = comments.data.find(c =>
                          c.user.type === 'Bot' && c.body.includes('📦 Built Package Artifact')
                      );

                      if (existing) {
                          await github.rest.issues.updateComment({
                              ...context.repo,
                              comment_id: existing.id,
                              body,
                          });
                      } else {
                          await github.rest.issues.createComment({
                              ...context.repo,
                              issue_number: prNumber,
                              body,
                          });
                      }
