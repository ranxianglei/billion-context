# Config reference seed — rollout domain (#3062: per-install canary gating).
# Edit HERE, then run: node tools/gen-config-docs.mjs generate
domain: rollout
entries:
  - key: rollout
    type: object
    default: "{}"
    group: behavior
    id: tt.rollout
    site_group: beh
    desc_en: "Feature rollout (canary) block: per-feature overrides of the version's baked-in rollout plan; features roll out by percent of installs, bucketed on a stable per-machine id."
    desc_zh: "灰度发布配置块:按特性覆盖版本内置的灰度计划;特性按安装占比放量,分桶基于每台机器稳定的 id。"
    desc_ja: "機能ロールアウト（カナリア）ブロック：バージョンに組み込まれたロールアウト計画の機能ごとのオーバーライド；機能はインストール数のパーセンテージでロールアウトされ、安定したマシンごとの ID でバケット化されます。"
    site_en: "<code>rollout</code> — canary gating: features enable for a percent of installs, bucketed on a stable per-machine UUID; nested <span class='mech'>base</span> rolls B out only inside A's cohort."
    site_zh: "<code>rollout</code> —— 灰度门控:特性按安装百分比启用,以每台机器稳定的 UUID 分桶;嵌套 <span class='mech'>base</span> 使 B 只在 A 的入组人群内放量。"
  - key: rollout.installId
    type: string
    default: "auto-generated UUID persisted at ~/.local/state/billion-context/rollout-id.json"
    group: behavior
    desc_en: "Pins the bucketing identity instead of the auto-generated state-dir UUID (support/testing: pick or compute an id whose bucket lands inside a cohort)."
    desc_zh: "钉住分桶身份,替代 state 目录自动生成的 UUID(支持/测试用:选取或计算一个桶值落在目标人群内的 id)。"
    desc_ja: "自動生成された state-dir UUID の代わりにバケット化アイデンティティをピン留め（サポート/テスト：コホート内にバケットが収まる ID を選択または計算）。"
  - key: rollout.features
    type: "record feature name → { enabled?, percent?, salt?, base? } | boolean | number"
    default: "{}"
    group: behavior
    desc_en: "Per-feature overrides, keyed by the feature names the running version has under rollout. enabled (boolean) overrides any percentage; percent (0–100) re-scales the cohort; salt re-randomizes it; base re-scopes the nesting. Shorthands: \"x\": true/false forces on/off, \"x\": 20 sets percent. Wrong-typed fields (e.g. enabled as a string) are ignored and named by the startup warning — never silently widening a cohort."
    desc_zh: "按特性覆盖,键为当前版本处于灰度中的特性名。enabled(布尔)覆盖任何百分比;percent(0–100)重设比例;salt 重新洗牌;base 重设嵌套父特性。缩写:\"x\": true/false 强制开/关,\"x\": 20 等价 percent 20。类型写错的字段(如 enabled 写成字符串)会被忽略并在启动警告中点名,绝不静默放宽圈层。"
    desc_ja: "実行中バージョンが rollout 下で持つ機能名をキーとする機能ごとのオーバーライド。enabled (boolean) はパーセンテージを無視して上書き；percent (0–100) はコホートを再スケーリング；salt は再ランダム化；base はネストのスコープを再定義。ショートハンド：\"x\": true/false でオン/オフを強制、\"x\": 20 で percent を設定。型が誤ったフィールド（例：enabled が文字列）は無視され、起動時の警告で名前が示されます — コホートのサイレントな拡大は決して行われません。"
  - key: rollout.features.enabled
    type: boolean
    default: "unset (bucket math decides)"
    env: BILI_ROLLOUT_<FEATURE>
    group: behavior
    desc_en: "Force a gated feature on/off regardless of percentage. Env tier BILI_ROLLOUT_<FEATURE> (UPPER_SNAKE feature name; 0/false = off, any other value = on) wins over everything, including this field."
    desc_zh: "无视百分比强制开关某个灰度特性。环境变量 BILI_ROLLOUT_<特性名>(大写下划线;0/false=关,其余值=开)优先于一切,包括本字段。"
    desc_ja: "パーセンテージに関係なく、ゲート付き機能を強制的にオン/オフにする。環境変数 `BILI_ROLLOUT_<FEATURE>`（大文字スネークケースの機能名; 0/false = オフ、それ以外の値 = オン）が、このフィールドを含むすべての設定を上書きする。"
  - key: rollout.features.percent
    type: number
    default: "the version's baked-in plan"
    group: behavior
    desc_en: "Percent of installs (0–100, fractional allowed) that see the feature. Monotonic: raising the percent never drops an already-enabled install; the bucket is prefix-stable per install."
    desc_zh: "看到该特性的安装占比(0–100,支持小数)。单调:上调比例不会把已入组的安装踢出;每台安装的桶值是前缀稳定的。"
    desc_ja: "機能を確認できるインストールの割合（0–100、小数可）。単調増加性を持つ：パーセンテージを上げても、すでに有効化されたインストールが失効することはない。バケットはインストールごとにプレフィックス安定である。"
  - key: rollout.features.salt
    type: string
    default: "the feature name"
    group: behavior
    desc_en: "Hash salt for bucketing. Changing it re-randomizes the whole cohort (the only way to reshuffle; raising percent alone never reshuffles)."
    desc_zh: "分桶哈希盐。修改它会重新随机整个分组(唯一的洗牌方式;仅上调 percent 永不洗牌)。"
    desc_ja: "バケット分割用のハッシュソルト。変更するとコホート全体が再ランダム化される（シャッフルする唯一の方法；パーセンテージを上げるだけではシャッフルされない）。"
  - key: rollout.features.base
    type: string
    default: "unset (roll out over everyone)"
    group: behavior
    desc_en: "Nested rollout: evaluate this feature only inside the named feature's enabled cohort, so the percent is relative to that population (roll B out to A's users; chains allowed, cycles fail closed)."
    desc_zh: "嵌套灰度:仅在所指特性的已入组人群内评估本特性,percent 相对该人群(B 只放量给 A 的用户;允许链式,环路判为关)。"
    desc_ja: "ネストされたロールアウト：指定された機能の有効化コホート内でのみこの機能を評価し、パーセンテージがその母集団に対する相対値となる（Aのユーザーに対してBをロールアウト；チェーンは許可、サイクルはクローズドに失敗する）。"
  - key: rollout.features.identityChannelHarvest
    type: "boolean | number"
    default: "0 (off)"
    default_zh: "0(关)"
    env: BILI_ROLLOUT_IDENTITY_CHANNEL_HARVEST
    group: behavior
    desc_en: "Identity-channel harvest cohort gate (#5825): allows the loopback-only transcript/sqlite harvest (src/identity-harvest.ts: claude-code / codebuddy / mcode / goose / qwen lanes) without any per-install env switch, when neither the per-install switch (BILI_IDENTITY_HARVEST) nor this key is set nothing ever reads client storage. Owner ruling 2026-11-07: this cohort key is deliberately separate from rollout.features.pluginLaneServerHistory (which governs row PINNING of admitted ids) — either enabler may activate harvesting. Default 0%; raise after small-cohort observation of the degrade warn-once rate. See identity-channels.md."
    desc_zh: "身份信道采集的灰度门(#5825):当安装级开关(BILI_IDENTITY_HARVEST)未设置时,允许仅由本灰度键激活回环专属的转录/SQLite 采集(claude-code / codebuddy / mcode / goose / qwen 车道);两者都不设则永不读客户端存储。owner 裁定 2026-11-07:本灰度键与 rollout.features.pluginLaneServerHistory(它管已接纳 id 的行钉住)刻意分离——任一使能方可激活采集。默认 0%,小流量观察退化率后再抬。见 identity-channels.zh-CN.md。"
    desc_ja: "IDチャネル収穫コホートゲート (#5825)：インストールごとの環境スイッチなしで、ループバック専用のトランスクリプト/sqlite収穫（`src/identity-harvest.ts`: claude-code / codebuddy / mcode / goose / qwen レーン）を許可する。インストールごとのスイッチ（`BILI_IDENTITY_HARVEST`）もこのキーも設定されていない場合、クライアントストレージは一切読み取られない。オーナー裁定 2026-11-07：このコホートキーは `rollout.features.pluginLaneServerHistory`（承認済みIDの行固定を管理）とは意図的に分離されている — いずれかのイネーブラーが収穫を有効化できる。デフォルト 0%；小規模コホートでの degrade warn-once レートの観察後に引き上げる。`identity-channels.md` を参照。"
  - key: rollout.features.pluginLaneServerHistory
    type: "boolean | number"
    default: "100 (on, GA)"
    default_zh: "100(开,已 GA)"
    env: BILI_ROLLOUT_PLUGIN_LANE_SERVER_HISTORY
    group: behavior
    desc_en: "Plugin-lane server-owned history (#4491): for enabled installs, (a) plugin-lane requests may carry an internal `biliMsgIds` array parallel to `messages` that pins message identity to client-supplied ids (always stripped before upstream forwarding; malformed arrays are ignored with a warning, id-poisoning shapes hard-fail on the incremental lane); (b) the loopback-only `POST /__bili/plugin/render` endpoint serves the outbound prefix rendered from the unified transcript (folded regions collapse to summary anchors; any desync degrades to a non-2xx so the shim falls back to its local history); (c) the incremental-lane probe advertises `serverHistory`. Default 100% (GA, owner ruling 2026-11-13); set 0 to roll an install back to the pre-GA state."
    desc_zh: "插件车道服务端正史(#4491):对已放量的安装,(a) 插件车道请求可携带与 `messages` 平行的内部字段 `biliMsgIds`,把消息身份钉在客户端提供的 id 上(转发上游前一律剥掉;格式错误的数组告警后忽略,身份投毒形态在增量车道直接硬失败);(b) 仅回环可达的 `POST /__bili/plugin/render` 端点从统一存储渲染出站前缀(折叠区收敛为摘要锚点;任何失步都返回非 2xx,shim 退回本地历史);(c) 增量车道探测响应通告 `serverHistory`。默认 100%(GA,owner 裁定 2026-11-13);设 0 可把安装回滚到 GA 前状态。"
    desc_ja: "プラグインレーンのサーバー所有履歴 (#4491)：有効化されたインストールにおいて、(a) プラグインレーンのリクエストは `messages` と並行して内部 `biliMsgIds` 配列を持ち、メッセージIDをクライアント提供のIDに固定できる（上流転送前に常に除去；不正な配列は警告付きで無視、ID汚染形状は増分レーンでハードフェイル）；(b) ループバック専用の `POST /__bili/plugin/render` エンドポイントは、統合トランスクリプトからレンダリングされた送信プレフィックスを提供する（折り畳み領域はサマリアンカーに縮小；デシンクは非2xxにデグレードし、シムはローカル履歴にフォールバック）；(c) 増分レーンのプローブは `serverHistory` をアドバタイズする。デフォルト 100%（GA、オーナー裁定 2026-11-13）；0 に設定するとインストールは GA 前の状態に戻る。"
  - key: rollout.features.pluginMsgIdIncremental
    type: "boolean | number"
    default: "100 (on, GA)"
    default_zh: "100(开,已 GA)"
    env: BILI_ROLLOUT_PLUGIN_MSG_ID_INCREMENTAL
    group: behavior
    desc_en: "Incremental msgid pin channel (#7064 §8, owner rulings 2026-11-18/19): steady plugin-lane turns declare their message ids in TAIL FORM — the bounded `x-bili-pf-tail-ids` header (anchor + new ids, ≤ 2048 ids, `?` placeholder slots) or a short body id array — instead of the FULL list; the server re-stamps the prefix ids from its own ledger live rows (ingest is INSERT OR IGNORE on (session_id,seq) — a position's msg_id is written once, never overwritten). Acceptance (2026-11-19 form): the declared tail [T-L, T-1] must match the ledger overlap segment row-by-row (any drift degrades to `full`, never 400); ultra-long sessions (> 2048 ids) pin a truncated tail the same way — the longer overlap proves MORE. Only snapshot rounds (empty ledger / post-fold re-anchor) send the full form; full form always wins when both arrive. The response carries `x-bili-msgid-mode: incremental|full` (cleared on any 4xx; one learning point next to x-bili-pf-seq). Any mismatch self-heals within one round. Default 100%; set 0 to roll back to full-list pinning (byte-identical to pre-feature). Requires pluginLaneServerHistory. See docs/session-identity-resolution.md."
    desc_zh: "增量 msgid pin 通道(#7064 §8,owner 裁定 2026-11-18/19):稳态插件轮用**尾形态**申报消息 id——有界的 `x-bili-pf-tail-ids` 头(锚点+新增,≤ 2048 个,`?` 占位槽)或短 body id 数组——替代全量清单;服务端从自己账本的 live 行重盖前缀 id(ingest 是 INSERT OR IGNORE on (session_id,seq)——位置上的 msg_id 只写一次,永不改写)。接受规则(2026-11-19 定型):声明的尾段 [T-L, T-1] 与账本重叠段逐行相等(任一行漂移⇒降级 full,永不 400);超长会话(>2048)截断的尾清单同样可 pin——重叠段更长、证明更强。只有快照轮(账本空/折叠后重锚)发全量形态;全量优先于尾形态同时到达。响应携带 `x-bili-msgid-mode: incremental|full`(4xx 即清,与 x-bili-pf-seq 同一学习点)。任何失配一轮内自愈。默认 100%;设 0 回滚到全量清单 pin(与特性前字节一致)。需先开 pluginLaneServerHistory。见 session-identity-resolution.zh-CN.md。"
    desc_ja: "増分 msgid pin チャネル(#7064 §8、オーナー裁定 2026-11-18/19)：定常プラグインターンはメッセージ ID を**テール形態**で申告する — 有界な `x-bili-pf-tail-ids` ヘッダー（アンカー+新規 ID、≤ 2048 個、`?` プレースホルダ）または短い body ID 配列 — 全リストを置き換える。サーバーは自前の台帳 live 行からプレフィックス ID を再スタンプする（ingest は INSERT OR IGNORE on (session_id,seq) — 位置の msg_id は一度だけ書き込まれ、決して上書きされない）。受理規則（2026-11-19 定石）：申告されたテール [T-L, T-1] と台帳の重複区間が逐行一致すること（1行でもずれれば `full` にデグレード、400 はしない）；超長セッション（> 2048）も切り詰められたテールで同じく pin できる — 重複区間が長いほど証拠は強い。スナップショットラウンド（台帳空/折り畳み後の再アンカー）のみ全形態を送る；両方到着時は全形態が優先。レスポンスは `x-bili-msgid-mode: incremental|full` を載せる（4xx でクリア、x-bili-pf-seq と同じ学習ポイント）。不一致は 1 ラウンドで自己修復。デフォルト 100%；0 で全リスト pin にロールバック（機能前とバイト一致）。pluginLaneServerHistory が必要。session-identity-resolution.md 参照。"
  - key: rollout.features.egressPlane
    type: "boolean | number"
    default: "100 (on, GA)"
    default_zh: "100(开,已 GA)"
    env: BILI_ROLLOUT_EGRESS_PLANE
    group: behavior
    desc_en: "The egress plane — ONE switch for the whole new path (#7398/#7439; replaces the retired egressOpLog/egressServeLog pair). ON: every wire lane (OpenAI/Anthropic/Responses/Google) records its outbound conversation view as sparse ops (I/D/U) into the egress_state/egress_flow dual tables — rows are SELF-CONTAINED (message bytes ride the row; no content CAS, ruling 7439-1) — and serves the outbound core-message portion back from the op log, byte-identical by construction (the row bytes are the pipeline's own final core JSON); pinned plugin lanes additionally take server authority — the kernel input is replayed from the flow (rulings 7439-3/5). A bounded backward ladder recovers to the newest healthy log point; ANY unrebuildable row (missing/empty bytes, unknown role), corrupt log, or probe failure degrades that turn to the legacy chain — never a partial swap, never client-as-authority. The system block stays live-built in both paths (prefix-cache anchor discipline). SQLite lane only; title-gen/compaction side requests excluded. Default 100 = ON (GA, owner ruling 2026-11-24 — the egress plane is the end-state identity/storage architecture; the #7577 block tables and #7581/#7617 identity consolidation ride on it). Opt OUT with `rollout.features.egressPlane: false` (or a percent) / `BILI_ROLLOUT_EGRESS_PLANE=0` — the legacy chain, zero rows, byte-identical to pre-feature. Round 2 (KDD #23): for egress-on sessions the `messages` table is a LAZY projection — no per-turn ingest, the pin channel resolves the op log's I rows, and the session JSON envelope freezes at bootstrap — so per-turn cost stays O(live-window) at any ledger size (10w cumulative measured 638 ms p50; resident guard: `tests/egress-bench.test.ts`, PR #6785 doc §6)."
    desc_zh: "egress 平面——整条新链路的**唯一开关**(#7398/#7439;取代已退役的 egressOpLog/egressServeLog 双键)。开:四条 wire 车道(OpenAI/Anthropic/Responses/Google)每轮把出站会话视图记为稀疏 op(I/D/U)写入 egress_state/egress_flow 双表——行**自包含**(消息字节随行走,不经内容 CAS,裁定 7439-1)——并从 op 日志回放重建出站核心消息段,按构造字节一致(行内字节就是管线自己的最终 core JSON);pinned 插件车道另获服务端权威——内核输入从流水回放(裁定 7439-3/5)。有界回溯阶梯恢复到最近健康日志点;任何不可重建行(缺/空字节、未知 role)、日志损坏或探针失败,整轮降级 legacy 链路——绝不部分替换、绝不客户端为准。system 块两条路径都保持 live 构建(前缀缓存锚点纪律)。仅 SQLite 车道;标题生成/压缩侧路请求排除。默认 100 = 开(GA,owner 裁定 2026-11-24——egress 平面是身份/存储架构的终态;#7577 块表与 #7581/#7617 身份收拢骑在它之上)。要旧行为就关:`rollout.features.egressPlane: false`(或百分比)/ `BILI_ROLLOUT_EGRESS_PLANE=0`——legacy 链路,零行,与特性前字节一致。第 2 轮(KDD #23):egress-on 会话的 `messages` 表是**惰性投影**——不逐轮 ingest,pin 通道解析 op log 的 I 行,会话 JSON 信封 bootstrap 冻结——单轮成本恒为 O(存活窗口),与账本规模无关(10w 累计实测 638ms p50;常驻守卫:`tests/egress-bench.test.ts`,PR #6785 文档 §6)。"
    desc_ja: "egress プレーン — 新しい経路全体の**単一スイッチ**(#7398/#7439；退役した egressOpLog/egressServeLog の二キーを置き換え)。ON：全 wire レーン（OpenAI/Anthropic/Responses/Google）が毎ターン送信会話ビューをスパース op（I/D/U）として egress_state/egress_flow デュアルテーブルに記録 — 行は**自己完結**（メッセージバイトが同行する；コンテンツ CAS を経由しない、裁定 7439-1）— 送信コアメッセージ部分を op ログから復元し再構築、構造によりバイト一致（行内バイトはパイプライン自身の最終 core JSON）；ピン留め済みプラグインレーンは加えてサーバー権威を取得 — カーネル入力をフローからリプレイ（裁定 7439-3/5）。有界の遡行ラダーで最新の健全ログ点に回復；再構築不能行（バイト欠落/空、未知 role）、ログ破損、プローブ失敗のいずれかで**そのターン全体**をレガシーチェーンにデグレード — 部分的な swap は絶対にしない、クライアントを権威にしない。system ブロックは両経路でライブ構築のまま（プレフィックスキャッシュアンカー規律）。SQLite レーンのみ；タイトル生成/圧縮のサイドリクエストは除外。デフォルト 100 = ON（GA、owner 裁定 2026-11-24 — egress プレーンは ID/ストレージアーキテクチャの最終形態；#7577 ブロックテーブルと #7581/#7617 の ID 統合がこの上に載る）。旧挙動に戻すには `rollout.features.egressPlane: false`（またはパーセンテージ）/ `BILI_ROLLOUT_EGRESS_PLANE=0` で OFF — レガシー経路、0 行、機能前とバイト一致。第 2 回（KDD #23）：egress-on セッションでは `messages` テーブルは**遅延投影**——ターンごとの ingest なし、pin チャネルは op ログの I 行を解決、セッション JSON エンベロープはブートストラップで凍結——ターンごとのコストは台帳サイズに関係なく O（ライブウィンドウ）のまま（10w 累計実測 638 ms p50；常駐ガード：`tests/egress-bench.test.ts`、PR #6785 ドキュメント §6）。"
  - key: rollout.features.pluginDeltaResend
    type: "boolean | number"
    default: "0 (off)"
    default_zh: "0(关)"
    env: BILI_ROLLOUT_PLUGIN_DELTA_RESEND
    group: behavior
    desc_en: "Delta resend — the tail-slice form of the full-resend watermark lane: steady plugin-lane turns send x-bili-pf-delta: 1 + body.messages = ONLY the new elements (L = T − stampT, no prefix); the server rebuilds the view from the stashed prefix cores plus the parsed tail (same hit provenance as the full lane). ANY unsatisfiable claim (count/body/tail-ids width mismatch, anchor-chain break after a known list, rollout off) returns 400 pf_delta_reanchor + x-bili-msgid-mode: full and the client resends that turn in full form — one-round convergence, never a silent misparse. OFF by default: delta bodies are unprocessable by servers that do not ship this arm, so the key stays 0 until client send-sides exist. See technical-notes.md “Delta resend”."
    desc_zh: "Delta 重发——全量重发水位快路径的尾切片形态:稳态轮发 x-bili-pf-delta: 1 + body.messages = **只有**新元素(L = T − stampT,无前置);服务端用钉存前缀核 + 解析出的尾部重建视图(与全量车道同源的命中可证)。任何不成立的声明(count/body/tail-ids 宽度不符、已知清单后锚链断裂、灰度关)返回 400 pf_delta_reanchor + x-bili-msgid-mode: full,客户端当轮改发全量形态——一轮收敛,绝不静默错解。默认**关**:delta body 对未上车的服务端不可处理,故保持 0 直到客户端发送端就位。见 technical-notes.zh-CN.md「Delta 重发」。"
    desc_ja: "Delta 再送 — フルリセンドウォーターマークレーンのテールスライス形態：定常プラグインレーンのターンは `x-bili-pf-delta: 1` + body.messages = 新要素のみ（L = T − stampT、プレフィックスなし）を送る；サーバーはスタッシュ済みプレフィックスコアとパース済みテールからビューを再構築する（フルレーンと同一のヒット由来）。満たせない主張（count/body/tail-ids 幅の不一致、既知リスト後のアンカーチェーン破断、ロールアウトオフ）は 400 `pf_delta_reanchor` + `x-bili-msgid-mode: full` を返し、クライアントはそのターンをフルフォームで再送する — 1ラウンドで収束、静かな誤パースは絶対にしない。デフォルトオフ：delta body はこのアームを持たないサーバーでは処理できないため、クライアント送信側が実装されるまでキーは 0 のまま。`technical-notes.md` の「Delta resend」を参照。"
  - key: rollout.features.pluginFullResendWatermark
    type: "boolean | number"
    default: "100 (GA — on by default)"
    default_zh: "100(GA — 默认开)"
    env: BILI_ROLLOUT_PLUGIN_FULL_RESEND_WATERMARK
    group: behavior
    desc_en: "Full-resend watermark fastpath (#5403/#5418): plugin-lane chat-completions turns whose previous response carried an x-bili-pf-seq stamp assert the resent prefix via the echoed count (structural scan, no full parse); on a hit the pipeline consumes stashed canonical prefix cores plus only the new tail window (byte-identical outbound provenance; ANY doubt falls back to the untouched full-parse path per turn and re-stamps, five credited misses hold the lane for one hour). Requires the client to echo the stamp back as x-bili-pf-count (dsh/pi/opencode/omp do; unadapted lanes never hit). GA — ON by default (owner ruling 2026-11-22, PR #6785: the 5% grey ran since 2026-11-02 with no issues); one-time intro notice in the web UI, tri-state switch in quick config. Turn off with `false` (or a percent) / env = 0. See technical-notes.md “Full-resend watermark fastpath”."
    desc_zh: "全量重发水位快路径(#5403/#5418):插件车道 chat-completions 回合若上一轮响应盖有 x-bili-pf-seq,则用回声计数声明重发前缀(结构扫描,不做全量解析);命中时管线只消费钉存的前缀核 + 新增尾巴窗口(出站字节同源可证;任何疑点当轮回退未动过的全量解析路径并重新盖戳,连续五次计名失配将车道按住一小时)。需客户端把戳回声为 x-bili-pf-count(适配的车道回带;其余车道不会命中)。**GA**——默认开启(owner 裁定 2026-11-22,PR #6785:5% 灰度自 2026-11-02 运行无问题);web 面板对全部安装显示一次性公告、快速配置提供三态开关;`false`(或百分比)/ env = 0 关。见 technical-notes.zh-CN.md「全量重发水位快路径」。"
    desc_ja: "フルリセンドウォーターマークファストパス (#5403/#5418)：前回のレスポンスに `x-bili-pf-seq` ス tamp を持っていたプラグインレーンのチャットコンプリートターンでは、エコーされたカウントにより再送信プレフィックスをアサートする（構造スキャン、フルパースなし）；ヒット時にパイプラインはスタッシュされた正規プレフィックスコアと新しいテールウィンドウのみを消費する（バイト同一の送信プロベナンス；疑義がある場合はターンごとに未変更のフルパースパスにフォールバックし再スタンプ、5回のクレジットミスでレーンを1時間保持）。クライアントがスタンプを `x-bili-pf-count` としてエコーバックすることを要求（dsh/pi/opencode/omp は対応；未適応レーンはヒットしない）。GA — デフォルトON（オーナー裁定 2026-11-22、PR #6785：5%グレースケールは2026-11-02以降問題なく運用）；Web UIで全インストールに一度限りの導入通知、クイック設定に3状態スイッチ。`false`（またはパーセンテージ）/ 環境変数 = 0 でオフ。`technical-notes.md` の「Full-resend watermark fastpath」を参照。"
  - key: rollout.features.passDshExtensions
    type: "boolean | number"
    default: "0 (off = intercept)"
    default_zh: "0(关 = 拦截)"
    env: BILI_ROLLOUT_PASS_DSH_EXTENSIONS
    group: behavior
    desc_en: "DSH client-extension intercept (#7168/#7439): DSH (deepseek-harness) rides top-level `dsh_*` fields on every request — `dsh_session_log` (the 8 MiB lossless session-log upload for the official DeepSeek API; the model never reads it) plus the sibling `dsh_plugin_packages`; forked/seeded sessions resend the whole log each turn until the watermark catches up. Default 0% = INTERCEPT: bili strips every TOP-LEVEL `dsh_*` key from the inbound body (src/server/handle.ts) before any protocol path builds the outbound, so the 8 MiB is never forwarded upstream — no bandwidth waste, no unknown-field risk on a non-DeepSeek upstream. DSH is unaffected: its upload watermark only advances on a 2xx, which bili still returns, so the resends self-heal. The window meter is separately exempt via the #7168 dsh_* skip (src/preflight.ts). RELEASE by flipping to 100% (or removing the strip) once the server-authoritative egress work (#6785 / discussion #7439) ships the client-extension sideband; force pass-through now with `true` / env = 1."
    desc_zh: "DSH 客户端扩展拦截(#7168/#7439):DSH(deepseek-harness)每个请求都带顶层 `dsh_*` 字段——`dsh_session_log`(给官方 DeepSeek API 的 8 MiB 增量无损会话日志,模型根本不读)加孪生字段 `dsh_plugin_packages`;fork/seed 会话在水位追上前每轮从头整段重传。默认 0% = 拦截:bili 在入站 body 解析后、任何协议路径构建出站前,删掉所有**顶层** `dsh_*` 键(src/server/handle.ts),8 MiB 永不转发上游——不浪费带宽,非 DeepSeek 上游也不见陌生大字段。DSH 不受影响:其上传水位只在 2xx 时推进,bili 照常回 2xx,重传自愈。窗口计量另由 #7168 的 dsh_* 豁免(src/preflight.ts)兜底。等服务端权威 egress 工作(#6785 / 讨论 #7439)把客户端扩展旁路带做好后,翻到 100%(或移除裁切)即放开;现在想临时放行用 `true` / env = 1。"
    desc_ja: "DSHクライアント拡張インターセプト (#7168/#7439)：DSH（deepseek-harness）は全リクエストにトップレベルの `dsh_*` フィールドを載せる — `dsh_session_log`（公式 DeepSeek API 向けの 8 MiB 無損セッションログアップロード；モデルは読まない）と姉妹フィールド `dsh_plugin_packages`；フォーク/シードされたセッションはウォーターマークが追いつくまで毎ターンログ全体を再送する。デフォルト 0% = インターセプト：bili は受信ボディの解析後、プロトコルパスが送信を構築する前に、すべてのトップレベル `dsh_*` キーを削除する（`src/server/handle.ts`）ため、8 MiB は決して上流に転送されない — バンド幅の無駄がなく、非 DeepSeek 上流での未知フィールドリスクもない。DSH には影響なし：アップロードウォーターマークは 2xx のみで前進し、bili は依然 2xx を返すため、再送は自己修復する。ウィンドウメーターは #7168 の dsh_* スキップ（`src/preflight.ts`）で別途免除。サーバー権威エグレス作業（#6785 / ディスカッション #7439）がクライアント拡張サイドバンドを搭載したら 100% に切り替える（またはストリップを削除する）ことでリリース；当面は `true` / 環境変数 = 1 でパストスルーを強制。"
