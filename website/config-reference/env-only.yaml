# Config reference seed — environment-only variables (no config-file twin) (#2107 single source of truth).
# Edit HERE, then run: node tools/gen-config-docs.mjs generate
domain: env-only
entries:
  - key: BILI_DSH_AUTHORED_COMPACTION
    type: boolean
    default: "true (on, #3901 flip)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Let bili ANSWER dsh compaction summarize calls locally with the folded snapshot instead of refusing (#3733): identity header + kernel-rendered block summaries, zero egress; replay recognized via the #2432 rebase."
    desc_zh: "让 bili 本地应答 dsh 压缩摘要请求（返回折叠快照而非拒绝，#3733）：身份头 + 内核渲染格式的块摘要，零出口流量；重放经 #2432 再基线识别。"
  - key: BILI_DSH_CONTEXT_TAB
    type: boolean
    default: "true"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Env tier for dsh.contextTab (#4237): 0/false removes the DSH top-bar 「上下文」/「Context」 tab (everything else keeps working); any other value forces it on over the file tier; unset = file tier applies (default true). Takes effect on next page load / dsh restart."
    desc_zh: "dsh.contextTab 的 env 层（#4237）：0/false 移除 DSH 顶栏「上下文」标签页（其余一切照常工作）；其他取值强制开启并覆盖文件层；缺省 = 按文件层取值（默认 true）。下次页面加载 / dsh 重启生效。"
  - key: BILI_DSH_MAX_TESTED_VERSION
    type: string
    default: "0.2.0-rc.2 (CI e2e anchor)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Newest-tested @deepseek-ai/dsh build behind the dsh native lane's boot note (#4545): the running client build is resolved from the nearest node_modules/@deepseek-ai/dsh/package.json above the injected bundle; being STRICTLY NEWER than this cap earns ONE boot-time note (durable log record + banner) advising roll-back until support lands. One direction only — at-or-below-cap builds stay silent (known older-build break modes have their own overlay-latch detectors). Warns only — never gates or blocks traffic. Move the cap up as builds get verified; an EMPTY string turns the check off for this lane. Unresolvable/unparseable versions fail open to silence."
    desc_zh: “dsh native lane 启动提示的“我们测过的最高版本”上限（#4545）：从注入包上方最近的 node_modules/@deepseek-ai/dsh/package.json 读出运行中的构建,**严格高于**上限才弹一条启动提示(持久日志 + 横幅),建议先回滚到上限版本。只覆盖"更新"一个方向:≤ 上限保持静默(旧版已知坏法有专门的失锁探测)。只提示、绝不拦截或阻断流量;新版本验证通过后抬高上限,空字符串 = 关闭本 lane 检查;读不到/解析不了的版本按静默处理。”
  - key: BILI_STORAGE_BACKEND
    type: "sqlite|mysql"
    default: "sqlite"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Env tier for storage.backend (#3931): sqlite (default) or mysql (fully wired, #3388 steps 2+3 - saves ingest through the async shadow queue, sync reads ride the JSON envelope, replicas/ext/GC via the async twins; export too). Wins over the file tier."
    desc_zh: "storage.backend 的环境变量层（#3931）：sqlite（默认）或 mysql（已接线，#3388 第二+三步 —— 保存经异步影子队列入 mysql,同步读走 JSON 信封,replicas/ext/GC 走异步孪生;export 同样支持）。优先于文件层。"
  - key: BILI_MYSQL_DSN
    type: string
    default: "unset"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "MySQL DSN (mysql://user:pass@host:3306/db) for storage.backend=\"mysql\" (#3388, #3931). Wins over the file key storage.mysql.dsn. Empty = the mysql backend cannot open; the documented error names both knobs. The pool opens lazily; closeQuietlyAsync drains the ingest queue and closes it."
    desc_zh: "storage.backend=\"mysql\" 的 MySQL DSN（mysql://user:pass@host:3306/db）（#3388，#3931）。优先于文件键 storage.mysql.dsn。留空 = mysql 后端无法打开;文档化错误会列出两个旋钮。连接池惰性打开;closeQuietlyAsync 排空入队事务并关闭。"
  - key: BILI_STORAGE_ARCHIVE_AFTER_DAYS
    type: integer
    default: "365"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "GC age sweep window in days (#3463): sessions idle longer than this are archived (one JSON line appended to the single archive log (archive/archive.jsonl) + tombstone row + content/media refs released). 0 disables the age sweep; the manual entry POST /__bili/storage/gc always runs. Config-file key storage.archiveAfterDays is the persistent form."
    desc_zh: "GC 年龄清扫窗口（天，#3463）：闲置超过该时长的会话被归档（单文件归档日志 archive/archive.jsonl 追加一行 + 墓碑行保留标签 + 释放内容/媒体引用）。0 关闭年龄清扫；手动入口 POST /__bili/storage/gc 始终可用。配置文件键 storage.archiveAfterDays 为持久形式。"
  - key: BILI_STORAGE_QUICK_CHECK
    type: string
    default: "on"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Storage integrity self-check at open (#4175): every index.db open runs PRAGMA quick_check BEFORE migrations; on failure the shadow layer quarantines the file set (index.db/-wal/-shm renamed to .corrupt-<ts>) and reopens fresh (JSON envelopes remain the recovery source). Set 0 only for boot-time-sensitive huge deployments where the check's cost matters."
    desc_zh: "存储开库自检（#4175）：每次 index.db 打开在迁移之前先跑 PRAGMA quick_check;失败时影子层把文件组（index.db/-wal/-shm 改名为 .corrupt-<ts>）隔离并重建新库（JSON 信封仍是恢复源）。仅当超大库的启动时间敏感时才设 0 跳过。"
  - key: BILI_SNAPSHOT_SHADOW
    type: boolean
    default: "true (on)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Snapshot-render shadow observability (#3756 follow-up): compute the outbound snapshot view on every armed turn WITHOUT using it, classify the diff against the legacy outbound, and surface per-session counters in the web panel + the snapshot-shadow diagnostics topic. 0/false/off disables; 1/true/on enables; otherwise the config-file snapshot.shadow boolean applies (default on). The render lane itself stays rollout-gated (BILI_ROLLOUT_SNAPSHOT_RENDER), so the shadow lane never changes outbound bytes - it is the dry-run evidence that flips the rollout later."
    desc_zh: "快照渲染影子对账（#3756 后续）：每轮已折叠会话都用引擎现算一次出站快照视图但不使用，与 legacy 实际出站比对分类，逐会话计数进 web 面板与 snapshot-shadow 诊断主题。0/false/off 关闭；1/true/on 开启；否则读配置文件 snapshot.shadow 布尔（默认开）。渲染车道本身仍受灰度开关控制（BILI_ROLLOUT_SNAPSHOT_RENDER），影子车道绝不改变出站字节 —— 它是后续翻转灰度的干跑证据。"
  - key: BILI_CONFIG_FILE
    type: string
    default: "unset (XDG config path)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Override the config file path (path relocation)."
    desc_zh: "覆盖配置文件路径（路径重定位）。"
  - key: BILI_SESSIONS_DIR
    type: string
    default: "unset (XDG state path)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Where session records are stored (path relocation)."
    desc_zh: "会话记录的存放目录（路径重定位）。"
  - key: BILI_ENCRYPTION_KEY
    type: string
    default: "unset"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Key material for encrypted persisted payloads (secret)."
    desc_zh: "加密持久化载荷的密钥材料（机密）。"
  - key: BILI_TUNNEL_ALLOWED_HOSTS
    type: "string[] (csv)"
    default: "unset"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Host allowlist for the MITM tunnel lane."
    desc_zh: "MITM 隧道车道的主机白名单。"
  - key: BILI_RECLAIM_FETCH_PATCH
    type: boolean-ish
    default: "on"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Toggle for reclaiming the global fetch patch on shutdown."
    desc_zh: "进程退出时回收全局 fetch 补丁的开关。"
  - key: BILI_CONFLICT_SCAN
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Enable the install-lane conflict scanner probe."
    desc_zh: "启用安装车道冲突扫描探针。"
  - key: BILI_CHAIN_MAX_FUTURE_SKEW_MS
    type: number
    default: "(built-in)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Tolerance for future-skewed chain checkpoint timestamps."
    desc_zh: "链检查点时间戳未来偏移的容忍度。"
  - key: BILI_CHAIN_RECENT_WINDOW_MS
    type: number
    default: "(built-in)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Recent-window size for chain checkpoint validation."
    desc_zh: "链检查点校验的近期窗口大小。"
  - key: BILI_ZONE_PORT
    type: number
    default: "18787 base (derived per lane)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Base port for lane-spawned proxy zones (port relocation)."
    desc_zh: "车道派生代理端口区的基础端口（端口重定位）。"
  - key: BILI_ZCODE_ROUTE
    type: string
    default: "unset"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Route selection for the zcode lane."
    desc_zh: "zcode 车道的路由选择。"
  - key: BILI_ZCODE_PORT
    type: number
    default: "unset"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Port pin for the zcode lane."
    desc_zh: "zcode 车道的端口钉死。"
  - key: BILI_ZCODE_SIGNING_FIXED
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Fixed-signing mode for the zcode credential lane."
    desc_zh: "zcode 凭据车道的固定签名模式。"
  - key: BILI_CLAUDE_UPSTREAM
    type: string
    default: "unset"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Upstream pin for the claude lane."
    desc_zh: "claude 车道的上游钉死。"
  - key: BILI_CODEX_STATE_MODE
    type: string
    default: "auto"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "codex state handling: auto (shared db via CODEX_SQLITE_HOME on modern codex, legacy overlay copies otherwise), shared, or legacy. Shared mode runs up to 16 concurrent sessions, one per-session overlay slot each; legacy keeps one exclusive overlay at a time."
    desc_zh: "codex 状态处理方式：auto（新版 codex 走 CODEX_SQLITE_HOME 共享库，旧版回退 overlay 副本）、shared、legacy。shared 模式最多 16 个并发会话，每会话一个独立 overlay 槽位；legacy 保持一次仅一个独占 overlay。"
  - key: BILI_ATTACH_HEALTH_DEADLINE_MS
    type: number
    default: "(built-in)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Deadline for attach health checks when joining an external daemon."
    desc_zh: "挂接外部守护进程时健康检查的截止时间。"
  - key: BILI_ATTACH_EVIDENCE_GRACE_MS
    type: number
    default: "(built-in)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Grace period for attach ownership evidence."
    desc_zh: "挂接归属证据的宽限期。"
  - key: BILI_PROVIDER_REWRITES
    type: string
    default: "unset"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Provider URL rewrite rules applied before routing."
    desc_zh: "路由前应用的 provider URL 重写规则。"
  - key: BILI_MCP_PROXY
    type: string
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Spawn channel: MCP proxy target for plugin-hosted tools."
    desc_zh: "派生通道：插件宿主工具的 MCP 代理目标。"
  - key: BILI_PARENT_PID
    type: number
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Spawn channel: parent process id for lifecycle supervision."
    desc_zh: "派生通道：父进程 id，用于生命周期监管。"
  - key: BILI_STRICT_PORT
    type: number
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Spawn channel: exact-port requirement (squatters refused loudly instead of hopping)."
    desc_zh: "派生通道：精确端口要求（被占用时响亮拒绝而非跳端口）。"
  - key: BILI_UPGRADE_REPLACEMENT
    type: boolean-ish
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Spawn channel: marks a self-restart replacement — it must own exactly the freed port or exit without hopping (#3044)."
    desc_zh: "派生通道：标记自重启替换进程——必须独占被释放的精确端口，否则直接退出而非跳端口（#3044）。"
  - key: BILI_OPENCODE_ACP_SPEC
    type: string
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Spawn channel: ACP spec marker for opencode-native lanes."
    desc_zh: "派生通道：opencode 原生车道的 ACP 规格标记。"
  - key: BILI_LAUNCHER_MODEL_WINDOWS
    type: string
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launcher channel: model-window overrides passed into spawned clients."
    desc_zh: "启动器通道：传入被派生客户端的模型窗口覆盖。"
  - key: BILI_LAUNCHER_LANE
    type: string
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launcher channel: lane identity of the spawning bili process."
    desc_zh: "启动器通道：派生方 bili 进程的车道身份。"
  - key: BILI_LAUNCHER_PLUGIN
    type: string
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launcher channel: plugin-mode handoff marker."
    desc_zh: "启动器通道：插件模式交接标记。"
  - key: BILI_LAUNCHER_DIRECT
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launcher channel: bypass the injected proxy for this launch."
    desc_zh: "启动器通道：本次启动绕过注入的代理。"
  - key: BILI_INHERITED_HTTP_PROXY
    type: string
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launcher channel: inherited http_proxy value preserved across the spawn boundary."
    desc_zh: "启动器通道：跨派生边界保留的 http_proxy 继承值。"
  - key: BILI_INHERITED_HTTPS_PROXY
    type: string
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launcher channel: inherited https_proxy value preserved across the spawn boundary."
    desc_zh: "启动器通道：跨派生边界保留的 https_proxy 继承值。"
  - key: BILI_INHERITED_ALL_PROXY
    type: string
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launcher channel: inherited all_proxy value preserved across the spawn boundary."
    desc_zh: "启动器通道：跨派生边界保留的 all_proxy 继承值。"
  - key: BILI_INHERITED_NO_PROXY
    type: string
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launcher channel: inherited no_proxy value preserved across the spawn boundary."
    desc_zh: "启动器通道：跨派生边界保留的 no_proxy 继承值。"
  - key: BILI_NATIVE_CLAUDE
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: marks a claude-native plugin process."
    desc_zh: "宿主姿态：标记 claude 原生插件进程。"
  - key: BILI_NATIVE_DSH
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: marks a dsh-native plugin process."
    desc_zh: "宿主姿态：标记 dsh 原生插件进程。"
  - key: BILI_NATIVE_KIMI
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: marks a kimi-native plugin process."
    desc_zh: "宿主姿态：标记 kimi 原生插件进程。"
  - key: BILI_NATIVE_OMP
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: marks an omp-native plugin process."
    desc_zh: "宿主姿态：标记 omp 原生插件进程。"
  - key: BILI_NATIVE_OPENCODE
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: marks an opencode-native plugin process."
    desc_zh: "宿主姿态：标记 opencode 原生插件进程。"
  - key: BILI_NATIVE_PI
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: marks a pi-native plugin process."
    desc_zh: "宿主姿态：标记 pi 原生插件进程。"
  - key: BILI_PI_INLINE
    type: boolean-ish
    default: "off (opt-in)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: pi inline lane (#3278) — the pi extension compresses IN-PROCESS through the pseudo-origin instead of spawning its own proxy; outranks a preset BILLION_CONTEXT_PROXY attach target. OPT-IN: #4687 reverts the #4571 default flip — unset env/file behaves exactly as before (attach/spawn). Truthy = any non-empty value except 0/false/no/off (on/yes/TRUE all enable). Codex Responses WS traffic is routed through a loopback-only bridge booted with the engine; if that bridge fails, the WS lane degrades DIRECT (warned) while HTTP compression stays in-process."
    desc_zh: "宿主姿态：pi 内联压缩通道（#3278）——pi 扩展在进程内通过伪源站直接压缩，不再另起代理进程；优先于预置的 BILLION_CONTEXT_PROXY 附着目标。需手动开启：#4687 收回 #4571 的默认翻转，不设置时行为与旧版完全一致（attach/spawn）；除 0/false/no/off 外任何非空值均算开启（on/yes/TRUE 均可）。codex 的 Responses WS 流量改走随引擎启动的仅回环桥；桥起不来时该通道退回直连（打 warn），HTTP 压缩仍留在进程内。"
  - key: BILI_OPENCODE_INLINE
    type: boolean-ish
    default: "off (opt-in)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: opencode inline lane (#3278 port) — the opencode plugin compresses IN-PROCESS through the pseudo-origin instead of spawning its own proxy; outranks a preset BILLION_CONTEXT_PROXY attach target. OPT-IN: the opencode lane keeps its legacy default (spawned proxy) unless this env or \"opencode\": {\"inline\": true} explicitly enables it (owner decision on #4687). Truthy = any non-empty value except 0/false/no/off (on/yes/TRUE all enable). Verified on the Bun host (engine boots and dispatches without node:sqlite)."
    desc_zh: "宿主姿态：opencode 内联压缩通道（#3278 移植）——opencode 插件在进程内通过伪源站直接压缩，不再另起代理进程；优先于预置的 BILLION_CONTEXT_PROXY 附着目标。需手动开启：按 #4687 决定，opencode 通道默认保持旧行为（另起代理），只有本环境变量或 \"opencode\": {\"inline\": true} 显式开启才切换；除 0/false/no/off 外任何非空值均算开启（on/yes/TRUE 均可）。已在 Bun 宿主上验证（无 node:sqlite 时引擎 boot/dispatch 正常）。"
  - key: BILI_INLINE_DEBUG
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Inline lane (#3278) only: keep the engine's log lines on stderr after muting them (the inline engine runs inside the pi process, where stderr is the interactive TUI — every [persist]/[storage]/[inline] line would scroll the input box away; default keeps them in bili.log only)."
    desc_zh: "仅内联通道（#3278）：把引擎日志保留在 stderr 上（默认关闭——内联引擎跑在 pi 进程里，stderr 就是交互终端，每行 [persist]/[storage]/[inline] 都会把输入框挤掉；默认只写 bili.log）。"
  - key: BILI_NATIVE_ZCODE
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: marks a zcode-native plugin process."
    desc_zh: "宿主姿态：标记 zcode 原生插件进程。"
  - key: BILI_PI_BIN
    type: string
    default: "pi (PATH lookup)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: explicit binary path for the pi client binary."
    desc_zh: "宿主姿态：pi 客户端二进制的显式路径。"
  - key: BILI_DSH_BIN
    type: string
    default: "dsh (PATH lookup)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: explicit binary path for the dsh client binary."
    desc_zh: "宿主姿态：dsh 客户端二进制的显式路径。"
  - key: BILI_MODEL_INFO_RETRY_MS
    type: number
    default: "(built-in)"
    kind: env-only
    audience: test
    group: envonly
    desc_en: "Test hook: retry interval for model-info lookups."
    desc_zh: "测试钩子：模型信息查询的重试间隔。"
  - key: BILI_DSH_RETRY_INTERVAL_MS
    type: number
    default: "(built-in)"
    kind: env-only
    audience: test
    group: envonly
    desc_en: "Test hook: retry interval for dsh lane operations."
    desc_zh: "测试钩子：dsh 车道操作的重试间隔。"
  - key: BILI_DSH_RECOVERY_INTERVAL_MS
    type: number
    default: "(built-in)"
    kind: env-only
    audience: test
    group: envonly
    desc_en: "Test hook: recovery sweep interval for the dsh lane."
    desc_zh: "测试钩子：dsh 车道恢复清扫间隔。"
  - key: ACP_DUMP_DIR
    type: string
    default: "unset"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Base directory override for wire dump output (path relocation)."
    desc_zh: "线路转储输出基础目录覆盖（路径重定位）。"
  - key: BILI_STREAM_STALL_MS
    type: number
    default: "(built-in)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Stall-detection timeout for committed upstream streams (no-byte silence before abort)."
    desc_zh: "已提交上游流的停滞检测超时（无字节静默多久后中止）。"
  - key: BILI_CLIENT_BIN
    type: string
    default: "unset (PATH lookup)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Explicit binary override for the launched client (resolved on PATH)."
    desc_zh: "被启动客户端二进制的显式覆盖（在 PATH 上解析）。"
  - key: BILI_CONVERSATION_ID
    type: string
    default: "unset (per-spawn UUID written by bili)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Per-spawn conversation UUID handed to MCP children whose host passes no session id (headless self-registration)."
    desc_zh: "传给 MCP 子进程的逐派生会话 UUID（宿主不传会话 id 时用于无头自注册）。"
  - key: BILI_LAUNCHER_MODEL_MAX_OUTPUTS
    type: "string (JSON id→maxOutput map)"
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launcher channel: per-model max-output map handed to the spawned proxy for output-headroom reservation."
    desc_zh: "启动器通道：传给被派生代理的逐模型最大输出映射，用于输出预留。"
  - key: BILI_LAUNCH_TOKEN
    type: string
    default: "unset (generated per launch)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launch token authenticating lane-internal endpoints between a launcher and its spawned proxy (secret)."
    desc_zh: "启动令牌，鉴权启动器与其派生代理之间的车道内部端点（机密）。"
  - key: BILI_MCP_DEFAULT_ORIGIN
    type: string
    default: "http://127.0.0.1:8787"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Fallback proxy origin candidate for MCP entry points."
    desc_zh: "MCP 入口的兜底代理 origin 候选。"
  - key: BILI_MCP_NO_ORPHAN_ADOPT
    type: boolean-ish
    default: "off (=1 disables orphan adoption)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Opt out of resumed-session orphan adoption when several host sessions share one proxy."
    desc_zh: "多个宿主会话共享一个代理时，退出恢复会话的孤儿收养。"
  - key: BILI_MITM_HOSTS
    type: "string[] (csv)"
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launcher channel: MITM whitelist hosts handed to the spawned proxy (distinct from the config-file twin BILI_MITM_DOMAINS)."
    desc_zh: "启动器通道：传给被派生代理的 MITM 白名单主机（区别于配置文件对应项 BILI_MITM_DOMAINS）。"
  - key: BILI_PLUGIN_AGENT
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Spawn channel: marks a plugin-agent process."
    desc_zh: "派生通道：标记插件 agent 进程。"
  - key: BILI_IMAGE_RESCALE_MAX_DIM
    type: integer
    default: "1600"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Longest-edge trigger threshold (px) for the egress image downscale pass (#3400); non-numeric or below 128 ignored (default applies). Env-only by design."
    desc_zh: "出站图片降采样 pass 的最长边触发阈值（像素，#3400）；非数字或低于 128 的取值按默认处理。设计上仅环境变量。"
