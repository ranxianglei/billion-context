    desc_zh: "宿主姿态：标记 opencode 原生插件进程。"
    desc_ja: "Host posture: opencode ネイティブプラグインプロセスであることを示します。"
  - key: BILI_NATIVE_PI
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: marks a pi-native plugin process."
    desc_zh: "宿主姿态：标记 pi 原生插件进程。"
    desc_ja: "Host posture: pi ネイティブプラグインプロセスであることを示します。"
  - key: BILI_PI_INLINE
    type: boolean-ish
    default: "inline when unset (DEFAULT-ON since #5428; explicit 0/false/no/off opts out)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: pi inline lane (#3278) — the pi extension compresses IN-PROCESS through the pseudo-origin instead of spawning its own proxy; outranks a preset BILLION_CONTEXT_PROXY attach target. DEFAULT-ON since #5428 (supersedes the #4687 opt-in rule): unset env+file runs inline; an announced attach target still beats the DEFAULT, so `bili pi` keeps its launcher proxy. Explicit OPT-OUT = 0/false/no/off (or `\"pi\": {\"inline\": false}`) — restores the old attach/spawn posture. Human surface: `bili -i/--inline pi` forces inline, `bili -s/--server pi` pins the proxy posture (beats an inherited inline env). Truthy = any non-empty value except 0/false/no/off (on/yes/TRUE all enable). Codex Responses WS traffic is routed through a loopback-only bridge booted with the engine; if that bridge fails, the WS lane degrades DIRECT (warned) while HTTP compression stays in-process."
    desc_zh: "宿主姿态：pi 内联压缩通道（#3278）——pi 扩展在进程内通过伪源站直接压缩，不再另起代理进程；优先于预置的 BILLION_CONTEXT_PROXY 附着目标。自 #5428 起默认开启（取代 #4687 的手动开启规则）：未设置 env+文件时走内联；显式宣告的附着目标仍压过默认，`bili pi` 照旧用 launcher 代理。显式关闭 = 0/false/no/off（或 `\"pi\": {\"inline\": false}`）——恢复旧的 attach/spawn 姿态。人类入口：`bili -i/--inline pi` 强制内联，`bili -s/--server pi` 钉死代理姿态（压过继承的内联变量）。除 0/false/no/off 外任何非空值均算开启（on/yes/TRUE 均可）。codex 的 Responses WS 流量改走随引擎启动的仅回环桥；桥起不来时该通道退回直连（打 warn），HTTP 压缩仍留在进程内。"
    desc_ja: "Host posture: pi インラインレーン (#3278) — pi 拡張機能は、独自のプロキシを spawn するのではなく、擬似オリジン経由でプロセス内で圧縮を行います。プリセットの BILLION_CONTEXT_PROXY アタッチターゲットよりも優先されます。#5428 以降、デフォルトで有効 (#4687 のオプトインルールを置き換え): 環境変数とファイルが未設定の場合はインラインで実行されます。アタッチターゲットが明示されている場合でも DEFAULT より優先されるため、`bili pi` はランチャープロキシを維持します。明示的なオプトアウト = 0/false/no/off (または `\"pi\": {\"inline\": false}`) — 従来のアタッチ/spawn ポスチャを復元します。人間向けインターフェース: `bili -i/--inline pi` でインラインを強制、`bili -s/--server pi` でプロキシポスチャを固定 (継承されたインライン環境変数よりも優先)。Truthy = 0/false/no/off 以外の空でない任意の値 (on/yes/TRUE はすべて有効化)。Codex Responses WS トラフィックは、エンジンと共に起動されるループバック専用ブリッジ経由でルーティングされます。このブリッジが失敗した場合、WS レーンは DIRECT にデグレードし (警告が表示されます)、HTTP 圧縮はプロセス内で維持されます。"
  - key: BILI_OPENCODE_INLINE
    type: boolean-ish
    default: "off (opt-in)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Host posture: opencode inline lane (#3278 port) — the opencode plugin compresses IN-PROCESS through the pseudo-origin instead of spawning its own proxy; outranks a preset BILLION_CONTEXT_PROXY attach target. OPT-IN: the opencode lane keeps its legacy default (spawned proxy) unless this env or \"opencode\": {\"inline\": true} explicitly enables it (owner decision on #4687). Truthy = any non-empty value except 0/false/no/off (on/yes/TRUE all enable). Verified on the Bun host (engine boots and dispatches without node:sqlite)."
    desc_zh: "宿主姿态：opencode 内联压缩通道（#3278 移植）——opencode 插件在进程内通过伪源站直接压缩，不再另起代理进程；优先于预置的 BILLION_CONTEXT_PROXY 附着目标。需手动开启：按 #4687 决定，opencode 通道默认保持旧行为（另起代理），只有本环境变量或 \"opencode\": {\"inline\": true} 显式开启才切换；除 0/false/no/off 外任何非空值均算开启（on/yes/TRUE 均可）。已在 Bun 宿主上验证（无 node:sqlite 时引擎 boot/dispatch 正常）。"
    desc_ja: "Host posture: opencode インラインレーン (#3278 ポート) — opencode プラグインは、独自のプロキシを spawn するのではなく、擬似オリジン経由でプロセス内で圧縮を行います。プリセットの BILLION_CONTEXT_PROXY アタッチターゲットよりも優先されます。オプトイン: opencode レーンは、この環境変数または \"opencode\": {\"inline\": true} が明示的に有効化されない限り、レガシーのデフォルト (spawn されたプロキシ) を維持します (#4687 におけるオーナーの決定)。Truthy = 0/false/no/off 以外の空でない任意の値 (on/yes/TRUE はすべて有効化)。Bun ホスト上で検証済み (エンジンは node:sqlite なしで起動およびディスパッチ可能)。"
  - key: BILI_INLINE_DEBUG
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Inline lane (#3278) only: keep the engine's log lines on stderr after muting them (the inline engine runs inside the pi process, where stderr is the interactive TUI — every [persist]/[storage]/[inline] line would scroll the input box away; default keeps them in bili.log only)."
    desc_zh: "仅内联通道（#3278）：把引擎日志保留在 stderr 上（默认关闭——内联引擎跑在 pi 进程里，stderr 就是交互终端，每行 [persist]/[storage]/[inline] 都会把输入框挤掉；默认只写 bili.log）。"
    desc_ja: "インラインレーン (#3278) のみ: ミュート後もエンジンのログ行を stderr に保持します (インラインエンジンは pi プロセス内で実行され、stderr は対話型 TUI です。すべての [persist]/[storage]/[inline] 行が入力ボックスをスクロールさせてしまうため、デフォルトでは bili.log にのみ保持されます)。"
