# Config reference seed — environment-only variables (no config-file twin) (#2107 single source of truth).
# Edit HERE, then run: node tools/gen-config-docs.mjs generate
domain: env-only
entries:
  - key: BILI_DSH_AUTHORED_COMPACTION
    type: boolean
    default: "true (on, #3901 flip)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Let bili ANSWER dsh compaction summarize calls locally with the folded snapshot instead of refusing (#3733): identity header + kernel-rendered block summaries, zero egress; replay recognized via the #2432 rebase."
    desc_zh: "让 bili 本地应答 dsh 压缩摘要请求（返回折叠快照而非拒绝，#3733）：身份头 + 内核渲染格式的块摘要，零出口流量；重放经 #2432 再基线识别。"
    desc_ja: "bili が dsh のコンパクト化要約呼び出しを拒否する (#3733) 代わりに、折り畳みスナップショットでローカルに ANSWER する: アイデンティティヘッダー + カーネルレンダリングされたブロック要約、ゼロエグレス; リプレイは #2432 リベースによって認識される。"
  - key: BILI_DSH_CONTEXT_TAB
    type: boolean
    default: "true"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Env tier for dsh.contextTab (#4237): 0/false removes the DSH top-bar 「上下文」/「Context」 tab (everything else keeps working); any other value forces it on over the file tier; unset = file tier applies (default true). Takes effect on next page load / dsh restart."
    desc_zh: "dsh.contextTab 的 env 层（#4237）：0/false 移除 DSH 顶栏「上下文」标签页（其余一切照常工作）；其他取值强制开启并覆盖文件层；缺省 = 按文件层取值（默认 true）。下次页面加载 / dsh 重启生效。"
    desc_ja: "dsh.contextTab (#4237) の環境変数ティア: 0/false で DSH トップバーの「上下文」/「Context」タブを削除 (その他はすべて動作維持); その他の値はファイルティアを上書きして強制オン; 未設定 = ファイルティアが適用 (デフォルト true)。次のページ読み込み / dsh 再起動時に有効化。"
  - key: BILI_DSH_MAX_TESTED_VERSION
    type: string
    default: "0.2.0-rc.2 (CI e2e anchor)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Newest-tested @deepseek-ai/dsh build behind the dsh native lane's boot note (#4545): the running client build is resolved from the nearest node_modules/@deepseek-ai/dsh/package.json above the injected bundle; being STRICTLY NEWER than this cap earns ONE boot-time note (durable log record + banner) advising roll-back until support lands. One direction only — at-or-below-cap builds stay silent (known older-build break modes have their own overlay-latch detectors). Warns only — never gates or blocks traffic. Move the cap up as builds get verified; an EMPTY string turns the check off for this lane. Unparseable versions fail open to silence; an UNRESOLVED version (the layout hides the host — packaged desktop hosts bundle it inside app.asar, #5302) earns ONE explicit \"could not detect\" boot note instead of staying silent (the check-off switch silences it too)."
    desc_zh: “dsh native lane 启动提示的“我们测过的最高版本”上限（#4545）：从注入包上方最近的 node_modules/@deepseek-ai/dsh/package.json 读出运行中的构建,**严格高于**上限才弹一条启动提示(持久日志 + 横幅),建议先回滚到上限版本。只覆盖"更新"一个方向:≤ 上限保持静默(旧版已知坏法有专门的失锁探测)。只提示、绝不拦截或阻断流量;新版本验证通过后抬高上限,空字符串 = 关闭本 lane 检查;解析不了的版本按静默处理;**读不到**(布局探测不可见,如桌面版把宿主包打进 app.asar,#5302)则弹一条「未能检测到」的显式提示而非保持沉默(关闭检查时同样闭嘴)。”
    desc_ja: "dsh ネイティブレーンのブートノート (#4545) 背後にある最新テスト済み @deepseek-ai/dsh ビルド: 実行中のクライアントビルドは、注入バンドルより上位の最も近い node_modules/@deepseek-ai/dsh/package.json から解決される; この上限より厳密に新しい場合、サポートが実装されるまでロールバックを推奨するブート時のノート (永続ログ記録 + バナー) が 1 回発行される。片方向のみ — 上限以下または等しいビルドは沈黙する (既知の旧ビルド破損モードには独自のオーバーレイラッチ検出器がある)。警告のみ — トラフィックをゲートまたはブロックしない。ビルドが検証されるにつれて上限を引き上げる; 空文字列はこのレーンでのチェックをオフにする。解析不能なバージョンは沈黙に向けてオープンに失敗する; 解決不能なバージョン (レイアウトがホストを隠す — パッケージ化されたデスクトップホストは app.asar 内に同梱, #5302) は沈黙の代わりに明示的な \"could not detect\" ブートノートを 1 回発行する (チェックオフのスイッチでもこれを黙らせる)。"
  - key: BILI_IDENTITY_HARVEST
    type: string
    default: "off"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Rollout-gated loopback harvest of client-local transcripts/sqlite for stable message-id lanes (#5825). Unset/empty = OFF (fully inert). `all` or a comma list of source ids (`claude,codebuddy,mcode`) enables matching sources for requests whose identity is loopback; every match also requires the `pluginLaneServerHistory` rollout to be ON. Anything undecidable degrades to the pre-wiring path for the whole turn — never a partial mapping. Dev/verification switch by design (the lanes are already safe per client), not a tuning knob."
    desc_zh: "#5825 身份信道接线的采集开关（灰度门控下的回环本地转录/SQLite 采集）：缺省关闭、完全惰性；`all` 或逗号列表（`claude,codebuddy,mcode`）开启对应来源，且仅对回环身份请求生效，同时要求 pluginLaneServerHistory 灰度为开。任何无法判定的情形整轮退化为接线前路径，绝不做部分映射。设计上是开发/验证开关而非调参旋钮。"
    desc_ja: "安定したメッセージ ID レーン (#5825) 向けクライアントローカルトランスクリプト/sqlite のロールアウトゲート付きループバックハーベスト。未設定/空 = OFF (完全に不活性)。`all` またはソース ID のカンマ区切りリスト (`claude,codebuddy,mcode`) は、アイデンティティがループバックであるリクエストの一致するソースを有効化する; すべての一致には `pluginLaneServerHistory` ロールアウトが ON であることも必要。判定不能なものは、ターン全体で配線前のパスにデグレード — 部分的なマッピングは決して行われない。設計上の開発/検証スイッチ (レーンはすでにクライアントごとに安全であるため)、調整ノブではない。"
  - key: BILI_STORAGE_BACKEND
    type: "sqlite|mysql"
    default: "sqlite"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Env tier for storage.backend (#3931): sqlite (default) or mysql (fully wired, #3388 steps 2+3 - saves ingest through the async shadow queue, sync reads ride the JSON envelope, replicas/ext/GC/fork via the async twins (#4911); export too). Wins over the file tier."
    desc_zh: "storage.backend 的环境变量层（#3931）：sqlite（默认）或 mysql（已接线，#3388 第二+三步 —— 保存经异步影子队列入 mysql,同步读走 JSON 信封,replicas/ext/GC/fork 走异步孪生（#4911）;export 同样支持）。优先于文件层。"
    desc_ja: "storage.backend (#3931) の環境変数ティア: sqlite (デフォルト) または mysql (完全配線済み, #3388 ステップ 2+3 - 非同期シャドウキュー経由でインジェストを保存、同期読み取りは JSON エンベロープに乗る、レプリカ/拡張/GC/フォークは非同期ツイン経由 (#4911); エクスポートも)。ファイルティアに優先する。"
  - key: BILI_MYSQL_DSN
    type: string
    default: "unset"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "MySQL DSN (mysql://user:pass@host:3306/db) for storage.backend=\"mysql\" (#3388, #3931). Wins over the file key storage.mysql.dsn. Empty = the mysql backend cannot open; the documented error names both knobs. The pool opens lazily; closeQuietlyAsync drains the ingest queue and closes it."
    desc_zh: "storage.backend=\"mysql\" 的 MySQL DSN（mysql://user:pass@host:3306/db）（#3388，#3931）。优先于文件键 storage.mysql.dsn。留空 = mysql 后端无法打开;文档化错误会列出两个旋钮。连接池惰性打开;closeQuietlyAsync 排空入队事务并关闭。"
    desc_ja: "storage.backend=\"mysql\" (#3388, #3931) 用の MySQL DSN (mysql://user:pass@host:3306/db)。ファイルキー storage.mysql.dsn に優先する。空 = mysql バックエンドが開けない; 文書化されたエラーは両方のノブを名指しする。プールは遅延で開かれる; closeQuietlyAsync はインジェストキューをドレインして閉じる。"
  - key: BILI_STORAGE_ARCHIVE_AFTER_DAYS
    type: integer
    default: "365"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "GC age sweep window in days (#3463): sessions idle longer than this are archived (one JSON line appended to the single archive log (archive/archive.jsonl) + tombstone row + content/media refs released). 0 disables the age sweep; the manual entry POST /__bili/storage/gc always runs. Config-file key storage.archiveAfterDays is the persistent form."
    desc_zh: "GC 年龄清扫窗口（天，#3463）：闲置超过该时长的会话被归档（单文件归档日志 archive/archive.jsonl 追加一行 + 墓碑行保留标签 + 释放内容/媒体引用）。0 关闭年龄清扫；手动入口 POST /__bili/storage/gc 始终可用。配置文件键 storage.archiveAfterDays 为持久形式。"
    desc_ja: "GC 年齢スウィープウィンドウ (日) (#3463): これより長くアイドル状態のセッションはアーカイブされる (単一のアーカイブログ (archive/archive.jsonl) に 1 行の JSON が追記 + トombstone 行 + コンテンツ/メディア参照の解放)。0 で年齢スウィープを無効化; 手動エントリ POST /__bili/storage/gc は常に実行される。設定ファイルキー storage.archiveAfterDays が永続形式である。"
  - key: BILI_STORAGE_QUICK_CHECK
    type: string
    default: "on"
    kind: env-only
    audience: user
    desc_zh: "存储开库自检（#4175）：每次 index.db 打开在迁移之前先跑 PRAGMA quick_check；一旦由本次启动自己的扫描证实损坏，文件原样保留在原地——不做任何自动搬移、复制或重建（自动恢复已撤回：BILI_STORAGE_JSON_WRITER=off 时索引是唯一的持久副本，自动操作无法保证完整数据恢复）——bili 照常启动，改用 JSON 信封服务，并给出响亮、可操作的告警指明手工修复步骤（备份后把 index.db/-wal/-shm 手工移开再启动——全新索引会从 JSON 信封重建）。PASS 判定会被缓存，之后的启动跳过重扫；FAIL 判定永不持久化（2026-10-30 owner 策略）：运行期/后台发现只是告警（响亮日志 + runtime-status，进程继续服务——jsonWriter 开启期间所写的 JSON 信封是恢复来源），每次启动都对当前文件集做新鲜扫描再判定，旧版本遗留的陈旧 FAIL 永远不能阻断后续启动。既没有自动改名/修复，也没有 legacy-only 兜底（继续以 legacy-only 运行会让 JSON 信封与死掉的索引永久分叉、再无对账可能）。瞬态打开失败（无引擎 / CANTOPEN / 只读 / 后端 DSN）仍响亮地拒绝启动并给出可操作的错误——环境类问题同样不允许静默走 legacy 兜底（活的第二写者已于 2026-10-31 移出该拒绝清单：多进程共享一个本地盘 index.db 是受支持拓扑，只提示、永不阻断启动）；真正需要纯 JSON 服务的部署请显式设置 BILI_STORAGE_UNIFIED=legacy（注意：留空现在是纯 SQLite 缺省，不是 legacy）。仅当超大部署对启动耗时敏感、检测成本构成问题时才设 0 跳过。"
    group: envonly
    desc_en: "Storage integrity self-check at open (#4175): every index.db open runs PRAGMA quick_check BEFORE migrations; if a corruption is PROVEN by THIS BOOT's own scan NOTHING is moved, copied or rebuilt automatically (auto-recovery was withdrawn #4609/#4626-era: with BILI_STORAGE_JSON_WRITER=off the index is the SOLE durable copy, so an automatic move or rebuild cannot guarantee full data recovery) and bili STARTS ANYWAY — serving from the JSON envelopes with a loud, actionable alarm naming the manual fix (back up then move index.db/-wal/-shm aside BY HAND, then start again — a fresh index rebuilds from the JSON envelopes). A successful PASS is cached so later starts skip the rescan; a FAIL verdict is NEVER persisted (2026-10-30 owner policy): runtime/background findings are alarms only (loud logs + runtime-status, the process keeps serving — JSON envelopes written while the jsonWriter was on remain the recovery source) and every boot decides again from a fresh scan of the CURRENT file set, so a stale FAIL left behind by an older version can never block future boots. There is NO automatic rename/repair AND no legacy-only fallback: continuing legacy-only would fork the JSON envelopes from the dead index forever (never reconcilable). TRANSIENT open failures (no SQLite engine / CANTOPEN / readonly / backend DSN) make bili REFUSE TO START loudly with an actionable error — no silent legacy fallback for environment problems either (2026-10-30 owner policy; a live second writer left this refusal list on 2026-10-31 — sharing one local-disk index.db is the supported topology, informational only, never blocking); deployments that genuinely want JSON-only serve explicitly (BILI_STORAGE_UNIFIED=legacy — leaving it unset is the pure-sqlite default, not legacy). Set 0 only for boot-time-sensitive huge deployments where the check's cost matters."
    desc_ja: "オープン時のストレージ整合性セルフチェック (#4175): すべての index.db オープン時にマイグレーション前に PRAGMA quick_check を実行; このブートのスキャンによって破損が証明された場合、何も自動的に移動、コピー、再構築されない (自動回復は #4609/#4626 時代に撤回: BILI_STORAGE_JSON_WRITER=off ではインデックスが唯一の永続コピーであり、自動的な移動または再構築では完全なデータ回復を保証できないため) かつ bili はそれでも起動する — JSON エンベロープからサーブし、手動修正 (バックアップしてから index.db/-wal/-shm を手動で退避し、再起動 — 新しいインデックスは JSON エンベロープから再構築される) を名指しする大きくて実行可能なアラームを発する。成功した PASS はキャッシュされ、後の起動で再スキャンをスキップする; FAIL 判定は決して永続化されない (2026-10-30 オーナーポリシー): ランタイム/バックグラウンドの発見はアラームのみ (大きなログ + ランタイムステータス、プロセスはサーブを継続 — jsonWriter が on の間に書かれた JSON エンベロープが回復ソースのまま) であり、すべてのブートは現在のファイルセットの新しいスキャンから再決定するため、古いバージョンが残した古い FAIL が将来のブートをブロックすることは決してない。自動リネーム/修復もレガシー専用フォールバックもない: レガシー専用で続行すると、JSON エンベロープが死んだインデックスから永遠に分岐する (決して調整不能)。一時的なオープン失敗 (SQLite エンジンなし / CANTOPEN / 読み取り専用 / バックエンド DSN) は、実行可能なエラーで bili が大きく起動を拒否する — 環境問題に対するサイレントレガシーフォールバックもない (2026-10-30 オーナーポリシー; ライブな第二ライターがこの拒否リストを 2026-10-31 に残した — 1 つのローカルディスク index.db を共有することはサポートされるトポロジーであり、情報提供のみ、決してブロックしない); 真に JSON のみでサーブしたいデプロイは明示的に設定する (BILI_STORAGE_UNIFIED=legacy — 未設定はピュア SQLite のデフォルトであり legacy ではない)。チェックのコストが重要なブート時感度の高い巨大デプロイでのみ 0 を設定する。"
  - key: BILI_SNAPSHOT_SHADOW
    type: boolean
    default: "true (on)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Snapshot-render shadow observability (#3756 follow-up): compute the outbound snapshot view on every armed turn WITHOUT using it, classify the diff against the legacy outbound, and surface per-session counters in the web panel + the snapshot-shadow diagnostics topic. 0/false/off disables; 1/true/on enables; otherwise the config-file snapshot.shadow boolean applies (default on). The render lane itself stays rollout-gated (BILI_ROLLOUT_SNAPSHOT_RENDER), so the shadow lane never changes outbound bytes - it is the dry-run evidence that flips the rollout later."
    desc_zh: "快照渲染影子对账（#3756 后续）：每轮已折叠会话都用引擎现算一次出站快照视图但不使用，与 legacy 实际出站比对分类，逐会话计数进 web 面板与 snapshot-shadow 诊断主题。0/false/off 关闭；1/true/on 开启；否则读配置文件 snapshot.shadow 布尔（默认开）。渲染车道本身仍受灰度开关控制（BILI_ROLLOUT_SNAPSHOT_RENDER），影子车道绝不改变出站字节 —— 它是后续翻转灰度的干跑证据。"
    desc_ja: "スナップショットレンダリングのシャドウ観測可能性（#3756 のフォローアップ）: アームされたターンごとに送信スナップショットビューを計算するが使用せず、レガシー送信との差分を分類し、セッションごとのカウンターを Web パネルおよびスナップショットシャドウ診断トピックに表示する。0/false/off で無効化、1/true/on で有効化、それ以外の場合は設定ファイルの snapshot.shadow ブール値が適用される（デフォルトは on）。レンダリングレーン自体はロールアウトゲート（BILI_ROLLOUT_SNAPSHOT_RENDER）で制御されるため、シャドウレーンは送信バイト列を変更しない - これは後日のロールアウトを切り替えるためのドライラン証拠である。"
  - key: BILI_CONFIG_FILE
    type: string
    default: "unset (XDG config path)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Override the config file path (path relocation)."
    desc_zh: "覆盖配置文件路径（路径重定位）。"
    desc_ja: "設定ファイルのパスを上書きする（パスの再配置）。"
  - key: BILI_SESSIONS_DIR
    type: string
    default: "unset (XDG state path)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Where session records are stored (path relocation)."
    desc_zh: "会话记录的存放目录（路径重定位）。"
    desc_ja: "セッションレコードの保存先（パスの再配置）。"
  - key: BILI_ENCRYPTION_KEY
    type: string
    default: "unset"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Key material for encrypted persisted payloads (secret)."
    desc_zh: "加密持久化载荷的密钥材料（机密）。"
    desc_ja: "暗号化された永続化ペイロード用の鍵材料（シークレット）。"
  - key: BILI_TUNNEL_ALLOWED_HOSTS
    type: "string[] (csv)"
    default: "unset"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Host allowlist for the MITM tunnel lane."
    desc_zh: "MITM 隧道车道的主机白名单。"
    desc_ja: "MITM トンネルレーン用のホスト許可リスト。"
  - key: BILI_RECLAIM_FETCH_PATCH
    type: boolean-ish
    default: "on"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Toggle for reclaiming the global fetch patch on shutdown."
    desc_zh: "进程退出时回收全局 fetch 补丁的开关。"
    desc_ja: "シャットダウン時にグローバル fetch パッチを回収するためのトグル。"
  - key: BILI_CONFLICT_SCAN
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Enable the install-lane conflict scanner probe."
    desc_zh: "启用安装车道冲突扫描探针。"
    desc_ja: "インストールレーンの競合スキャナープローブを有効にする。"
  - key: BILI_CHAIN_MAX_FUTURE_SKEW_MS
    type: number
    default: "(built-in)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Tolerance for future-skewed chain checkpoint timestamps."
    desc_zh: "链检查点时间戳未来偏移的容忍度。"
    desc_ja: "未来にずれたチェーンチェックポイントタイムスタンプの許容範囲。"
  - key: BILI_CHAIN_RECENT_WINDOW_MS
    type: number
    default: "(built-in)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Recent-window size for chain checkpoint validation."
    desc_zh: "链检查点校验的近期窗口大小。"
    desc_ja: "チェーンチェックポイント検証用の最近ウィンドウサイズ。"
  - key: BILI_ZONE_PORT
    type: number
    default: "18787 base (derived per lane)"
    kind: env-only
    audience: user
    group: envonly
