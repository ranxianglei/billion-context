    desc_en: "Test hook: recovery sweep interval for the dsh lane."
    desc_zh: "测试钩子：dsh 车道恢复清扫间隔。"
    desc_ja: "テストフック: dsh レーンのリカバリスウィープ間隔。"
  - key: ACP_DUMP_DIR
    type: string
    default: "unset"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Base directory override for wire dump output (path relocation)."
    desc_zh: "线路转储输出基础目录覆盖（路径重定位）。"
    desc_ja: "ワイヤダンプ出力のベースディレクトリのオーバーライド（パスの再配置）。"
  - key: BILI_STREAM_STALL_MS
    type: number
    default: "(built-in)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Stall-detection timeout for committed upstream streams (no-byte silence before abort)."
    desc_zh: "已提交上游流的停滞检测超时（无字节静默多久后中止）。"
    desc_ja: "コミット済みアップストリームストリームのストール検出タイムアウト（中断前の無バイト沈黙）。"
  - key: BILI_CLIENT_BIN
    type: string
    default: "unset (PATH lookup)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Explicit binary override for the launched client (resolved on PATH)."
    desc_zh: "被启动客户端二进制的显式覆盖（在 PATH 上解析）。"
    desc_ja: "起動するクライアントの明示的なバイナリオーバーライド（PATH で解決）。"
  - key: BILI_CONVERSATION_ID
    type: string
    default: "unset (per-spawn UUID written by bili)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Per-spawn conversation UUID handed to MCP children whose host passes no session id (headless self-registration)."
    desc_zh: "传给 MCP 子进程的逐派生会话 UUID（宿主不传会话 id 时用于无头自注册）。"
    desc_ja: "セッション ID を渡さないホストを持つ MCP 子プロセスに渡す、スポン時に生成される会話 UUID（ヘッドレス自己登録）。"
  - key: BILI_LAUNCHER_MODEL_MAX_OUTPUTS
    type: "string (JSON id→maxOutput map)"
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launcher channel: per-model max-output map handed to the spawned proxy for output-headroom reservation."
    desc_zh: "启动器通道：传给被派生代理的逐模型最大输出映射，用于输出预留。"
    desc_ja: "ランチャーチャネル: 出力ヘッドルームの予約のためにスポンされたプロキシに渡す、モデルごとの最大出力マップ。"
  - key: BILI_LAUNCH_TOKEN
    type: string
    default: "unset (generated per launch)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launch token authenticating lane-internal endpoints between a launcher and its spawned proxy (secret)."
    desc_zh: "启动令牌，鉴权启动器与其派生代理之间的车道内部端点（机密）。"
    desc_ja: "ランチャーとそのスポンされたプロキシ間のレーン内部エンドポイントを認証するランチャートークン（シークレット）。"
  - key: BILI_MCP_DEFAULT_ORIGIN
    type: string
    default: "http://127.0.0.1:8787"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Fallback proxy origin candidate for MCP entry points."
    desc_zh: "MCP 入口的兜底代理 origin 候选。"
    desc_ja: "MCP エントリポイント用のフォールバックプロキシオリジン候補。"
  - key: BILI_MCP_NO_ORPHAN_ADOPT
    type: boolean-ish
    default: "off (=1 disables orphan adoption)"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Opt out of resumed-session orphan adoption when several host sessions share one proxy."
    desc_zh: "多个宿主会话共享一个代理时，退出恢复会话的孤儿收养。"
    desc_ja: "複数のホストセッションが 1 つのプロキシを共有する場合、再開セッションの孤児採用を無効にする。"
  - key: BILI_MITM_HOSTS
    type: "string[] (csv)"
    default: "unset"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Launcher channel: MITM whitelist hosts handed to the spawned proxy (distinct from the config-file twin BILI_MITM_DOMAINS)."
    desc_zh: "启动器通道：传给被派生代理的 MITM 白名单主机（区别于配置文件对应项 BILI_MITM_DOMAINS）。"
    desc_ja: "ランチャーチャネル: スポンされたプロキシに渡す MITM ホワイトリストホスト（設定ファイルの双子 BILI_MITM_DOMAINS とは別物）。"
  - key: BILI_PLUGIN_AGENT
    type: boolean-ish
    default: "off"
    kind: env-only
    audience: internal
    group: envonly
    desc_en: "Spawn channel: marks a plugin-agent process."
    desc_zh: "派生通道：标记插件 agent 进程。"
    desc_ja: "スポンチャネル: プラグインエージェントプロセスを示す。"
  - key: BILI_IMAGE_RESCALE_MAX_DIM
    type: integer
    default: "1600"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Longest-edge trigger threshold (px) for the egress image downscale pass (#3400); non-numeric or below 128 ignored (default applies). Env-only by design."
    desc_zh: "出站图片降采样 pass 的最长边触发阈值（像素，#3400）；非数字或低于 128 的取值按默认处理。设计上仅环境变量。"
    desc_ja: "エグレス画像のダウンスケールパスのトリガー閾値（px）（#3400）; 数値でない場合または 128 未満の場合は無視される（デフォルトが適用される）。設計上、環境変数のみ。"
  - key: BILI_PLUGIN_BYPASS
    type: string
    default: "auto (unset = the inbound header decides)"
    kind: env-only
    audience: user
    group: envonly
    desc_en: "Operator override of the `x-bili-plugin-bypass` passthrough decision (#6220), read per-request (no restart). Three-state: unset (or `auto`) = current behavior — the inbound header decides per request (legacy opencode-acp sessions bypass, everything else gets the full pipeline); `1`/`on`/`true` = force bypass — every inbound request is forwarded verbatim (no tool injection, no nudge, no session binding); `0`/`off`/`false` = never bypass — any inbound `x-bili-plugin-bypass` header is ignored, so even legacy opencode-acp sessions get the full pipeline. Unrecognized values are treated as `auto` (current behavior). Env-only per the owner-approved design in #6220 (the header is a wire contract stamped by hosts; the override is a per-process operator posture, not a per-route config field)."
    desc_zh: "x-bili-plugin-bypass 透传判定的运维覆盖开关（#6220），逐请求读取（无需重启）。三态：未设置（或 auto）= 现状——由入站头逐请求决定（legacy opencode-acp 会话绕过，其余走完整管线）；1/on/true = 强制 bypass——所有入站请求原样透传（不注入工具、不注入 nudge、不绑定会话）；0/off/false = 永不 bypass——忽略任何入站 x-bili-plugin-bypass 头，即使 legacy opencode-acp 会话也走完整管线。无法识别的取值按 auto 处理（= 现状）。按 #6220 owner 拍板仅环境变量（该头是宿主盖戳的线路契约，覆盖是逐进程运维姿态，而非逐路由配置项）。"
    desc_ja: "x-bili-plugin-bypass パススルー判定のオペレーターオーバーライド（#6220）、リクエストごとに読み取り（再起動不要）。3 状態：未設定（または auto）= 現状 — 受信ヘッダーがリクエストごとに判定（legacy opencode-acp セッションはバイパス、その他はフルパイプライン）；1/on/true = 強制バイパス — すべての受信リクエストをそのまま転送（ツール注入なし、nudge なし、セッションバインドなし）；0/off/false = 常にバイパスしない — 受信 x-bili-plugin-bypass ヘッダーをすべて無視し、legacy opencode-acp セッションもフルパイプラインを通過。識別できない値は auto（= 現状）として扱われます。#6220 の owner 承認デザインにより環境変数のみ（ヘッダーはホストがスタンプするワイヤー契約であり、オーバーライドはプロセス単位のオペレーター姿勢であり、ルート単位の設定フィールドではない）。"
