# Config reference seed — process & persistence blocks (#2107 single source of truth).
# Edit HERE, then run: node tools/gen-config-docs.mjs generate
domain: process
entries:
  - key: network
    type: object
    default: "{} (all defaults)"
    group: process
    id: tt.network
    site_group: proc
    desc_en: "Transport timeouts, watchdogs and replay policy for upstream calls."
    desc_zh: "上游调用的传输超时、看门狗与重放策略。"
    site_en: "<code>network</code> — transport timeouts &amp; replays: <span class='mech'>upstreamTimeoutMs 720000 · requestWatchdogMs 2× · replayRetryMax 3 · replayRetryBaseMs 1500 · keepAliveTimeoutMs 5000 · clientErrorBackstopMs 30000 · exposureLogIntervalMs 3600000 · streamKeepAliveMs 15000 · preflightHoldMs 30000 · preflightDeadEndCooldownMs 300000 · proxyKeepAliveMaxMs 55000</span>."
    site_zh: "<code>network</code> —— 传输超时与重放：<span class='mech'>upstreamTimeoutMs 720000 · requestWatchdogMs 2× · replayRetryMax 3 · replayRetryBaseMs 1500 · keepAliveTimeoutMs 5000 · clientErrorBackstopMs 30000 · exposureLogIntervalMs 3600000 · streamKeepAliveMs 15000 · preflightHoldMs 30000 · preflightDeadEndCooldownMs 300000 · proxyKeepAliveMaxMs 55000</span>。"
  - key: network.upstreamTimeoutMs
    type: number
    default: "720000"
    env: BILI_UPSTREAM_TIMEOUT_MS
    group: process
    desc_en: "Hard ceiling on a single upstream call (12 min covers slow deep-thinking models)."
    desc_zh: "单次上游调用的硬上限（12 分钟覆盖慢速深度思考模型）。"
  - key: network.requestWatchdogMs
    type: number
    default: "2× upstreamTimeoutMs"
    env: BILI_REQUEST_WATCHDOG_MS
    group: process
    desc_en: "Absolute watchdog that force-aborts a stuck upstream socket even when the per-call timer was never armed."
    desc_zh: "绝对看门狗：即使按调用计时器从未挂上，也强制中止卡死的上游套接字。"
  - key: network.keepAliveTimeoutMs
    type: number
    default: "5000"
    env: BILI_KEEP_ALIVE_TIMEOUT_MS
    group: process
    desc_en: "Idle keep-alive timeout for pooled upstream sockets."
    desc_zh: "连接池内上游套接字的空闲保活超时。"
  - key: network.clientErrorBackstopMs
    type: number
    default: "30000"
    env: BILI_CLIENT_ERROR_BACKSTOP_MS
    group: process
    desc_en: "Backstop that aborts a client connection that stops reading a committed response."
    desc_zh: "中止停止读取已提交响应的客户端连接的兜底超时。"
  - key: network.exposureLogIntervalMs
    type: number
    default: "3600000 (0 disables the log)"
    env: BILI_EXPOSURE_LOG_INTERVAL_MS
    group: process
    desc_en: "How often bound-address exposure warnings repeat in the log; 0 disables them entirely."
    desc_zh: "绑定地址暴露警告在日志中的重复间隔；0 完全禁用。"
  - key: network.streamKeepAliveMs
    type: number
    default: "15000 (0 disables)"
    env: BILI_STREAM_KEEPALIVE_MS
    group: process
    desc_en: "Downstream stream keep-alive ping interval between model chunks; 0 disables pinging."
    desc_zh: "模型块之间的下游流保活心跳间隔；0 禁用心跳。"
  - key: network.preflightHoldMs
    type: number
    default: "30000"
    env: BILI_PREFLIGHT_HOLD_MS
    group: process
    desc_en: "How long a failed preflight holds before the request is allowed through unreconciled."
    desc_zh: "preflight 失败后，允许请求未校准放行的持有时长。"
  - key: network.preflightDeadEndCooldownMs
    type: number
    default: "300000"
    env: BILI_PREFLIGHT_DEAD_END_COOLDOWN_MS
    group: process
    desc_en: "Cooldown after a dead-end preflight before retrying reconciliation for the same session."
    desc_zh: "死胡同 preflight 后，对同一会话重试校准的冷却时长。"
  - key: network.replayRetryMax
    type: number
    default: "3 (1 disables replays)"
    env: BILI_REPLAY_RETRY_MAX
    group: process
    desc_en: "Maximum transport-failure replays of an identical request before surfacing the error."
    desc_zh: "同一请求在向上游暴露错误前的最大传输失败重放次数。"
  - key: network.replayRetryBaseMs
    type: number
    default: "1500 (0 disables the delay)"
    env: BILI_REPLAY_RETRY_BASE_MS
    group: process
    desc_en: "Base backoff delay between replays (exponential)."
    desc_zh: "重放之间的基础退避延迟（指数增长）。"
  - key: network.maxShrinkPerCompress
    type: number
    default: "unset"
    env: BILI_MAX_SHRINK_PER_COMPRESS
    group: process
    desc_en: "Cap on how much one compression may shrink history (anti-collapse guard)."
    desc_zh: "单次压缩允许收缩历史的上限（防塌缩护栏）。"
  - key: network.proxyKeepAliveMaxMs
    type: number
    default: "55000 (0 = one-shot connections)"
    env: BILI_PROXY_KEEPALIVE_MAX_MS
    group: process
    desc_en: "Max lifetime of a connection through an outbound egress proxy before forcing reconnection (avoids stale NAT mappings)."
    desc_zh: "经出站代理的连接最大存活时长，到期强制重建（规避陈旧 NAT 映射）。"
  - key: network.postResponseLingerMs
    type: number
    default: "5000"
    env: BILI_POST_RESPONSE_LINGER_MS
    group: process
    desc_en: "Graceful-close budget for proxy-initiated closes after the response completed: the socket is held waiting for the peer's FIN/TLS close_notify and destroyed at the deadline (reason=linger-backstop)."
    desc_zh: "代理主动发起的响应后关闭的优雅关闭预算：socket 挂起等待对端 FIN/TLS close_notify，到点销毁（reason=linger-backstop）。"
  - key: persist
    type: object
    default: "{} (all defaults)"
    group: process
    id: tt.persist
    site_group: proc
    desc_en: "Session persistence to disk under the XDG state dir."
    desc_zh: "会话落盘持久化（XDG state 目录之下）。"
    site_en: "<code>persist</code> — session persistence to disk: <span class='mech'>enabled true · zstd false · debounceMs 500 · tailTokens 16384 · epermAlertThreshold 5 · epermAlertRepeatMs 0</span>."
    site_zh: "<code>persist</code> —— 会话落盘持久化：<span class='mech'>enabled true · zstd false · debounceMs 500 · tailTokens 16384 · epermAlertThreshold 5 · epermAlertRepeatMs 0</span>。"
  - key: persist.enabled
    type: boolean
    default: "true"
    env: BILI_PERSIST
    group: process
    desc_en: "Master switch for writing session records to disk (0/false turns it off)."
    desc_zh: "会话记录落盘总开关（0/false 关闭）。"
  - key: persist.zstd
    type: boolean
    default: "false"
    env: BILI_PERSIST_ZSTD
    group: process
    desc_en: "Zstd-compress persisted session files (1/true enables)."
    desc_zh: "zstd 压缩持久化会话文件（1/true 启用）。"
  - key: persist.debounceMs
    type: number
    default: "500"
    env: BILI_PERSIST_DEBOUNCE_MS
    group: process
    desc_en: "Write debounce window for session files."
    desc_zh: "会话文件写入的去抖窗口。"
  - key: persist.tailTokens
    type: number
    default: "16384 (0 disables message persistence)"
    env: BILI_PERSIST_TAIL_TOKENS
    group: process
    desc_en: "Token-size tail of recent messages kept as raw text for export fidelity."
    desc_zh: "为导出保真保留的最近消息原文 token 尾部大小。"
  - key: persist.epermAlertThreshold
    type: number
    default: "5"
    env: BILI_PERSIST_EPERM_ALERT_THRESHOLD
    group: process
    desc_en: "Consecutive EPERM write failures before alerting in the log."
    desc_zh: "连续 EPERM 写失败达到该次数后在日志中告警。"
  - key: persist.epermAlertRepeatMs
    type: number
    default: "0 (no repeats)"
    env: BILI_PERSIST_EPERM_ALERT_REPEAT_MS
    group: process
    desc_en: "Repeat interval for the EPERM alert; 0 logs it once."
    desc_zh: "EPERM 告警的重复间隔；0 只记录一次。"
  - key: sessions
    type: object
    default: "{} (all defaults)"
    group: process
    id: tt.sessions
    site_group: proc
    desc_en: "Session-table size cap and opt-in garbage collection."
    desc_zh: "会话表容量上限与可选垃圾回收。"
    site_en: "<code>sessions</code> — <span class='mech'>max 256 (LRU) · gc { enabled false, maxAgeDays 7, maxTokens 1000000, intervalMs 3600000 }</span> — GC is opt-in; user data is never pruned silently."
    site_zh: "<code>sessions</code> —— <span class='mech'>max 256 (LRU) · gc { enabled false, maxAgeDays 7, maxTokens 1000000, intervalMs 3600000 }</span> —— GC 为可选：用户数据不会被悄悄清理。"
  - key: sessions.max
    type: number
    default: "256"
    env: BILI_MAX_SESSIONS
    group: process
    desc_en: "In-memory session table cap (LRU eviction of idle sessions)."
    desc_zh: "内存会话表上限（空闲会话 LRU 逐出）。"
  - key: sessions.gc.enabled
    type: boolean
    default: "false"
    env: BILI_SESSION_GC
    group: process
    desc_en: "Opt-in garbage collection of stale persisted sessions (user data is never pruned silently without this flag)."
    desc_zh: "过期持久化会话的可选垃圾回收（未开启时用户数据绝不被悄悄清理）。"
  - key: sessions.gc.maxAgeDays
    type: number
    default: "7"
    env: BILI_SESSION_GC_MAX_AGE_DAYS
    group: process
    desc_en: "GC age threshold in days."
    desc_zh: "GC 年龄阈值（天）。"
  - key: sessions.gc.maxTokens
    type: number
    default: "1000000"
    env: BILI_SESSION_GC_MAX_TOKENS
    group: process
    desc_en: "GC token-size threshold per session record."
    desc_zh: "GC 单会话记录的 token 大小阈值。"
  - key: sessions.gc.intervalMs
    type: number
    default: "3600000"
    env: BILI_SESSION_GC_INTERVAL_MS
    group: process
    desc_en: "GC sweep interval."
    desc_zh: "GC 清扫间隔。"
  - key: plugin.snapshotCapBytes
    type: number
    default: "104857600 (0 disables snapshots)"
    env: BILI_PUBLIC_SNAPSHOT_CAP_BYTES
    group: process
    id: tt.snap
    site_group: proc
    desc_en: "Size cap for fork-API public snapshots served to native plugins."
    desc_zh: "提供给原生插件的 fork API 公共快照大小上限。"
    site_en: "<code>plugin.snapshotCapBytes</code> — fork API snapshot cap (default 100 MiB; 0 disables snapshots)."
    site_zh: "<code>plugin.snapshotCapBytes</code> —— fork API 快照上限（默认 100 MiB；0 禁用快照）。"
  - key: audit.offline.enabled
    type: boolean
    default: "false"
    env: BILI_AUDIT_OFFLINE_ENABLED
    group: process
    desc_en: "Switch A of the abuse-audit lane (#2504): metrics-only offline re-review of persisted session files. Boot scan plus loopback admin readout; counts only - no alerts, no model calls, no content leaves the sessions dir."
    desc_zh: "滥用审计通道（#2504）开关 A：对已持久化会话文件做仅计数的离线复查。启动时扫描加 loopback 管理端点读取；只报计数——无告警、无模型调用、内容不离开 sessions 目录。"
