<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1050" viewBox="0 0 1560 1050">
  <style>
    html,body { margin:0; padding:0; background:#fff; }
    text { font-family: 'Noto Sans CJK SC','Droid Sans Fallback',sans-serif; }
    .tt { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .stage { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .n { font-size: 12px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 10.5px; fill: #475569; }
    .fn { font-size: 11px; font-weight: 700; }
    .warn { font-size: 12.5px; font-weight: 700; fill: #7f1d1d; }
    .warnb { font-size: 11px; fill: #991b1b; }
    .ok { font-size: 12px; font-weight: 700; fill: #14532d; }
    .okb { font-size: 10.5px; fill: #166534; }
    .leg { font-size: 11px; fill: #334155; }
  </style>
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arrI" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#4f46e5"/></marker>
    <marker id="arrA" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#b45309"/></marker>
    <marker id="arrGr" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="1560" height="1050" fill="#ffffff"/>
  <text x="30" y="42" class="tt">组件迁移总览 · 「现状」的十块组件在新架构下去向何处</text>
  <text x="30" y="68" class="sub">同一条链路、同一个内核 —— 多数组件原样保留或收窄职责；变化集中在「状态住哪、身份记在哪」两处收敛到单一存储真源</text>
  <rect x="30" y="88" width="14" height="14" rx="3" fill="#16a34a"/><text x="52" y="99" class="leg">保留 / 复用 / 扩展 · 零改动</text><rect x="250" y="88" width="14" height="14" rx="3" fill="#4f46e5"/><text x="272" y="99" class="leg">替换 / 收敛</text><rect x="380" y="88" width="14" height="14" rx="3" fill="#b45309"/><text x="402" y="99" class="leg">角色变更 / 域收窄</text><rect x="530" y="88" width="14" height="14" rx="3" fill="#64748b"/><text x="552" y="99" class="leg">让位 · 退役（待裁）</text><rect x="710" y="88" width="14" height="14" rx="3" fill="#b91c1c"/><text x="732" y="99" class="leg">红 = 痛点　绿 = 解决锚点</text>
  <line x1="30" y1="126" x2="1530" y2="126" stroke="#e2e8f0"/>
  <text x="30" y="146" class="stage">今天 · origin/master（storage schema v11，四车道各自为政）</text>
  <text x="636" y="146" class="stage">底座落地后（本提案 · 六段固定链）</text>
  <rect x="30" y="158" width="420" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="44" y="179" class="n">宿主车道 msgid 采集</text><text x="44" y="197" class="s">#5842 四载体已就位（shim/pi/opencode/codex…）</text><line x1="452" y1="184" x2="612" y2="184" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrG)"/><text x="532" y="171" class="fn" fill="#15803d" text-anchor="middle">保留·复用</text><rect x="636" y="158" width="894" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="650" y="179" class="n">第 0 段 身份入册输入（采集零改）</text><text x="650" y="197" class="s">双信道身份原样进链；新下游 l1_world 落盘 (sess_raw↔ledger_id)，跨进程/跨重启恒可答（P8/P9）</text><rect x="30" y="222" width="420" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="44" y="243" class="n">入站适配器 prepare-*</text><text x="44" y="261" class="s">{openai,anthropic,responses,google}ToCore 矩阵</text><line x1="452" y1="248" x2="612" y2="248" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrG)"/><text x="532" y="235" class="fn" fill="#15803d" text-anchor="middle">保留·复用</text><rect x="636" y="222" width="894" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="650" y="243" class="n">第 1 段 协议转换复用</text><text x="650" y="261" class="s">wire 矩阵不动；span 解析只做身份差集 NEW 元素（任意体位，含 pos 0）；散布编码字节等价钉 = P2 准入</text><rect x="30" y="286" width="420" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="44" y="307" class="n">lane-decisions 分轨</text><text x="44" y="325" class="s">请求头 session id + 会话粘滞绑定</text><line x1="452" y1="312" x2="612" y2="312" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrG)"/><text x="532" y="299" class="fn" fill="#15803d" text-anchor="middle">保留·扩展</text><rect x="636" y="286" width="894" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="650" y="307" class="n">路由矩阵 · cohort 判定成行</text><text x="650" y="325" class="s">每组合一条正负成对行（#3617 gate 双向断言）；cohort 边界（故障硬拒绝 vs 顺序>hash 降级）全进判定函数</text><rect x="30" y="350" width="420" height="52" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="44" y="371" class="n">legacy 全量重发路径</text><text x="44" y="389" class="s">今天的默认主路径（JSON.parse 全包 + 钉存 AST）</text><line x1="452" y1="376" x2="612" y2="376" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrA)"/><text x="532" y="363" class="fn" fill="#b45309" text-anchor="middle">角色变更</text><rect x="636" y="350" width="894" height="52" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="650" y="371" class="n">兜底安全网 · 整轮回落通道</text><text x="650" y="389" class="s">非 cohort 仍是主路径；cohort 会话命中 R1–R4 任一红门 ⇒ 该轮整体走它并重新盖戳，客户端一轮收敛</text><rect x="30" y="414" width="420" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="44" y="435" class="n">增量 plugin-turn 车道</text><text x="44" y="453" class="s">anthropic-wire divert · x-bili-plugin-turn 回合</text><line x1="452" y1="440" x2="612" y2="440" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrG)"/><text x="532" y="427" class="fn" fill="#15803d" text-anchor="middle">保留·原职</text><rect x="636" y="414" width="894" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="650" y="435" class="n">原职维持 · 按请求形状分轨</text><text x="650" y="453" class="s">anthropic-wire divert 回合照旧；dsh shim 逐回合与快照底座二选一，服务端不打混合标</text><rect x="30" y="478" width="420" height="52" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="44" y="499" class="n">v5 watermark 快路径</text><text x="44" y="517" class="s">5% 灰度 · fastpath-scan 结构扫描</text><line x1="452" y1="504" x2="612" y2="504" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrA)"/><text x="532" y="491" class="fn" fill="#b45309" text-anchor="middle">保留·域收窄</text><rect x="636" y="478" width="894" height="52" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="650" y="499" class="n">域收窄 · 只服务非 cohort</text><text x="650" y="517" class="s">管解析成本、不管状态真源；与快照底座同表不同车道、旗位独立，互不双处理</text><rect x="30" y="542" width="420" height="52" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="44" y="563" class="n">D-lane 快照渲染 #3756</text><text x="44" y="581" class="s">≈0% 灰度 · 正史渲染出站前缀</text><line x1="452" y1="568" x2="612" y2="568" stroke="#475569" stroke-width="1.6" marker-end="url(#arrGr)"/><text x="532" y="555" class="fn" fill="#475569" text-anchor="middle">让位·退役</text><rect x="636" y="542" width="894" height="52" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="650" y="563" class="n">让位 · 旗位互斥（待裁定 K）</text><text x="650" y="581" class="s">在新底座车道上与 snap 三件套旗位互斥运行；退役与否由 P3 依影子期数据裁定</text><text x="1516" y="563" class="warnb" text-anchor="end">⚠ 待裁定 K</text><rect x="30" y="606" width="420" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/><text x="44" y="627" class="n">acp-kernel 压缩内核</text><text x="44" y="645" class="s">projectUnit / prompts / nudge flat-50K / ref 账本</text><line x1="452" y1="632" x2="612" y2="632" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrG)"/><text x="532" y="619" class="fn" fill="#15803d" text-anchor="middle">零改动</text><rect x="636" y="606" width="894" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/><text x="650" y="627" class="n">零改动 · I/O 契约扩展为五事件流</text><text x="650" y="645" class="s">cast / append / update / delete / compact；折叠判定、四条 prompts、flat-50K nudge、id 永不复用合同一行不动</text><rect x="30" y="670" width="420" height="52" rx="8" fill="#e0e7ff" stroke="#4f46e5"/><text x="44" y="691" class="n">出站映射 coreTo*</text><text x="44" y="709" class="s">双 carrier 分支 · pf-/信封头永不出代理</text><line x1="452" y1="696" x2="612" y2="696" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrI)"/><text x="532" y="683" class="fn" fill="#4338ca" text-anchor="middle">替换</text><rect x="636" y="670" width="894" height="52" rx="8" fill="#e0e7ff" stroke="#4f46e5"/><text x="650" y="691" class="n">mapEgress + tripwire 抽样</text><text x="650" y="709" class="s">存活行按 pos 排序 ++ 本轮尾窗 [K..T) 新解析；carrier 分支逻辑照搬（#377 教训）；抽样不一致 ⇒ 立即摘回 legacy + 告警</text><rect x="30" y="734" width="420" height="52" rx="8" fill="#e0e7ff" stroke="#4f46e5"/><text x="44" y="755" class="n">状态存储：kstate JSON + 表族</text><text x="44" y="773" class="s">v11 · hydration 水合拼装（mergeState 单一事实源）</text><line x1="452" y1="760" x2="612" y2="760" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrI)"/><text x="532" y="747" class="fn" fill="#4338ca" text-anchor="middle">收敛</text><rect x="636" y="734" width="894" height="52" rx="8" fill="#e0e7ff" stroke="#4f46e5"/><text x="650" y="755" class="n">单一存储真源 · 三件套 + L1</text><text x="650" y="773" class="s">snap_rows/snap_log/snap_ckpt 单事务提交（不变量 i–v）；kstate 降为红道回退源，绿道读三件套</text>
  <line x1="30" y1="822" x2="1530" y2="822" stroke="#e2e8f0"/>
  <text x="30" y="840" class="stage">三个结构性痛点 → 一一对应的解决锚点</text>
  <rect x="30" y="846" width="530" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="44" y="864" class="warn">痛点① 状态三处住</text><text x="44" y="882" class="warnb">进程内存 + 表 + kstate 双写分叉；#5403 OOM 钉存来源</text><line x1="562" y1="868" x2="622" y2="868" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arrR)"/><rect x="636" y="846" width="894" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="650" y="864" class="ok">解决：ckpt.meta_json 单一真源（F 裁定）</text><text x="650" y="882" class="okb">内存降为缓存；绿道读三件套 / 红道随时承接 kstate 旧路，切换按会话单向、失步整轮回退</text><rect x="30" y="902" width="530" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="44" y="920" class="warn">痛点② 宿主身份不落盘</text><text x="44" y="938" class="warnb">(sess_raw,msgid) ingest 即剥，只在 in-flight 信封活一轮</text><line x1="562" y1="924" x2="622" y2="924" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arrR)"/><rect x="636" y="902" width="894" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="650" y="920" class="ok">解决：L1 身份薄表持久化（G 裁定）</text><text x="650" y="938" class="okb">复用 #5842 载体采集器；首见即记、永不截断删除（P8/P9）；裁决三分支 echo 抽验 / 复合探测 / 发放新身份</text><rect x="30" y="958" width="530" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="44" y="976" class="warn">痛点③ 快路径各自打补丁</text><text x="44" y="994" class="warnb">v5/增量/D-lane 各管一段流量，缓存稳定性靠补丁叠加</text><line x1="562" y1="980" x2="622" y2="980" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arrR)"/><rect x="636" y="958" width="894" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="650" y="976" class="ok">解决：单事务提交原语 + 四件套保护</text><text x="650" y="994" class="okb">三步原子：upsert rows → append log(seq 严格单调) → compact 可选；tripwire / S4 校验和 / 见证要求 / 审计抽验</text>
</svg>