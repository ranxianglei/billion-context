  <text x="30" y="1052" class="s">基线不变量：P5 禁全量重解析(合法入口恰两个) · P6 持久不重建(重启只水合，无武装轮) · P8 (sess_raw,ledger_id) 首见即记、永不删改 · P9 身份层原值禁截断(sig/fingerprint 只进诊断流) · tripwire/S4/见证/审计抽验四件套保护。</text>
  <text x="30" y="1072" class="s">目标函数排序：稳定性 / 扩展性 / 通用性优先，性能是副产品 —— 先问流转对不对，不问快不快。</text>
