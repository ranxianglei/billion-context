<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760">
<style>text{font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif;}.tt{font-size:24px;font-weight:700;fill:#0f172a;}.sub{font-size:13px;fill:#475569;}.h{font-size:14px;font-weight:700;fill:#0f172a;}.b{font-size:12px;fill:#334155;}.s{font-size:11px;fill:#64748b;}.leg{font-size:11.5px;fill:#475569;}.warn{font-size:12px;fill:#b91c1c;}.num{font-size:11px;font-weight:700;fill:#fff;}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
<marker id="argr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker></defs>
<rect width="1240" height="760" fill="#ffffff"/><rect x="40" y="110" width="270" height="250" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="360" y="110" width="270" height="250" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="680" y="110" width="270" height="250" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="990" y="110" width="210" height="250" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="40" y="420" width="1160" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="314" y1="235" x2="356" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="634" y1="235" x2="676" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="954" y1="235" x2="986" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">模块：会话与消息身份</text><text x="40" y="70" class="sub">请求属于哪个会话、哪些消息是新的、什么身份能穿过 wire</text><text x="54" y="136" class="h">会话身份</text><text x="54" y="156" class="b">客户端 id 逐字（优先原生稳定</text><text x="54" y="173.5" class="b">id，#280）</text><text x="54" y="191" class="b">匿名 → 前缀亲和 pfa-*</text><text x="54" y="208.5" class="b">（首写者出处 #2879）</text><text x="54" y="226" class="b">persona 分叉：subagentNamespace(id,</text><text x="54" y="243.5" class="b">system) —— 证据白名单（dsh</text><text x="54" y="261" class="b">#1104/#2156），首个 system 锚定</text><text x="54" y="278.5" class="b">原始键，side 请求永不锚定</text><text x="374" y="136" class="h">消息身份</text><text x="374" y="156" class="b">层级：msgid &gt; 顺序 &gt; hash (#11)</text><text x="374" y="173.5" class="b">msgid = 宿主信封、逐元素、入站</text><text x="374" y="191" class="b">即剥 —— 永不出现在模型线</text><text x="374" y="208.5" class="b">（#4491/#4834/#5842）</text><text x="374" y="226" class="b">账本键：(session_id, msg_id,</text><text x="374" y="243.5" class="b">content_hash) —— id 定身份、</text><text x="374" y="261" class="b">hash 是安全带</text><text x="374" y="278.5" class="b">顺序 = legacy 全量重发的主载体</text><text x="374" y="296" class="b">（reconcile 阶梯）</text><text x="694" y="136" class="h">服务端渲染</text><text x="694" y="156" class="b">D-lane 快照渲染(#3756)：出站</text><text x="694" y="173.5" class="b">前缀由服务端正史渲染、行 seq =</text><text x="694" y="191" class="b">消息身份、尾巴保持客户端逐字</text><text x="694" y="208.5" class="b">（缓存稳定）</text><text x="694" y="226" class="b">任何失步 → 整轮回退 legacy</text><text x="694" y="243.5" class="b">（降级不猜）</text><text x="694" y="261" class="b">reconcileFoldCoverage 继续观察</text><text x="694" y="278.5" class="b">客户端视图（观测 ≠ 渲染）</text><text x="1004" y="136" class="h">文档</text><text x="1004" y="156" class="b">message-identity.md</text><text x="1004" y="173.5" class="b">session-identity.md</text><text x="1004" y="191" class="b">identity-channels.md</text><text x="1004" y="208.5" class="b">msgid-infrastructure.md</text><text x="1004" y="226" class="b">session-identity-</text><text x="1004" y="243.5" class="b">resolution.md</text><text x="58" y="448" class="s">身份维度抗不同的抖动：顺序抗重编码且抗 id 重铸、内容抗 id 抖动、id 抗重编码 —— reconcile 阶梯是它们存活域的并集，每一档都软失败。</text><text x="58" y="474" class="s">P8（底座提案 #5643）：(sess_raw, ledger_id) 首见即写入、永不删改、跨重启恒可答 —— 计划落 l1_world 表。</text>
<g>
<text x="40" y="529" class="h">DSH 种子会话继承：验证路径统一，会话归属分立</text>
<rect x="40" y="545" width="340" height="155" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="54" y="569" class="h">宿主入口 + 子会话实际历史</text>
<text x="54" y="593" class="b">普通 fork / 侧聊 / 继承上下文子代理</text>
<text x="54" y="613" class="b">isSeeded + 经过校验的继承来源</text>
<text x="54" y="633" class="b">有序原始身份 + 不透明载荷</text>
<text x="54" y="653" class="b">工具调用和结果两端共同证明配对</text>
<text x="54" y="679" class="s">没有继承上下文的全新子会话不采纳</text>
<line x1="389" y1="620" x2="439" y2="620" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="450" y="545" width="330" height="155" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="464" y="569" class="h">核验父原文与完整块闭包</text>
<text x="464" y="593" class="b">载荷、工具归属与双向 ref 精确相符</text>
<text x="464" y="613" class="b">逻辑顺序以父会话快照为准</text>
<text x="464" y="633" class="b">仅特许省略边界内已证明的思考消息</text>
<text x="464" y="653" class="b">复制完整块及嵌套原文</text>
<text x="464" y="679" class="s">不拿父会话最新尾部替代子会话证据</text>
<line x1="789" y1="620" x2="839" y2="620" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="850" y="545" width="350" height="155" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="864" y="569" class="h">每轮出站与冷恢复继续核验</text>
<text x="864" y="593" class="b">保留子会话新增内容和有效继承块</text>
<text x="864" y="613" class="b">正文 / 顺序 / ref / 工具归属漂移时：</text>
<text x="864" y="633" class="b">先移除受影响块和消费它们的祖先块</text>
<text x="864" y="653" class="b">持久化实际原始视图，再渲染出站</text>
<text x="864" y="679" class="s">已发出的 ref 永久保留，不重用身份</text>
<text x="40" y="730" class="s">事件边界、首次入库行 seq 与消息逻辑顺序不是同一坐标。未启用扩展的调用者保持原供应商前缀协议。</text>
</g>
</svg>