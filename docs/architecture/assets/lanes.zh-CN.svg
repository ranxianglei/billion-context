<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
<style>text{font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif;}.tt{font-size:24px;font-weight:700;fill:#0f172a;}.sub{font-size:13px;fill:#475569;}.h{font-size:14px;font-weight:700;fill:#0f172a;}.b{font-size:12px;fill:#334155;}.s{font-size:11px;fill:#64748b;}.leg{font-size:11.5px;fill:#475569;}.warn{font-size:12px;fill:#b91c1c;}.num{font-size:11px;font-weight:700;fill:#fff;}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
<marker id="argr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker></defs>
<rect width="1240" height="560" fill="#ffffff"/><rect x="40" y="110" width="250" height="300" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="350" y="110" width="250" height="300" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="660" y="110" width="250" height="300" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="970" y="110" width="230" height="300" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="40" y="420" width="1160" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="294" y1="260" x2="346" y2="260" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="604" y1="260" x2="656" y2="260" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="914" y1="260" x2="966" y2="260" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">模块：宿主车道（src/agent + src/server/lane-decisions）</text><text x="40" y="70" class="sub">谁把请求带进来、如何归因、走哪条处理车道</text><text x="54" y="136" class="h">宿主插件（按宿主）</text><text x="54" y="156" class="b">dsh shim（anthropic divert）</text><text x="54" y="173.5" class="b">pi entry-walker（+ omp 复用）</text><text x="54" y="191" class="b">opencode V1/V2 transform 钩子</text><text x="54" y="208.5" class="b">codex Responses-over-WebSocket</text><text x="54" y="226" class="b">claude hook（lane token #5095）</text><text x="54" y="243.5" class="b">kimi / zcode 原生 TOML 车道</text><text x="54" y="261" class="b">每个都有 -native 启动闸门</text><text x="54" y="278.5" class="b">+ native-intercept fetch 路由</text><text x="364" y="136" class="h">身份与归因</text><text x="364" y="156" class="b">session id：请求头、逐字</text><text x="364" y="173.5" class="b">逐元素宿主 msgid：只在信封、</text><text x="364" y="191" class="b">入站即剥（#4491/#5842）</text><text x="364" y="208.5" class="b">persona 指纹（dsh，证据白名单</text><text x="364" y="226" class="b">#1104）→ |sub:&lt;fp&gt; 分叉</text><text x="364" y="243.5" class="b">归因报告 → 面板(#3581)</text><text x="364" y="261" class="b">匿名：前缀亲和 pfa-*</text><text x="364" y="278.5" class="b">(simhash 链 #2265)</text><text x="674" y="136" class="h">lane-decisions.ts</text><text x="674" y="156" class="b">单一裁决器(#3417)</text><text x="674" y="173.5" class="b">请求形状 × 会话粘滞绑定</text><text x="674" y="191" class="b">+ 一行：底座车道命中</text><text x="674" y="208.5" class="b">（正负成对断言 #3617）</text><text x="674" y="226" class="b">逐请求决定：增量 / v5 / D-lane</text><text x="674" y="243.5" class="b">/ legacy</text><text x="984" y="136" class="h">处理车道</text><text x="984" y="156" class="b">增量 plugin-turn 车道</text><text x="984" y="173.5" class="b">（anthropic wire divert）</text><text x="984" y="191" class="b">v5 watermark 快路径(5%灰度)</text><text x="984" y="208.5" class="b">D-lane 快照渲染(#3756)</text><text x="984" y="226" class="b">legacy 全量重发路径</text><text x="984" y="243.5" class="b">（默认 + 兜底安全网）</text><text x="58" y="448" class="s">一个请求 = 一条车道：逐请求裁决、逐会话粘滞（只升不降）。各车道共享内核与存储，差别只在跳过多少 wire 工作。</text><text x="58" y="474" class="s">两种接入姿态：bili &lt;client&gt; 启动器（launcher.ts，自动代理双协议）；插件姿态：宿主进程内加载 dist/agent/&lt;entry&gt;.js（pi 默认内联，#5428）。</text></svg>