<rect width="1240" height="720" fill="#ffffff"/><rect x="40" y="110" width="220" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="310" y="110" width="220" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="580" y="110" width="220" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><rect x="850" y="110" width="220" height="150" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="1120" y="110" width="90" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="40" y="330" width="360" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><rect x="440" y="330" width="360" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><rect x="840" y="330" width="360" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><rect x="40" y="585" width="1160" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="264" y1="185" x2="306" y2="185" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="534" y1="185" x2="576" y2="185" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="804" y1="185" x2="846" y2="185" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="1074" y1="185" x2="1116" y2="185" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">Module: request pipeline (src/server + src/loop)</text><text x="40" y="70" class="sub">one HTTP request, from inbound bytes to outbound stream — every wire, both compression modes</text><text x="54" y="136" class="h">Inbound</text><text x="54" y="156" class="b">client bytes</text><text x="54" y="173.5" class="b">marker strip (src/marker/):</text><text x="54" y="191" class="b">ordered pipeline, 4 wires</text><text x="54" y="208.5" class="b">route triage: /__bili/* vs model API</text><text x="324" y="136" class="h">prepare-* (per-wire)</text><text x="324" y="156" class="b">anthropic / openai /</text><text x="324" y="173.5" class="b">responses / google</text><text x="324" y="191" class="b">fold → rebuild → inject</text><text x="324" y="208.5" class="b">system + nudge placement</text><text x="594" y="136" class="h">acp-kernel</text><text x="594" y="156" class="b">(zero changes)</text><text x="594" y="173.5" class="b">fold decision projectUnit</text><text x="594" y="191" class="b">blocks / refs / dead_refs</text><text x="594" y="208.5" class="b">summary + nudge flat 50K</text><text x="864" y="136" class="h">src/loop (unified)</text><text x="864" y="156" class="b">protocol-neutral core</text><text x="864" y="173.5" class="b">4 wire adapters</text><text x="864" y="191" class="b">tool adjudication</text><text x="864" y="208.5" class="b">tag-echo-filter: prose only,</text><text x="864" y="226" class="b">tool args byte-exact</text><text x="1134" y="136" class="h">upstream</text><text x="1134" y="156" class="b"></text><text x="54" y="356" class="h">Preflight &amp; gates</text><text x="54" y="376" class="b">preflight.ts: hold grace, dead-end cooldown</text><text x="54" y="393.5" class="b">reasoning-guard: signed payloads never folded</text><text x="54" y="411" class="b">request-body-budget: receive/decode/send byte caps</text><text x="54" y="428.5" class="b">content-encoding: decompression-bomb guard (413)</text><text x="454" y="356" class="h">Error &amp; recovery</text><text x="454" y="376" class="b">stream-error: minimal SSE error+finish</text><text x="454" y="393.5" class="b">fake-completion: opt-in retry hint</text><text x="454" y="411" class="b">degenerate-turn / degenerate-retry</text><text x="454" y="428.5" class="b">exit-matrix: wire-exit × concerns (#588)</text><text x="854" y="356" class="h">Egress rewrite (stream-*)</text><text x="854" y="376" class="b">SSE per-wire (openai/responses/google)</text><text x="854" y="393.5" class="b">cache-control breakpoints (#1637)</text><text x="854" y="411" class="b">pf-*/envelope headers never leave (hop list)</text><text x="854" y="428.5" class="b">wire-body: trailing-user-turn append</text><text x="58" y="613" class="s">Two compression modes run through the SAME pipeline (KDD #7): plugin lane — agent owns compress, carrier is the tool call; proxy mode — proxy runs compress, carrier is the acp_summary re-voiced as user.</text><text x="58" y="639" class="s">Hard rule: thinking-family blocks are signature-verified, NEVER rewritten (#1960); tool-call arguments are user intent, forwarded byte-exact (#1039).</text></svg>