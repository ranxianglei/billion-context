<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
<style>text{font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif;}.tt{font-size:24px;font-weight:700;fill:#0f172a;}.sub{font-size:13px;fill:#475569;}.h{font-size:14px;font-weight:700;fill:#0f172a;}.b{font-size:12px;fill:#334155;}.s{font-size:11px;fill:#64748b;}.leg{font-size:11.5px;fill:#475569;}.warn{font-size:12px;fill:#b91c1c;}.num{font-size:11px;font-weight:700;fill:#fff;}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
<marker id="argr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker></defs>
<rect width="1240" height="560" fill="#ffffff"/><rect x="40" y="110" width="250" height="230" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="350" y="110" width="250" height="230" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="660" y="110" width="250" height="230" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="970" y="110" width="230" height="230" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="40" y="420" width="1160" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="294" y1="225" x2="346" y2="225" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="604" y1="225" x2="656" y2="225" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="914" y1="225" x2="966" y2="225" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">模块：Web 面板与 admin 面（src/web + src/server/admin.ts）</text><text x="40" y="70" class="sub">人这一侧：能看到什么、数据从哪来、通告管线怎么走</text><text x="54" y="136" class="h">admin 路由</text><text x="54" y="156" class="b">/__bili/* + /__acp/*（admin.ts）</text><text x="54" y="173.5" class="b">loopback + 受信源门控(#1440)</text><text x="54" y="191" class="b">status / overview / sessions /</text><text x="54" y="208.5" class="b">detail / logs / config / plugin /</text><text x="54" y="226" class="b">watcher / upstream</text><text x="54" y="243.5" class="b">/__bili/status 的 attribution 字段</text><text x="54" y="261" class="b">暴露注入坏状态(#3581)</text><text x="364" y="136" class="h">数据源</text><text x="364" y="156" class="b">会话池（活）+ 存储行（sessions-</text><text x="364" y="173.5" class="b">data，层树 #3917）</text><text x="364" y="191" class="b">acp_status：ranges/nudge 每次渲染</text><text x="364" y="208.5" class="b">现算（acp-status.ts）</text><text x="364" y="226" class="b">缓存账本（cache-ledger.ts，#1536）</text><text x="364" y="243.5" class="b">计费：USD 价格、回本视图(#4899)</text><text x="364" y="261" class="b">通告存储（kv_store namespace）</text><text x="674" y="136" class="h">渲染</text><text x="674" y="156" class="b">服务端渲染 HTML 壳（page.ts）</text><text x="674" y="173.5" class="b">client.ts JS 包 + styles.ts</text><text x="674" y="191" class="b">i18n.ts：zh-CN/en 文案表（死键</text><text x="674" y="208.5" class="b">有测试守卫）</text><text x="674" y="226" class="b">markdown.ts 转义安全</text><text x="674" y="243.5" class="b">report.ts：零依赖 MD+SVG 会话</text><text x="674" y="261" class="b">报告</text><text x="674" y="278.5" class="b">diagnostics.ts：可粘贴诊断块(#3040)</text><text x="984" y="136" class="h">通告（单一通道）</text><text x="984" y="156" class="b">mergedNotices()：一个循环</text><text x="984" y="173.5" class="b">S 内置 / A 远端 feed（本仓</text><text x="984" y="191" class="b">announcements/remote.json，~3 分钟</text><text x="984" y="208.5" class="b">轮询、fail-open）/ B 本地文件；</text><text x="984" y="226" class="b">同 id 影子 B&gt;A&gt;S (#5548)</text><text x="984" y="243.5" class="b">关闭回执在统一存储（kv_store</text><text x="984" y="261" class="b">namespace notices）</text><text x="58" y="448" class="s">面板不说谎：空块会话不导「原始对话」、存储降级要可见（runtime-status）、每行数据都能指回存储模块这个唯一真源。</text><text x="58" y="474" class="s">更新动作也在面板里（update-actions.ts #3719）叠在自更新器之上 —— 机制归 update 模块、界面归本模块。</text></svg>