<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
<style>text{font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif;}.tt{font-size:24px;font-weight:700;fill:#0f172a;}.sub{font-size:13px;fill:#475569;}.h{font-size:14px;font-weight:700;fill:#0f172a;}.b{font-size:12px;fill:#334155;}.s{font-size:11px;fill:#64748b;}.leg{font-size:11.5px;fill:#475569;}.warn{font-size:12px;fill:#b91c1c;}.num{font-size:11px;font-weight:700;fill:#fff;}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
<marker id="argr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker></defs>
<rect width="1240" height="560" fill="#ffffff"/><rect x="40" y="110" width="250" height="230" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="350" y="110" width="250" height="230" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="660" y="110" width="250" height="230" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="970" y="110" width="230" height="230" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="40" y="420" width="1160" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="294" y1="225" x2="346" y2="225" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="604" y1="225" x2="656" y2="225" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="914" y1="225" x2="966" y2="225" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">Module: web panel &amp; admin surface (src/web + src/server/admin.ts)</text><text x="40" y="70" class="sub">the human-facing side: what you can see, where the data comes from, and the notice pipeline</text><text x="54" y="136" class="h">Admin routes</text><text x="54" y="156" class="b">/__bili/* + /__acp/* (admin.ts)</text><text x="54" y="173.5" class="b">loopback + trusted-origin gated</text><text x="54" y="191" class="b">(#1440)</text><text x="54" y="208.5" class="b">status / overview / sessions /</text><text x="54" y="226" class="b">detail / logs / config / plugin /</text><text x="54" y="243.5" class="b">watcher / upstream</text><text x="54" y="261" class="b">/__bili/status attribution field</text><text x="54" y="278.5" class="b">shows broken-injection state (#3581)</text><text x="364" y="136" class="h">Data sources</text><text x="364" y="156" class="b">session pool (live) + storage rows</text><text x="364" y="173.5" class="b">(sessions-data, tier tree #3917)</text><text x="364" y="191" class="b">acp_status: ranges/nudge recomputed</text><text x="364" y="208.5" class="b">LIVE per render (acp-status.ts)</text><text x="364" y="226" class="b">cache ledger (cache-ledger.ts, #1536)</text><text x="364" y="243.5" class="b">billing: USD prices, payback view</text><text x="364" y="261" class="b">(#4899)</text><text x="364" y="278.5" class="b">notice store (kv_store namespace)</text><text x="674" y="136" class="h">Render</text><text x="674" y="156" class="b">server-rendered HTML shell (page.ts)</text><text x="674" y="173.5" class="b">client.ts JS bundle + styles.ts</text><text x="674" y="191" class="b">i18n.ts: zh-CN/en message tables</text><text x="674" y="208.5" class="b">(dead-key guarded by test)</text><text x="674" y="226" class="b">markdown.ts escape-safe</text><text x="674" y="243.5" class="b">report.ts: dependency-free MD+SVG</text><text x="674" y="261" class="b">session reports</text><text x="674" y="278.5" class="b">diagnostics.ts: paste-ready blob</text><text x="674" y="296" class="b">(#3040)</text><text x="984" y="136" class="h">Notices (one channel)</text><text x="984" y="156" class="b">mergedNotices(): one loop</text><text x="984" y="173.5" class="b">S builtin / A remote feed (this</text><text x="984" y="191" class="b">repo announcements/remote.json,</text><text x="984" y="208.5" class="b">~3-min poll, fail-open) / B local</text><text x="984" y="226" class="b">files; equal ids shadow B&gt;A&gt;S</text><text x="984" y="243.5" class="b">(#5548)</text><text x="984" y="261" class="b">dismiss receipts in unified storage</text><text x="984" y="278.5" class="b">(kv_store namespace notices)</text><text x="58" y="448" class="s">The panel never lies: empty-block sessions export nothing, storage degradation is surfaced (runtime-status), and every data row links back to the storage module as the single source of truth.</text><text x="58" y="474" class="s">Update actions live in the panel too (update-actions.ts #3719) over the self-updater — the update module owns the mechanics, this module owns the surface.</text></svg>