<rect width="1240" height="720" fill="#ffffff"/><rect x="40" y="100" width="240" height="260" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="340" y="100" width="240" height="260" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="640" y="100" width="290" height="260" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><rect x="980" y="100" width="220" height="260" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="40" y="420" width="560" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><rect x="640" y="420" width="560" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><rect x="40" y="585" width="1160" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="284" y1="230" x2="336" y2="230" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="584" y1="230" x2="636" y2="230" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="934" y1="230" x2="976" y2="230" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">模块：快路径（增量车道 / v5 水位 / D-lane / legacy）</text><text x="40" y="70" class="sub">插件全量重发回合跳过重复 wire 工作的四条路 —— 一个请求恒走其中一条</text><text x="54" y="126" class="h">插件全量重发回合</text><text x="54" y="146" class="b">宿主每轮重发完整历史</text><text x="54" y="163.5" class="b">+ 盖章头（x-bili-pf-seq /</text><text x="54" y="181" class="b">-count / -tail-ids，#5403/#4491）</text><text x="54" y="198.5" class="b">+ plugin-turn 信封（x-bili-</text><text x="54" y="216" class="b">plugin-turn，#3248）</text><text x="54" y="233.5" class="b">形状门：anthropic wire → 增量</text><text x="54" y="251" class="b">divert；openai 形 → 水位车道</text><text x="54" y="268.5" class="b">(#3433)</text><text x="354" y="126" class="h">lane-decisions</text><text x="354" y="146" class="b">单一裁决器、逐请求</text><text x="354" y="163.5" class="b">逐会话粘滞（只升不降）</text><text x="354" y="181" class="b">行 = 真值表驱动</text><text x="354" y="198.5" class="b">(tests/lane-decisions-matrix.</text><text x="354" y="216" class="b">test.ts，正负成对 #3617)</text><text x="654" y="126" class="h">三条快车道</text><text x="654" y="146" class="b">① 增量 plugin-turn 车道：diff +</text><text x="654" y="163.5" class="b">  ack + resync（宿主 msgid）</text><text x="654" y="181" class="b">② v5 水位：结构扫描（零解码）、</text><text x="654" y="198.5" class="b">  盖戳-验证阶梯、5 次可证 miss ⇒</text><text x="654" y="216" class="b">  1h 熔断</text><text x="654" y="233.5" class="b">③ D-lane 快照渲染：出站前缀由</text><text x="654" y="251" class="b">  服务端正史渲染(#3756)</text><text x="654" y="268.5" class="b">任何疑点 ⇒ 整轮回 legacy</text><text x="994" y="126" class="h">legacy 全量重发</text><text x="994" y="146" class="b">原封未动的全量解析路径</text><text x="994" y="163.5" class="b">所有形状的默认</text><text x="994" y="181" class="b">兜底安全网</text><text x="994" y="198.5" class="b">重盖真值头让客户端一轮</text><text x="994" y="216" class="b">收敛（#5403：OOM 生产者</text><text x="994" y="233.5" class="b">只从命中回合上移除）</text><text x="54" y="446" class="h">命中时跳过的活</text><text x="54" y="466" class="b">整包 JSON.parse + openaiToCore 全量转换（v5）</text><text x="54" y="483.5" class="b">snapshotMessages 前缀重钉（v5）</text><text x="54" y="501" class="b">增量：只解析差量；D-lane：前缀按行重渲</text><text x="654" y="446" class="h">诚实边界</text><text x="654" y="466" class="b">保元素数的前缀字节改写不可检测（人工评审级）</text><text x="654" y="483.5" class="b">多模态尾部入缓存 ⇒ 该段历史留在 legacy（KDD #15）</text><text x="654" y="501" class="b">pf-* 是协议头：出代理前剥掉</text><text x="58" y="613" class="s">#5643 演进：四条车道最终收敛到快照表底座（单一存储真源）；在那之前各车道各记各的账 —— 这份账目 sprawl 正是底座要消除的东西。</text></svg>