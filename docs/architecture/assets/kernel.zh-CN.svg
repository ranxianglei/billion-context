<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
<style>text{font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif;}.tt{font-size:24px;font-weight:700;fill:#0f172a;}.sub{font-size:13px;fill:#475569;}.h{font-size:14px;font-weight:700;fill:#0f172a;}.b{font-size:12px;fill:#334155;}.s{font-size:11px;fill:#64748b;}.leg{font-size:11.5px;fill:#475569;}.warn{font-size:12px;fill:#b91c1c;}.num{font-size:11px;font-weight:700;fill:#fff;}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
<marker id="argr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker></defs>
<rect width="1240" height="560" fill="#ffffff"/><rect x="40" y="110" width="250" height="220" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="350" y="110" width="250" height="220" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="660" y="110" width="250" height="220" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><rect x="970" y="110" width="230" height="220" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="40" y="420" width="1160" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="294" y1="220" x2="346" y2="220" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="604" y1="220" x2="656" y2="220" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="914" y1="220" x2="966" y2="220" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">模块：压缩内核（kernel/ — acp-kernel，仓内）</text><text x="40" y="70" class="sub">决策核：什么能折、折叠产出什么、状态如何跨重启存活</text><text x="54" y="136" class="h">输入</text><text x="54" y="156" class="b">canonical cores（宿主无关）</text><text x="54" y="173.5" class="b">CompressionState：blocks / refs /</text><text x="54" y="191" class="b">dead_refs / checkpoints / nudge /</text><text x="54" y="208.5" class="b">tokenSnapshot</text><text x="54" y="226" class="b">applyView = applyCompression</text><text x="54" y="243.5" class="b">实际执行的那个数组类(KDD #12)</text><text x="364" y="136" class="h">单元投影</text><text x="364" y="156" class="b">projectUnit —— 唯一的可折叠定义</text><text x="364" y="173.5" class="b">(KDD #12, #3236)：边界扩张 →</text><text x="364" y="191" class="b">载体/覆盖/媒体剥离 → 保护区剥离</text><text x="364" y="208.5" class="b">→ turn-integrity → 空判定</text><text x="364" y="226" class="b">致命单元 → 结构化错误</text><text x="364" y="243.5" class="b">与 apply 侧逐字节一致</text><text x="674" y="136" class="h">判定与产出</text><text x="674" y="156" class="b">fold / archive / dead-refs</text><text x="674" y="173.5" class="b">摘要文本（4 条承重提示规则、</text><text x="674" y="191" class="b">金钉锁定）</text><text x="674" y="208.5" class="b">ref 编号 mNNNNN —— 永不复用</text><text x="674" y="226" class="b">（内核契约）</text><text x="674" y="243.5" class="b">nudge：flat 50K 增长节拍</text><text x="674" y="261" class="b">(#379/#380，不按百分比缩放)</text><text x="984" y="136" class="h">状态输出</text><text x="984" y="156" class="b">新/更新块 + refs</text><text x="984" y="173.5" class="b">checkpoint 帧（签名）</text><text x="984" y="191" class="b">tokenSnapshot + stats</text><text x="984" y="208.5" class="b">宿主经 mergeState 字段清单</text><text x="984" y="226" class="b">（单一事实源）序列化</text><text x="58" y="448" class="s">硬不变量（人工闸口，Kernel Boundary）：零运行时依赖；平台无关核心；消息 id 不可变；无损往返；受保护工具硬排除；规范节点顺序。</text><text x="58" y="474" class="s">守卫：金钉（行为常数）+ 两层测试（kernel 套件 + bili e2e）+ verif/ 对决策核的 SMT 求解器检查（guarded-files.ts）。</text></svg>