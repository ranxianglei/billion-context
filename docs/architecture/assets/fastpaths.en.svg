<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720">
<style>text{font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif;}.tt{font-size:24px;font-weight:700;fill:#0f172a;}.sub{font-size:13px;fill:#475569;}.h{font-size:14px;font-weight:700;fill:#0f172a;}.b{font-size:12px;fill:#334155;}.s{font-size:11px;fill:#64748b;}.leg{font-size:11.5px;fill:#475569;}.warn{font-size:12px;fill:#b91c1c;}.num{font-size:11px;font-weight:700;fill:#fff;}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
<marker id="argr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker></defs>
<rect width="1240" height="720" fill="#ffffff"/><rect x="40" y="100" width="240" height="260" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="340" y="100" width="240" height="260" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="640" y="100" width="290" height="260" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><rect x="980" y="100" width="220" height="260" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="40" y="420" width="560" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><rect x="640" y="420" width="560" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><rect x="40" y="585" width="1160" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="284" y1="230" x2="336" y2="230" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="584" y1="230" x2="636" y2="230" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="934" y1="230" x2="976" y2="230" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">Module: fastpaths (incremental lane / v5 watermark / D-lane / legacy)</text><text x="40" y="70" class="sub">four ways to skip re-doing wire work on plugin full-resend turns — one request always takes exactly one</text><text x="54" y="126" class="h">Plugin full-resend turn</text><text x="54" y="146" class="b">host re-sends full history each turn</text><text x="54" y="163.5" class="b">+ stamped headers (x-bili-pf-seq /</text><text x="54" y="181" class="b">-count / -tail-ids, #5403/#4491)</text><text x="54" y="198.5" class="b">+ plugin-turn envelope (x-bili-</text><text x="54" y="216" class="b">plugin-turn, #3248)</text><text x="54" y="233.5" class="b">shape gate: anthropic wire →</text><text x="54" y="251" class="b">incremental divert; openai shape →</text><text x="54" y="268.5" class="b">watermark lane (#3433)</text><text x="354" y="126" class="h">lane-decisions</text><text x="354" y="146" class="b">single resolver, per request</text><text x="354" y="163.5" class="b">sticky per session (upgrade-only)</text><text x="354" y="181" class="b">rows = truth-table driven</text><text x="354" y="198.5" class="b">(tests/lane-decisions-matrix.test.ts,</text><text x="354" y="216" class="b">positive+negative pairs #3617)</text><text x="654" y="126" class="h">The three fast lanes</text><text x="654" y="146" class="b">① incremental plugin-turn lane:</text><text x="654" y="163.5" class="b">  diff + ack + resync (host msgids)</text><text x="654" y="181" class="b">② v5 watermark: structural scan</text><text x="654" y="198.5" class="b">  (zero-decode), stamp-verify ladder,</text><text x="654" y="216" class="b">  5 proven-miss ⇒ 1h breaker</text><text x="654" y="233.5" class="b">③ D-lane snapshot render: outbound</text><text x="654" y="251" class="b">  prefix from server transcript (#3756)</text><text x="654" y="268.5" class="b">any doubt ⇒ whole turn back to legacy</text><text x="994" y="126" class="h">legacy full-resend</text><text x="994" y="146" class="b">untouched full-parse path</text><text x="994" y="163.5" class="b">default for every shape</text><text x="994" y="181" class="b">the fallback safety net</text><text x="994" y="198.5" class="b">re-stamps truth headers so the</text><text x="994" y="216" class="b">client converges in one turn</text><text x="994" y="233.5" class="b">(#5403: OOM producer removed</text><text x="994" y="251" class="b">from hit turns only)</text><text x="54" y="446" class="h">What a hit skips</text><text x="54" y="466" class="b">full JSON.parse + openaiToCore over the whole body (v5)</text><text x="54" y="483.5" class="b">snapshotMessages re-pin of the prefix (v5)</text><text x="54" y="501" class="b">incremental: only the delta is parsed; D-lane: prefix re-rendered from rows</text><text x="654" y="446" class="h">Honest boundaries</text><text x="654" y="466" class="b">byte-rewrites that keep element count are undetectable (human review tier)</text><text x="654" y="483.5" class="b">multimodal tails in cache ⇒ that history stays legacy (KDD #15)</text><text x="654" y="501" class="b">pf-* headers are protocol headers: stripped before upstream</text><text x="58" y="613" class="s">#5643 evolution: all four lanes converge onto the snapshot table foundation (one storage source of truth); until then each lane keeps its own bookkeeping — that bookkeeping sprawl is exactly what the foundation removes.</text></svg>