<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
<style>text{font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif;}.tt{font-size:24px;font-weight:700;fill:#0f172a;}.sub{font-size:13px;fill:#475569;}.h{font-size:14px;font-weight:700;fill:#0f172a;}.b{font-size:12px;fill:#334155;}.s{font-size:11px;fill:#64748b;}.leg{font-size:11.5px;fill:#475569;}.warn{font-size:12px;fill:#b91c1c;}.num{font-size:11px;font-weight:700;fill:#fff;}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
<marker id="argr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker></defs>
<rect width="1240" height="560" fill="#ffffff"/><rect x="40" y="110" width="260" height="250" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="360" y="110" width="260" height="250" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="680" y="110" width="260" height="250" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="990" y="110" width="210" height="250" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="40" y="420" width="1160" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="304" y1="235" x2="356" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="624" y1="235" x2="676" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="944" y1="235" x2="986" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">Module: self-update &amp; install lanes (src/update.ts + lane modules)</text><text x="40" y="70" class="sub">how a copy of bili gets to the newest version without bricking anything</text><text x="54" y="136" class="h">Self-updater (update.ts)</text><text x="54" y="156" class="b">npm registry check, 3-min cadence</text><text x="54" y="173.5" class="b">(knob-overridable #2030); first</text><text x="54" y="191" class="b">check per process ignores throttle</text><text x="54" y="208.5" class="b">tarball extraction, NOT npm install</text><text x="54" y="226" class="b">(no lifecycle scripts on user boxes)</text><text x="54" y="243.5" class="b">in-place swap for the global install</text><text x="54" y="261" class="b">load-bearing: a broken updater bricks</text><text x="54" y="278.5" class="b">every future upgrade → NO-OP release</text><text x="54" y="296" class="b">validation protocol before any change</text><text x="374" y="136" class="h">Install lanes (#991/#1196)</text><text x="374" y="156" class="b">one writer per copy, chosen by</text><text x="374" y="173.5" class="b">install SOURCE</text><text x="374" y="191" class="b">global (npm -g): self-updates in</text><text x="374" y="208.5" class="b">place</text><text x="374" y="226" class="b">reference lanes (omp/claude/codex/</text><text x="374" y="243.5" class="b">kimi/zcode/hermes): point at global</text><text x="374" y="261" class="b">dist, no copy</text><text x="374" y="278.5" class="b">host worlds (dsh bundle, opencode/</text><text x="374" y="296" class="b">pi tree): updated through the HOST's</text><text x="374" y="313.5" class="b">channel, driven by global self-update</text><text x="374" y="331" class="b">+ the copy's own periodic check</text><text x="694" y="136" class="h">Ledger convergence</text><text x="694" y="156" class="b">dsh-ledger.ts: copy + manifest spec</text><text x="694" y="173.5" class="b">+ lockfile record move TOGETHER</text><text x="694" y="191" class="b">(#3496 convergeDshLedger)</text><text x="694" y="208.5" class="b">drift pre-exists ⇒ explicit demand</text><text x="694" y="226" class="b">only (bili doctor --fix)</text><text x="694" y="243.5" class="b">plugin-install.ts: drives the host's</text><text x="694" y="261" class="b">OWN channel (dsh plugin add), never</text><text x="694" y="278.5" class="b">installs a second copy beside it</text><text x="694" y="296" class="b">(#966/#991)</text><text x="1004" y="136" class="h">Advisory &amp; restart</text><text x="1004" y="156" class="b">advisory.ts: critical-defect watcher</text><text x="1004" y="173.5" class="b">(#1481) — advisory, human acts</text><text x="1004" y="191" class="b">update-notes.ts: tiered release-notes</text><text x="1004" y="208.5" class="b">(#1870 severe-only default)</text><text x="1004" y="226" class="b">restart.ts: opt-in self-restart once</text><text x="1004" y="243.5" class="b">newer code is on disk (#811)</text><text x="1004" y="261" class="b">plugin mode: code runs in the HOST</text><text x="1004" y="278.5" class="b">process → host restart needed; broken</text><text x="1004" y="296" class="b">injection is visible (#3581)</text><text x="58" y="448" class="s">Transient drift is acceptable and bounded (converge within one check cycle + host restart); permanent divergence is a bug. Local pins (link:/file:) are never refreshed by design.</text><text x="58" y="474" class="s">Security: the updater is in the human-review tier (§7.4) — it is the one module whose bug converts every future release into an outage.</text></svg>