<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720">
<style>text{font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif;}.tt{font-size:24px;font-weight:700;fill:#0f172a;}.sub{font-size:13px;fill:#475569;}.h{font-size:14px;font-weight:700;fill:#0f172a;}.b{font-size:12px;fill:#334155;}.s{font-size:11px;fill:#64748b;}.leg{font-size:11.5px;fill:#475569;}.warn{font-size:12px;fill:#b91c1c;}.num{font-size:11px;font-weight:700;fill:#fff;}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
<marker id="argr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker></defs>
<rect width="1240" height="720" fill="#ffffff"/><rect x="40" y="110" width="220" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="310" y="110" width="220" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="580" y="110" width="220" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><rect x="850" y="110" width="220" height="150" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="1120" y="110" width="90" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="40" y="330" width="360" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><rect x="440" y="330" width="360" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><rect x="840" y="330" width="360" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><rect x="40" y="585" width="1160" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="264" y1="185" x2="306" y2="185" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="534" y1="185" x2="576" y2="185" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="804" y1="185" x2="846" y2="185" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="1074" y1="185" x2="1116" y2="185" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">模块：请求管道（src/server + src/loop）</text><text x="40" y="70" class="sub">一次 HTTP 请求，从入站字节到出站流 —— 四种 wire、两种压缩模式</text><text x="54" y="136" class="h">入站</text><text x="54" y="156" class="b">客户端字节</text><text x="54" y="173.5" class="b">marker strip（src/marker/）：</text><text x="54" y="191" class="b">有序管道、四种 wire</text><text x="54" y="208.5" class="b">路由分诊：/__bili/* 还是模型 API</text><text x="324" y="136" class="h">prepare-*（按 wire）</text><text x="324" y="156" class="b">anthropic / openai /</text><text x="324" y="173.5" class="b">responses / google</text><text x="324" y="191" class="b">折叠 → 重建 → 注入</text><text x="324" y="208.5" class="b">system + nudge 落位</text><text x="594" y="136" class="h">acp-kernel</text><text x="594" y="156" class="b">（零改动）</text><text x="594" y="173.5" class="b">折叠判定 projectUnit</text><text x="594" y="191" class="b">blocks / refs / dead_refs</text><text x="594" y="208.5" class="b">摘要 + nudge flat 50K</text><text x="864" y="136" class="h">src/loop（统一）</text><text x="864" y="156" class="b">协议中立核心</text><text x="864" y="173.5" class="b">4 个 wire 适配器</text><text x="864" y="191" class="b">工具裁决</text><text x="864" y="208.5" class="b">tag-echo-filter：只滤散文、</text><text x="864" y="226" class="b">工具参数逐字节</text><text x="1134" y="136" class="h">上游</text><text x="1134" y="156" class="b"></text><text x="54" y="356" class="h">预检与闸门</text><text x="54" y="376" class="b">preflight.ts：hold 宽限、死路冷却</text><text x="54" y="393.5" class="b">reasoning-guard：签名载荷永不折叠</text><text x="54" y="411" class="b">request-body-budget：收/解/发字节预算</text><text x="54" y="428.5" class="b">content-encoding：解压炸弹守卫(413)</text><text x="454" y="356" class="h">错误与恢复</text><text x="454" y="376" class="b">stream-error：最小 SSE 错误+收尾</text><text x="454" y="393.5" class="b">fake-completion：可选重试提示</text><text x="454" y="411" class="b">degenerate-turn / degenerate-retry</text><text x="454" y="428.5" class="b">exit-matrix：wire 出口 × 关注点(#588)</text><text x="854" y="356" class="h">出站改写（stream-*）</text><text x="854" y="376" class="b">SSE 按 wire（openai/responses/google）</text><text x="854" y="393.5" class="b">cache-control 断点(#1637)</text><text x="854" y="411" class="b">pf-*/信封头永不出代理(hop 白名单)</text><text x="854" y="428.5" class="b">wire-body：尾 user 回合补位</text><text x="58" y="613" class="s">两种压缩模式走同一条管道（KDD #7）：plugin 车道——agent 自己压、载体是 tool call；proxy 模式——代理压、载体是 acp_summary 改口为 user。</text><text x="58" y="639" class="s">硬规则：thinking 族块签名验证、永不改写（#1960）；tool-call 参数是用户意图，逐字节转发（#1039）。</text></svg>