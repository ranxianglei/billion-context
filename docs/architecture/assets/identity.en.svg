<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760">
<style>text{font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif;}.tt{font-size:24px;font-weight:700;fill:#0f172a;}.sub{font-size:13px;fill:#475569;}.h{font-size:14px;font-weight:700;fill:#0f172a;}.b{font-size:12px;fill:#334155;}.s{font-size:11px;fill:#64748b;}.leg{font-size:11.5px;fill:#475569;}.warn{font-size:12px;fill:#b91c1c;}.num{font-size:11px;font-weight:700;fill:#fff;}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
<marker id="argr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker></defs>
<rect width="1240" height="760" fill="#ffffff"/><rect x="40" y="110" width="270" height="250" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="360" y="110" width="270" height="250" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="680" y="110" width="270" height="250" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="990" y="110" width="210" height="250" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="40" y="420" width="1160" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="314" y1="235" x2="356" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="634" y1="235" x2="676" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="954" y1="235" x2="986" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">Module: session &amp; message identity</text><text x="40" y="70" class="sub">which session a request belongs to, which messages are new, and what identity survives the wire</text><text x="54" y="136" class="h">Session identity</text><text x="54" y="156" class="b">client id verbatim (native stable id</text><text x="54" y="173.5" class="b">preferred, #280)</text><text x="54" y="191" class="b">anonymous → prefix-affinity pfa-*</text><text x="54" y="208.5" class="b">(first-writer provenance #2879)</text><text x="54" y="226" class="b">persona fork: subagentNamespace(id,</text><text x="54" y="243.5" class="b">system) — evidence permitlist (dsh</text><text x="54" y="261" class="b">#1104/#2156), first system anchors</text><text x="54" y="278.5" class="b">the raw key, side requests never do</text><text x="374" y="136" class="h">Message identity</text><text x="374" y="156" class="b">rung: msgid &gt; order &gt; hash (#11)</text><text x="374" y="173.5" class="b">msgid = host envelope, per-element,</text><text x="374" y="191" class="b">stripped at ingest — never on the</text><text x="374" y="208.5" class="b">model wire (#4491/#4834/#5842)</text><text x="374" y="226" class="b">ledger key: (session_id, msg_id,</text><text x="374" y="243.5" class="b">content_hash) — id decides, hash is</text><text x="374" y="261" class="b">the safety belt</text><text x="374" y="278.5" class="b">order = primary carrier for legacy</text><text x="374" y="296" class="b">full-resend (reconcile ladder)</text><text x="694" y="136" class="h">Server-side render</text><text x="694" y="156" class="b">D-lane snapshot render (#3756):</text><text x="694" y="173.5" class="b">outbound PREFIX from server transcript,</text><text x="694" y="191" class="b">row seq = message identity, tail stays</text><text x="694" y="208.5" class="b">client-verbatim (cache-stable)</text><text x="694" y="226" class="b">any desync → whole turn falls back to</text><text x="694" y="243.5" class="b">legacy (degrade, never guess)</text><text x="694" y="261" class="b">reconcileFoldCoverage keeps observing</text><text x="694" y="278.5" class="b">the client view (observe ≠ render)</text><text x="1004" y="136" class="h">Docs</text><text x="1004" y="156" class="b">message-identity.md</text><text x="1004" y="173.5" class="b">session-identity.md</text><text x="1004" y="191" class="b">identity-channels.md</text><text x="1004" y="208.5" class="b">msgid-infrastructure.md</text><text x="1004" y="226" class="b">session-identity-</text><text x="1004" y="243.5" class="b">resolution.md</text><text x="58" y="448" class="s">Identity dimensions survive different churn: order, content and stable ids have their own survival domains; every reconcile rung fails soft.</text><text x="58" y="474" class="s">P8 (foundation proposal #5643): (sess_raw, ledger_id) first-seen, never deleted, answers identically across restarts — the l1_world table is its planned home.</text>
<g>
<text x="40" y="529" class="h">Seeded DSH inheritance: one verified path, separate session ownership</text>
<rect x="40" y="545" width="340" height="155" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="54" y="569" class="h">Host gate + actual child history</text>
<text x="54" y="593" class="b">Ordinary fork / sidechat / seeded subagent</text>
<text x="54" y="613" class="b">isSeeded + validated source parent</text>
<text x="54" y="633" class="b">Ordered raw identities + opaque payloads</text>
<text x="54" y="653" class="b">Prove both endpoints of every tool pair</text>
<text x="54" y="679" class="s">Fresh child without inherited context: no adoption</text>
<line x1="389" y1="620" x2="439" y2="620" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="450" y="545" width="330" height="155" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="464" y="569" class="h">Verify parent originals + block closure</text>
<text x="464" y="593" class="b">Exact payload, pair ownership and refs</text>
<text x="464" y="613" class="b">Logical order comes from parent snapshot</text>
<text x="464" y="633" class="b">Only proven bounded reasoning may be absent</text>
<text x="464" y="653" class="b">Copy complete blocks + nested originals</text>
<text x="464" y="679" class="s">Never substitute the parent's latest tip</text>
<line x1="789" y1="620" x2="839" y2="620" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="850" y="545" width="350" height="155" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="864" y="569" class="h">Revalidate every send + cold restore</text>
<text x="864" y="593" class="b">Keep child insertions and valid inherited folds</text>
<text x="864" y="613" class="b">Content / order / ref / tool-pair drift:</text>
<text x="864" y="633" class="b">discard affected blocks + consuming ancestors</text>
<text x="864" y="653" class="b">Persist actual raw view before rendering</text>
<text x="864" y="679" class="s">Issued refs stay reserved; no identity reuse</text>
<text x="40" y="730" class="s">Event boundaries, first-ingestion row seq and logical message order are distinct coordinates. Legacy callers keep the provider-prefix protocol.</text>
</g>
</svg>