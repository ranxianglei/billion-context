<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
<style>text{font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif;}.tt{font-size:24px;font-weight:700;fill:#0f172a;}.sub{font-size:13px;fill:#475569;}.h{font-size:14px;font-weight:700;fill:#0f172a;}.b{font-size:12px;fill:#334155;}.s{font-size:11px;fill:#64748b;}.leg{font-size:11.5px;fill:#475569;}.warn{font-size:12px;fill:#b91c1c;}.num{font-size:11px;font-weight:700;fill:#fff;}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
<marker id="argr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker></defs>
<rect width="1240" height="560" fill="#ffffff"/><rect x="40" y="110" width="250" height="300" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="350" y="110" width="250" height="300" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="660" y="110" width="250" height="300" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="970" y="110" width="230" height="300" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="40" y="420" width="1160" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="294" y1="260" x2="346" y2="260" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="604" y1="260" x2="656" y2="260" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="914" y1="260" x2="966" y2="260" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">Module: host lanes (src/agent + src/server/lane-decisions)</text><text x="40" y="70" class="sub">who carries the request in, how it is attributed, and which processing lane it takes</text><text x="54" y="136" class="h">Host plugins (per-host)</text><text x="54" y="156" class="b">dsh shim (anthropic divert)</text><text x="54" y="173.5" class="b">pi entry-walker (+ omp re-export)</text><text x="54" y="191" class="b">opencode V1/V2 transform hooks</text><text x="54" y="208.5" class="b">codex Responses-over-WebSocket</text><text x="54" y="226" class="b">claude hook (lane token #5095)</text><text x="54" y="243.5" class="b">kimi / zcode native TOML lanes</text><text x="54" y="261" class="b">each: a -native bootstrap gate</text><text x="54" y="278.5" class="b">+ native-intercept fetch routing</text><text x="364" y="136" class="h">Identity &amp; attribution</text><text x="364" y="156" class="b">session id: request header, verbatim</text><text x="364" y="173.5" class="b">per-element host msgid: envelope only,</text><text x="364" y="191" class="b">stripped at ingest (#4491/#5842)</text><text x="364" y="208.5" class="b">persona fingerprint (dsh, evidence</text><text x="364" y="226" class="b">permitlist #1104) → |sub:&lt;fp&gt; fork</text><text x="364" y="243.5" class="b">attribution reports → panel (#3581)</text><text x="364" y="261" class="b">anonymous: prefix-affinity pfa-*</text><text x="364" y="278.5" class="b">(simhash chain #2265)</text><text x="674" y="136" class="h">lane-decisions.ts</text><text x="674" y="156" class="b">single resolver (#3417)</text><text x="674" y="173.5" class="b">request shape × session sticky bind</text><text x="674" y="191" class="b">+ one row: foundation-lane hit</text><text x="674" y="208.5" class="b">(negative+positive pair, #3617)</text><text x="674" y="226" class="b">decides: incremental / v5 / D-lane</text><text x="674" y="243.5" class="b">/ legacy per request</text><text x="984" y="136" class="h">processing lanes</text><text x="984" y="156" class="b">incremental plugin-turn lane</text><text x="984" y="173.5" class="b">(anthropic wire divert)</text><text x="984" y="191" class="b">v5 watermark fastpath (5% cohort)</text><text x="984" y="208.5" class="b">D-lane snapshot render (#3756)</text><text x="984" y="226" class="b">legacy full-resend path</text><text x="984" y="243.5" class="b">(default + safety net)</text><text x="58" y="448" class="s">One request = one lane, decided per request, sticky per session (upgrade-only). Lanes share the kernel and the storage; they differ only in how much of the wire work they skip.</text><text x="58" y="474" class="s">Launcher posture: bili &lt;client&gt; (launcher.ts) auto-proxies both schemes; plugin posture: host loads dist/agent/&lt;entry&gt;.js in-process (default inline for pi, #5428).</text></svg>