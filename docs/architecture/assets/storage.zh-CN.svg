<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <style>
    text { font-family: 'Noto Sans CJK SC','Droid Sans Fallback',sans-serif; }
    .tt { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 12px; fill: #475569; }
    .h  { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .b  { font-size: 11.5px; fill: #1e293b; }
    .s  { font-size: 10.5px; fill: #475569; }
    .chip { font-size: 10.5px; fill: #334155; }
    .warn { font-size: 11.5px; fill: #7f1d1d; font-weight: 700; }
    .warnb { font-size: 10.5px; fill: #991b1b; }
    .ok { font-size: 11px; fill: #166534; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="720" fill="#ffffff"/>
  <text x="30" y="40" class="tt">模块 · 统一存储（src/persist.ts + src/storage/）</text>
  <text x="30" y="62" class="sub">单一 SQLite 文件、单一 WAL 写者 —— 行级真源；kstate JSON 是与它并行的第二真源（痛点①）</text>

  <!-- writers -->
  <text x="30" y="100" class="h">写入侧（谁在写）</text>
  <rect x="30" y="112" width="300" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="46" y="136" class="b">src/storage/ingest.ts — 统一视图批量写</text>
  <text x="46" y="154" class="s">稳定绝对 seq · 内容哈希 id（identityOfStoredContent）</text>
  <text x="46" y="170" class="s">边界帧 boundaryMsgId 随批落表</text>

  <rect x="30" y="200" width="300" height="66" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="46" y="224" class="b">src/persist.ts — 会话持久化（StateStore）</text>
  <text x="46" y="242" class="s">会话文件落盘 / 加载 · EPERM 告警层 persist-eperm</text>

  <rect x="30" y="278" width="300" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="46" y="302" class="b">kernel/ — 压缩状态写入</text>
  <text x="46" y="320" class="s">blocks / refs / dead_refs / checkpoints</text>
  <text x="46" y="336" class="s">（kernel 自带 StateStore 接口，host 换实现）</text>

  <rect x="30" y="356" width="300" height="66" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="46" y="380" class="warn">kstate JSON — hydration 字段清单（平行真源）</text>
  <text x="46" y="398" class="warnb">CompressionState 存活字段经 mergeState() 序列化</text>
  <text x="46" y="414" class="warnb">与表双通道读写 —— 分叉点，演进提案要消除</text>

  <!-- DB band -->
  <rect x="430" y="112" width="480" height="310" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="450" y="140" class="h">统一 SQLite · schema v11（#5539 FK 子索引）</text>
  <g>
    <rect x="450" y="156" width="130" height="28" rx="5" fill="#e0e7ff" stroke="#6366f1"/><text x="515" y="175" class="chip" text-anchor="middle">sessions</text>
    <rect x="590" y="156" width="130" height="28" rx="5" fill="#e0e7ff" stroke="#6366f1"/><text x="655" y="175" class="chip" text-anchor="middle">content</text>
    <rect x="730" y="156" width="160" height="28" rx="5" fill="#e0e7ff" stroke="#6366f1"/><text x="810" y="175" class="chip" text-anchor="middle">messages（msgId=规范id）</text>
    <rect x="450" y="192" width="130" height="28" rx="5" fill="#e0e7ff" stroke="#6366f1"/><text x="515" y="211" class="chip" text-anchor="middle">blocks</text>
    <rect x="590" y="192" width="130" height="28" rx="5" fill="#e0e7ff" stroke="#6366f1"/><text x="655" y="211" class="chip" text-anchor="middle">dead_refs</text>
    <rect x="730" y="192" width="160" height="28" rx="5" fill="#e0e7ff" stroke="#6366f1"/><text x="810" y="211" class="chip" text-anchor="middle">refs</text>
    <rect x="450" y="228" width="130" height="28" rx="5" fill="#e0e7ff" stroke="#6366f1"/><text x="515" y="247" class="chip" text-anchor="middle">checkpoints</text>
    <rect x="590" y="228" width="130" height="28" rx="5" fill="#e0e7ff" stroke="#6366f1"/><text x="655" y="247" class="chip" text-anchor="middle">ccr_entries</text>
    <rect x="730" y="228" width="160" height="28" rx="5" fill="#e0e7ff" stroke="#6366f1"/><text x="810" y="247" class="chip" text-anchor="middle">kv_store</text>
    <rect x="450" y="264" width="130" height="28" rx="5" fill="#e0e7ff" stroke="#6366f1"/><text x="515" y="283" class="chip" text-anchor="middle">message_media</text>
    <rect x="590" y="264" width="130" height="28" rx="5" fill="#e0e7ff" stroke="#6366f1"/><text x="655" y="283" class="chip" text-anchor="middle">conversations</text>
    <rect x="730" y="264" width="160" height="28" rx="5" fill="#e0e7ff" stroke="#6366f1"/><text x="810" y="283" class="chip" text-anchor="middle">session_ext</text>
  </g>
  <rect x="450" y="308" width="340" height="30" rx="5" fill="#fff" stroke="#6366f1" stroke-dasharray="5 4"/>
  <text x="620" y="328" class="chip" text-anchor="middle">PF 四表（#5855 open，待合入后叠加）：pf_rows / pf_log / pf_ckpt / render 面</text>
  <text x="450" y="364" class="s">单文件单 WAL 写者 · 迁移=版本化 DDL（CREATE IF NOT EXISTS 纯加性）</text>
  <text x="450" y="382" class="s">可选加密：AES-256-GCM（#708）+ zstd（#1080）；mysql 方言为测试镜像（src/storage/mysql.ts）</text>
  <text x="450" y="400" class="s">完整性：checkpoint 帧签名 + S4 逐行校验和（判决只认链，不认内容相似）</text>

  <!-- readers -->
  <text x="1030" y="100" class="h">消费侧（谁在读）</text>
  <rect x="1030" y="112" width="340" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="1046" y="136" class="b">水合 — src/state-hydration.ts mergeState()</text>
  <text x="1046" y="154" class="s">CompressionState 存活字段单一事实源（表 + kstate 拼装）</text>

  <rect x="1030" y="184" width="340" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="1046" y="208" class="b">出站 — fold-reconcile / snapshot-render（#3756）</text>
  <text x="1046" y="226" class="s">折叠覆盖核对 + 服务端正史渲染（失步整轮回落 legacy）</text>

  <rect x="1030" y="256" width="340" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="1046" y="280" class="b">计费与缓存账 — cache-ledger / billing</text>
  <text x="1046" y="298" class="s">每轮 token/USD 记账 · CCR 内容取回 store.ts</text>

  <rect x="1030" y="328" width="340" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="1046" y="352" class="b">展示与导出 — sessions-data / acp_status / export</text>
  <text x="1046" y="370" class="s">Web 面板会话树 · 状态面 · 会话导出（诚实输出 #155）</text>

  <rect x="1030" y="400" width="340" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="1046" y="424" class="b">维护 — state-gc / storage-maintenance / orphan-gc</text>
  <text x="1046" y="442" class="s">孤儿块 GC · 存储 GC（sessions.gc.* 可选）· 死 ref 回收</text>

  <!-- bottom invariants -->
  <rect x="30" y="492" width="1340" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="520" class="h">硬不变量（改这里前先读 AGENTS.md）</text>
  <text x="50" y="546" class="b">· 消息 id 永不复用（kernel 契约）：messages.msgId 是 bili/内核规范 id —— 宿主 msgid 至今没有落点（痛点②，#5842 只解 in-flight）</text>
  <text x="50" y="570" class="b">· 稳定绝对 seq（#421 修复）：行序即身份主载体；折叠=inactive 标记，不物理删（物理清由 GC 按覆盖块生命周期做）</text>
  <text x="50" y="594" class="b">· 升级纯加性：schema 版本只进不退，老库 CREATE IF NOT EXISTS 到位 —— 任何破坏性迁移必须先有回滚演练（T1 纪律）</text>

  <!-- arrows -->
  <g stroke="#334155" fill="none" stroke-width="1.6">
    <path d="M330,150 H430" marker-end="url(#ar)"/>
    <path d="M330,233 H430" marker-end="url(#ar)"/>
    <path d="M330,311 H430" marker-end="url(#ar)"/>
    <path d="M430,505 H1030"/>
    <path d="M1030,142 H1000"/>
    <path d="M1000,142 V430"/>
    <path d="M1000,142 H1030" marker-end="url(#ar)"/>
    <path d="M1000,214 H1030" marker-end="url(#ar)"/>
    <path d="M1000,286 H1030" marker-end="url(#ar)"/>
    <path d="M1000,358 H1030" marker-end="url(#ar)"/>
    <path d="M1000,430 H1030" marker-end="url(#ar)"/>
  </g>
  <g stroke="#b91c1c" fill="none" stroke-width="1.4" stroke-dasharray="5 4">
    <path d="M330,389 H430" marker-end="url(#arra)"/>
  </g>
  <text x="352" y="380" class="warnb">kstate 双通道</text>

  <text x="30" y="660" class="s">关键入口：src/storage/schema.ts（DDL 唯一事实源）· src/storage/store.ts（行读写）· src/storage/ingest.ts（批量入口）· src/persist.ts（StateStore 包装）· src/state-hydration.ts（字段清单）</text>
</svg>
