<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,3 L0,6 z" fill="#3a5a8a"/></marker></defs>
<rect width="1240" height="470" fill="#ffffff"/>
<text x="40" y="36" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#1a2b4a">fork 与回退</text>
<rect x="40" y="70" width="220" height="90" rx="8" fill="#eaf1fb" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="52" y="90" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">父会话</text>
<text x="52" y="110" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">egress_flow + state</text>
<text x="52" y="125" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">block_flow + block_state</text>
<text x="52" y="140" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">sessions 行</text>
<rect x="340" y="60" width="400" height="100" rx="8" fill="#e8f6ec" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="352" y="80" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">fork-to-now（默认）</text>
<text x="352" y="100" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">四张表逐字拷贝 + sessions</text>
<text x="352" y="115" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">子会话两时钟各自独立继续</text>
<rect x="340" y="200" width="400" height="170" rx="8" fill="#fdeedd" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="352" y="220" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">真·点位 fork（水位 wm = flow 的 op_seq）</text>
<text x="352" y="240" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">flow 行：op_seq &lt;= wm</text>
<text x="352" y="255" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">块行：flow_op_seq &lt;= wm（用指针，</text>
<text x="352" y="270" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">不是块自己的编号——双时钟的意义）</text>
<text x="352" y="285" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">然后重放重建两个 state 副本</text>
<text x="352" y="300" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">低于最新 base ⇒ 拒绝（400）：</text>
<text x="352" y="315" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">保守门，非数据约束（flow 保留了那些行）</text>
<text x="352" y="330" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">（point-reconstruction materializer 落地前）</text>
<rect x="820" y="70" width="380" height="130" rx="8" fill="#f3e6f5" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="832" y="90" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">回滚 / 降级（关开关或跑旧二进制）</text>
<text x="832" y="110" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">messages 惰性投影从 flow 一次性 O(n) 重建</text>
<text x="832" y="125" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">legacy 读者（messages+信封）看到字节完整会话</text>
<text x="832" y="140" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">egress 行保留；重新开启零迁移</text>
<text x="832" y="155" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">旧二进制读不了冻结信封 ⇒ 回滚只能走这条</text>
<rect x="820" y="240" width="380" height="120" rx="8" fill="#f3e6f5" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="832" y="260" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">降级阶梯（每轮独立）</text>
<text x="832" y="280" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">任何不可建行 / 损坏点 / 探针失败</text>
<text x="832" y="295" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">⇒ 整轮 legacy，绝不部分替换</text>
<text x="832" y="310" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">无健康点 ⇒ 响亮硬失败（7439-5）</text>
<line x1="260" y1="100" x2="336" y2="100" stroke="#3a5a8a" stroke-width="1.8" marker-end="url(#ah)"/><line x1="260" y1="130" x2="336" y2="260" stroke="#3a5a8a" stroke-width="1.8" marker-end="url(#ah)"/><text x="298" y="185" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11" fill="#7a3b0f" text-anchor="middle" font-weight="bold">wm = 历史某点</text><line x1="740" y1="130" x2="816" y2="130" stroke="#3a5a8a" stroke-width="1.8" marker-end="url(#ah)"/><text x="778" y="120" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11" fill="#7a3b0f" text-anchor="middle" font-weight="bold">opt-out / 旧版本</text><rect x="340" y="400" width="860" height="55" rx="8" fill="#fff6e6" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="352" y="420" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">保留底线 = 最新 B base</text>
<text x="352" y="440" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">低于它的历史 flow 全部保留（append-only，#7439）⇒ 低于它的 fork 点仍拒绝（保守门，绝不猜测）；块行永远跟着 flow 指针走，点位切片不串表</text>
</svg>