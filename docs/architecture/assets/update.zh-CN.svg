<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
<style>text{font-family:'Noto Sans CJK SC','Droid Sans Fallback',sans-serif;}.tt{font-size:24px;font-weight:700;fill:#0f172a;}.sub{font-size:13px;fill:#475569;}.h{font-size:14px;font-weight:700;fill:#0f172a;}.b{font-size:12px;fill:#334155;}.s{font-size:11px;fill:#64748b;}.leg{font-size:11.5px;fill:#475569;}.warn{font-size:12px;fill:#b91c1c;}.num{font-size:11px;font-weight:700;fill:#fff;}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
<marker id="argr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#059669"/></marker></defs>
<rect width="1240" height="560" fill="#ffffff"/><rect x="40" y="110" width="260" height="250" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="360" y="110" width="260" height="250" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="680" y="110" width="260" height="250" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="990" y="110" width="210" height="250" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="40" y="420" width="1160" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><line x1="304" y1="235" x2="356" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="624" y1="235" x2="676" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><line x1="944" y1="235" x2="986" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="44" class="tt">模块：自更新与安装车道（src/update.ts + 车道模块）</text><text x="40" y="70" class="sub">一份 bili 如何安全地拿到最新版本 —— 不炸任何机器</text><text x="54" y="136" class="h">自更新器（update.ts）</text><text x="54" y="156" class="b">npm 注册表检查、3 分钟节拍（可旋钮</text><text x="54" y="173.5" class="b">覆盖 #2030）；每进程首查忽略节流</text><text x="54" y="191" class="b">tarball 解包，不是 npm install（用户</text><text x="54" y="208.5" class="b">机器上不跑 lifecycle 脚本）</text><text x="54" y="226" class="b">全局安装就地换包</text><text x="54" y="243.5" class="b">承重件：更新器坏 = 以后每次升级都</text><text x="54" y="261" class="b">砖 → 任何改动前先 NO-OP 发版验证</text><text x="374" y="136" class="h">安装车道（#991/#1196）</text><text x="374" y="156" class="b">每份拷贝一个写者，由安装来源定</text><text x="374" y="173.5" class="b">全局（npm -g）：就地自更新</text><text x="374" y="191" class="b">引用车道（omp/claude/codex/kimi/</text><text x="374" y="208.5" class="b">zcode/hermes）：指全局 dist、无拷贝</text><text x="374" y="226" class="b">宿主世界（dsh bundle、opencode/pi</text><text x="374" y="243.5" class="b">树）：走宿主自己的通道更新 —— 全局自</text><text x="374" y="261" class="b">更新驱动 + 拷贝自己的周期检查兜底</text><text x="694" y="136" class="h">三账收敛</text><text x="694" y="156" class="b">dsh-ledger.ts：拷贝 + manifest 声明</text><text x="694" y="173.5" class="b">+ lockfile 记录一起动（#3496</text><text x="694" y="191" class="b">convergeDshLedger）</text><text x="694" y="208.5" class="b">既有漂移只在显式要求时收敛（bili</text><text x="694" y="226" class="b">doctor --fix）</text><text x="694" y="243.5" class="b">plugin-install.ts：只驱动宿主自己的</text><text x="694" y="261" class="b">通道（dsh plugin add），绝不在旁边</text><text x="694" y="278.5" class="b">装第二份（#966/#991）</text><text x="1004" y="136" class="h">通告与重启</text><text x="1004" y="156" class="b">advisory.ts：严重缺陷观察者(#1481)——</text><text x="1004" y="173.5" class="b">只通告、人来处置</text><text x="1004" y="191" class="b">update-notes.ts：分级 release-notes</text><text x="1004" y="208.5" class="b">(#1870 默认只 severe)</text><text x="1004" y="226" class="b">restart.ts：新代码落盘后可选自重启</text><text x="1004" y="243.5" class="b">(#811)</text><text x="1004" y="261" class="b">插件模式：代码跑在宿主进程里 → 需要</text><text x="1004" y="278.5" class="b">宿主重启；注入坏掉要可见(#3581)</text><text x="58" y="448" class="s">瞬态漂移可接受且有界（一个检查周期 + 宿主重启内收敛）；永久分叉是 bug。本地 pin（link:/file:）按设计永不自动刷新。</text><text x="58" y="474" class="s">安全面：更新器在人工评审档（§7.4）—— 它是唯一「自己的 bug 会把以后每次发版变成事故」的模块。</text></svg>