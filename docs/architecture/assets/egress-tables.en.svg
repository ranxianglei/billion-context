<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,3 L0,6 z" fill="#3a5a8a"/></marker></defs>
<rect width="1240" height="500" fill="#ffffff"/>
<text x="40" y="22" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#1a2b4a">Egress plane tables (dual clocks + one-way pointer; materialized state, #7773)</text>
<rect x="40" y="70" width="360" height="190" rx="8" fill="#fdeedd" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="52" y="90" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">egress_flow — message op log (authority)</text>
<text x="52" y="110" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">PK (session_id, op_seq), dense within the table</text>
<text x="52" y="125" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">row_type: I insert / D delete / U update (no B)</text>
<text x="52" y="140" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">I rows: msgid + rid (canonical, one-shot;</text>
<text x="52" y="155" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">never reissued); frontier = MAX(rid) flow</text>
<text x="52" y="170" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">D rows: (start, end) rid range + terminal</text>
<text x="52" y="185" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">full snapshot; U: new bytes, never a number</text>
<text x="52" y="200" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">append-only: nothing ever prunes it (#7439);</text>
<text x="52" y="215" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">any point stays reconstructible (egressStateAt)</text>
<text x="52" y="230" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7a3b0f" font-weight="bold">the retired B base row is gone (#7773)</text>
<rect x="40" y="290" width="360" height="120" rx="8" fill="#eaf1fb" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="52" y="310" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">egress_state — materialized live view</text>
<text x="52" y="330" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">PK (session_id, rid); pos-ordered, one row</text>
<text x="52" y="345" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">per LIVE message; no compaction, no base row</text>
<text x="52" y="360" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">Same-tx apply: I inserts + shifts, U in-place,</text>
<text x="52" y="375" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">D physically deletes + shifts (7773)</text>
<text x="52" y="390" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">snapPinLiveIds / serving reads hit it; damaged</text>
<text x="52" y="405" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">copy rebuilt by full-history replay, then served</text>
<rect x="460" y="70" width="360" height="190" rx="8" fill="#fdeedd" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="472" y="90" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">egress_block_flow — block history (own clock)</text>
<text x="472" y="110" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">PK (session_id, op_seq) — its own number pool</text>
<text x="472" y="125" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">row_type: I born / U changed / D reaped (no B)</text>
<text x="472" y="140" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">D rows carry the block's FULL terminal snapshot</text>
<text x="472" y="155" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">snapshot: {tier, startMsgid, startSeq,</text>
<text x="472" y="170" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">endMsgid, endSeq, supersedesBlockId,</text>
<text x="472" y="185" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">active, reaped, one, full}</text>
<text x="472" y="200" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">one = block full text (full = complete JSON)</text>
<text x="472" y="215" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">kstate sidecar: residual field list</text>
<text x="472" y="230" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7a3b0f" font-weight="bold">append-only, like the message flow</text>
<rect x="460" y="290" width="360" height="120" rx="8" fill="#eaf1fb" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="472" y="310" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">egress_block_state — materialized live blocks</text>
<text x="472" y="330" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">PK (session_id, block_id); pos-ordered, one</text>
<text x="472" y="345" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">row per non-reaped block; reap physically</text>
<text x="472" y="360" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">deletes the row (flow keeps the terminal D)</text>
<text x="472" y="375" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">snapshot payload + pos + op_seq/flow_op_seq</text>
<text x="472" y="390" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">On-demand decompress reads the flow's D rows</text>
<rect x="880" y="70" width="320" height="110" rx="8" fill="#e8f6ec" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="892" y="90" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">sessions.r3_latched_at (#7617)</text>
<text x="892" y="110" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">R3 identity-fault latch; NULL/0 = not latched</text>
<text x="892" y="125" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">Dual carrier: reads fall back to the legacy l1_world column</text>
<text x="892" y="140" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">Clear resets BOTH carriers</text>
<rect x="880" y="220" width="320" height="140" rx="8" fill="#f3f3f3" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="892" y="240" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">conversations (retiring)</text>
<text x="892" y="260" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">Host-identity claim table</text>
<text x="892" y="275" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">egress-on no longer needs a claim (stateless)</text>
<text x="892" y="290" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">Physical DROP on the retirement register</text>
<text x="892" y="305" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">(deprecations.md)</text>
<line x1="400" y1="350" x2="456" y2="350" stroke="#3a5a8a" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 640 70 L 640 62 L 220 62 L 220 70" fill="none" stroke="#3a5a8a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="430" y="38" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7a3b0f" text-anchor="middle" font-weight="bold">flow_op_seq = flow.MAX(op_seq) at write time</text><text x="430" y="50" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11" fill="#7a3b0f" text-anchor="middle">non-decreasing, so &lt;= X is a prefix; point forks filter block rows by it</text>
<rect x="880" y="390" width="320" height="90" rx="8" fill="#fff6e6" stroke="#3a5a8a" stroke-width="1.5"/>
<text x="892" y="410" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a2b4a">Structural invariants (7773 §6, every write)</text>
<text x="892" y="430" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">flow rows never shrink · state rows == live view ·</text>
<text x="892" y="445" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">max value == max single row · row alphabet I/D/U</text>
<text x="892" y="460" font-family="Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">(message) / I/U/D (block) — egress-invariants test</text>
</svg>
