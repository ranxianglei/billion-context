name: billion-context
version: "0.0.0"
description: "billion-context ACP context compression for Hermes: native compress/decompress/acp_status tools, self-spawning proxy on an ephemeral port, plugin-mode headers (installed by `bili plugin install hermes`)"
author: ranxianglei
provides_tools:
  - compress
  - decompress
  - acp_status
  - acp_cache
  - search_context
  # withheld when imageRescale is off; the host warns on declared-but-unregistered, never fails
  - acp_read_original_image
provides_hooks:
  - pre_api_request
provides_middleware:
  - llm_request
# alias for hosts that predate provides_hooks (plugins_cmd_catalog reads provides_hooks, then hooks)
hooks:
  - pre_api_request
